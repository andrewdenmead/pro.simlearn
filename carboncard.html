<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Carbon Card (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
/* AE sources: research extracts with a full reference, not emails (Andrew, 10 Nov 2026) */
.sech{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:4px 0 -2px}
.src summary{display:flex;flex-direction:column;gap:2px}
.src .stitle{font-family:var(--serif);font-size:1.08rem;line-height:1.35;color:var(--ink);font-weight:600}
.src.unread .stitle{font-weight:700}
.src .sauth{font-size:14.5px;color:var(--ink)}
.src .saff{font-size:13px;color:var(--muted)}
.card>.cite,.mail .body .cite{font-family:var(--ui);font-size:14px;line-height:1.5;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px}
.cite .ref{color:var(--ink);user-select:all;-webkit-user-select:all}
.cite .lnk{margin-left:8px}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.news{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:6px 0 4px}
.news .paper{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0}
.news .headline{font-family:var(--serif);font-size:1.25rem;margin:10px 0 4px}
.news .stand{font-weight:600;margin:4px 0}
.news .byline{font-size:13px;color:var(--muted);margin:0 0 6px}
.news>p:not(.paper):not(.byline){font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.news>p{margin:0 0 10px}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}

<header><div class="wrap">

<div id="hlpal" hidden role="dialog" aria-label="Highlight colour"><button class="simpb" data-simple="1" hidden>Say it simply</button><button data-hlc="yellow" style="background:#FFF176" aria-label="Yellow"></button><button data-hlc="green" style="background:#B9F6CA" aria-label="Green"></button><button data-hlc="pink" style="background:#F8BBD0" aria-label="Pink"></button><button data-hlc="blue" style="background:#B3E5FC" aria-label="Blue"></button><button data-hlc="orange" style="background:#FFE0B2" aria-label="Orange"></button><button data-hlc="purple" style="background:#E1BEE7" aria-label="Purple"></button><button data-hlc="none" class="none" aria-label="Remove highlight">✕</button></div>
<button id="fab" data-act="nbopen" hidden>Notes (0)</button>
<aside id="nb" hidden aria-label="Your highlights and notes"></aside>

<script>
// The background as a citable news article (Andrew, 10 Nov 2026): students cite it like any source (make_carboncardpro reads it)
const NEWS={paper:"The Northern Ledger",date:"12 March 2035",author:"Tom Avery",headline:"Four years of the carbon card: emissions down, questions up",
 standfirst:"Four years after every adult was given a personal carbon allowance, a review will decide what happens to it next.",
 paras:["In April 2031, the UK did something governments had discussed for decades and always rejected: it gave every adult a personal carbon allowance. Each person receives an allowance of carbon for home energy, road fuel and flights, and it shrinks a little every year. A \"carbon card\", linked to the holder's bank card, records the units used at the till or on the energy bill. Anyone who uses less than their allowance can sell the spare units; anyone who uses more has to buy extra from people who have some to sell.",
  "Four years later, household emissions from energy and travel have fallen faster than almost anyone predicted, and the money changing hands has produced some surprising winners and losers. It also means that, for the first time, a public authority knows how much carbon every adult in the country uses, and when.",
  "The scheme still covers only part of what people consume: food, clothes and other goods are not included. The government has now set up a Carbon Allowance Review to decide what should happen next."],
 cite:"Avery, T. (2035) 'Four years of the carbon card: emissions down, questions up', The Northern Ledger, 12 March, p. 6."};
const ROLES={
 A:{name:"Results Analyst",line:"Did it work?",detail:"You weigh the evidence on why household emissions fell so fast after 2031. Your sources are the main comparison with other countries and the strongest argument that energy prices did the work."},
 B:{name:"Liberty Adviser",line:"Freedom and privacy",detail:"You advise the review on whether a public record of each person's carbon use is an acceptable price for cutting emissions. Your sources are the two most cited papers, one on each side of that question."},
 C:{name:"Policy Adviser",line:"What next",detail:"You draft the review's recommendation. Your sources make the case for each of the two options the government has asked the review to compare."}
};
const REL={high:"Peer-reviewed or independent",medium:"Survey, estimate or personal view",low:"Weak evidence"};
const fmt=n=>"£"+n.toLocaleString("en-GB");

function hbar(rows,o){
  const W=500,left=110,right=48,rowH=32,top=8,H=top+rows.length*rowH+24,min=o.min,max=o.max;
  const x=v=>left+(v-min)/(max-min)*(W-left-right);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">`;
  o.ticks.forEach(t=>s+=`<line class="${t?'axis':'zero'}" x1="${x(t)}" x2="${x(t)}" y1="${top-4}" y2="${H-20}"/><text x="${x(t)}" y="${H-5}" text-anchor="middle">${t}${o.unit}</text>`);
  rows.forEach((r,i)=>{const y=top+i*rowH,a=x(0),b=x(r.v);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="${r.hi?'neg':'pos'}" x="${a}" y="${y+6}" width="${Math.max(2,b-a)}" height="${rowH-13}" rx="2"/><text class="val" x="${b+6}" y="${y+18}">${r.v}${o.unit}</text>`;});
  return s+"</svg>";
}
function donut(l,p){const c=2*Math.PI*38;return `<figure><svg viewBox="0 0 100 100" width="84" height="84" role="img" aria-label="${l} ${p}%"><circle class="ring-bg" cx="50" cy="50" r="38" stroke-width="12"/><circle class="ring" cx="50" cy="50" r="38" stroke-width="12" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text class="val" x="50" y="55" text-anchor="middle" style="font-size:15px">${p}%</text></svg><figcaption class="muted">${l}</figcaption></figure>`;}
const PRO_COVER="";   // the cover picture (build.py fills this in)
const PRO_AUDIO=[];   // the recordings published next to the page (build.py fills this in)
function audio(t,voice,script,file){if(file&&PRO_AUDIO.includes(file))return `<div class="audio rec"><div style="flex:1;min-width:0"><div class="t">${t}</div><audio controls preload="none" data-f="${file}" src="audio/${file}.mp3" style="width:100%;margin-top:6px"></audio></div><details data-tf="${file}" ${(S.heard||{})[file]?"":"hidden"} ${(S.tOpen||{})[file]?"open":""}><summary>Show the text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;
 return `<div class="audio"><button class="play" disabled aria-label="Play (recording to come)">▶</button><div><div class="t">${t}</div><div class="s">Recording to come: read the text</div></div><details open><summary>The text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;}
function mail(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k];
 return `<details class="mail ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="from">${whoMailAv(m.from)}${r?"":`<span class="udot" aria-label="Unread"></span>`}<span class="lbl">From:</span> ${m.from}</span><span class="subj">${m.subj}</span></summary><div class="body" data-src="${m.from.split(",")[0]}" data-q="${m.rel}">${m.body}</div></details>`;}
/* a research source (AE, 10 Nov 2026): title, author (year), affiliation, the extract and its full reference. `from`
   and `subj` stay as the author and title, so read state and the cartridge (make_carboncardpro.py) work as for emails. */
const yearOf=m=>((m.cite||"").match(/\((\d{4}[a-z]?)\)/)||[])[1]||"";
const srcName=m=>{const c=(m.cite||"").replace(/<[^>]+>/g,""),i=c.indexOf(" ("),a=i>0?c.slice(0,i):"";return `${a?(a.includes(",")?a.split(",")[0]:a):m.from.split(", ")[0].split(" ").pop()} (${yearOf(m)})`;};
function source(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k], [name,...aff]=m.from.split(", ");
 return `<details class="mail src ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="stitle">${r?"":`<span class="udot" aria-label="Unread"></span>`}${m.subj}</span><span class="sauth">${name} (${yearOf(m)})</span><span class="saff">${aff.join(", ")} · ${m.kind}</span></summary><div class="body" data-src="${srcName(m)}" data-q="${m.rel}">${m.body}<p class="cite"><b>Reference:</b> <span class="ref">${m.cite}</span><button class="lnk" data-act="copyref" data-v="${encodeURIComponent(k)}">Copy reference</button></p></div></details>`;}
function tableA(name,html){return `<div class="attach"><div class="an">${name}</div>${html}</div>`;}

/* ---------- sources: research extracts for each role ---------- */
const FWD={from:"Margaret Kendrick, Chair of the Review",subj:"Fwd: “A tax on the poor”",rel:"low",body:`
 <p>This is going round. I doubt it helps us, but you should know what people are reading.</p>
 <p class="muted"><em>“The carbon card is a tax on the poor. Pensioners are freezing so that rich people can feel green.”</em> (post by a television presenter with 1.2 million followers, 3 June 2035)</p>
 <p class="fine">The post gives no figures and names no source.</p>`};

const INBOX={
 A:[
  {from:"Ivy Harlow, Energy economist, Exeter",subj:"Not just the heat pumps: what cut household emissions after 2031?",kind:"Journal article",rel:"high",
   cite:"Harlow, I. (2035a) 'Not just the heat pumps: what cut household emissions after 2031?', <i>Energy Policy Review</i>, 58(2), pp. 112–131.",body:`
   <p>Household emissions from energy and transport fell by almost a quarter between 2031 and 2034. Sceptics attribute the fall to cheaper heat pumps, electric cars and high energy prices, which would have reduced emissions with or without an allowance. This paper tests that claim by comparing the UK with five European countries that faced the same energy prices and saw similar sales of heat pumps and electric cars over the same period.</p>
   ${tableA("Table 1 · The UK and five comparable countries, 2031–34 (Institute for Fair Transitions, 2035a)",`<div class="tw"><table><thead><tr><th>Change, 2031–34</th><th class="num">UK</th><th class="num">Five comparison countries</th></tr></thead><tbody>
    <tr><td>Household energy and transport emissions</td><td class="num">−24%</td><td class="num">−9% on average</td></tr>
    <tr><td>Flights taken by residents</td><td class="num">−31%</td><td class="num">rose slightly</td></tr>
    <tr><td>Sales of heat pumps and electric cars</td><td class="num">rose</td><td class="num">rose at a similar rate</td></tr></tbody></table></div><p class="small">Winters in the comparison countries were a little colder over 2031–34 than in the years before.</p>`)}
   <p>The difference, the paper argues, comes from behaviour that technology cannot explain: fewer short car journeys, fewer flights, lower thermostats and, above all, faster decisions to insulate. Moreover, the largest changes came from households that were close to their limit, which is exactly what a binding allowance would predict. Admittedly, no comparison between countries is perfect. Nevertheless, the paper concludes that most of the fall is due to the allowance itself.</p>`},
  {from:"Nathaniel Whitlock, Professor of Political Economy, Durham",subj:"It was the prices, stupid: energy costs and the allowance",kind:"Journal article",rel:"high",
   cite:"Whitlock, N. (2034a) 'It was the prices, stupid: energy costs and the allowance', <i>Applied Energy Economics Review</i>, 41(3), pp. 201–219.",body:`
   <p>The allowance was introduced at the worst possible moment for its critics and the best for its supporters: in 2031–32, retail energy prices in Britain rose by around 40 per cent. Price rises of that size always cut consumption, as the crisis of 2022 showed, when households turned down their heating and drove less long before any allowance existed.</p>
   <p>This article argues that to credit the allowance with a fall that prices were already producing is to mistake timing for cause. Comparisons with other countries cannot settle the matter, since households in different countries respond to the same price rise in different ways. If prices did most of the work, the lesson is a simple one: a price on carbon, not a ration, is what changes behaviour.</p>`}
 ],
 B:[
  {from:"Emeka Obiora, Professor of Public Policy, London",subj:"No more than a meter reading: privacy and the carbon allowance",kind:"Journal article",rel:"high",
   cite:"Obiora, E. (2035b) 'No more than a meter reading: privacy and the carbon allowance', <i>Information Law Journal</i>, 19(2), pp. 70–89.",body:`
   <p>Is it acceptable for a public authority to know how much carbon each person uses? This paper argues that it is, because the data collected are narrow and well protected. The Carbon Account Authority records units, not purchases: litres of fuel, kilowatt-hours of energy and flights, but not what else a person buys, where they shop or with whom. In this respect, a carbon record reveals little more than an energy bill or a meter reading, both of which already exist.</p>
   ${tableA("Table 2 · Access to carbon records, 2034 (Carbon Account Authority, 2035)",`<div class="tw"><table><thead><tr><th>Item</th><th class="num">Figure</th></tr></thead><tbody>
    <tr><td>Accounts</td><td class="num">about 54 million</td></tr>
    <tr><td>Police requests for individual records, each with a court order</td><td class="num">2,300</td></tr>
    <tr><td>Other government departments with access</td><td class="num">none</td></tr>
    <tr><td>Records deleted after</td><td class="num">six years</td></tr></tbody></table></div><p class="small">The authority stores the number of units, the category (home energy, road fuel or flights) and the date. It does not store where fuel was bought or where flights went.</p>`)}
   <p>It might be objected that any database can be misused. However, the relevant question is whether the safeguards work, and so far they have: when a 2034 proposal sought to use carbon records to check benefit claims, it was dropped. Given the scale of the climate threat, the paper concludes, this is a proportionate price to pay.</p>`},
  {from:"Nathaniel Whitlock, Professor of Political Economy, Durham",subj:"The ledger of private life: liberty and the carbon allowance",kind:"Journal article",rel:"high",
   cite:"Whitlock, N. (2035a) 'The ledger of private life: liberty and the carbon allowance', <i>Journal of Political Theory</i>, 52(1), pp. 23–41.",body:`
   <p>This paper argues that the carbon allowance crosses a line that a free society should not cross, however well it works. For the first time, the state keeps a running record of how every adult heats their home, travels and takes holidays. Supporters say that the record is narrow and protected. Yet the significance of data lies less in what is collected than in what can be inferred from it: a sudden drop in heating suggests that someone has moved out, and a pattern of journeys suggests where they go.</p>
   <p>The public is divided. In a survey of 3,800 adults, 47 per cent said they were uncomfortable with the government holding records of their carbon use, most often because of what a future government might do with them, even though 64 per cent wanted the scheme to continue (Institute for Fair Transitions, 2035d).</p>
   <p>Britain has rejected this kind of infrastructure before, when it scrapped the national identity card scheme in 2010. Safeguards depend on the governments that run them, and a database built by one government will be inherited by the next. It is true that the climate crisis is serious. Nevertheless, the paper concludes that there are ways of cutting emissions that do not require the state to keep a ledger of private life.</p>`}
 ],
 C:[
  {from:"Ivy Harlow, Energy economist, Exeter",subj:"Finish the job: extending the personal carbon allowance to food and goods",kind:"Journal article",rel:"high",
   cite:"Harlow, I. (2035b) 'Finish the job: extending the personal carbon allowance to food and goods', <i>Climate Policy Review</i>, 44(3), pp. 211–230.",body:`
   <p>This paper proposes extending the personal carbon allowance to food and consumer goods by 2038. At present, the scheme covers only home energy, road fuel and flights, which account for roughly 40 per cent of a household's carbon footprint. Everything else, from meat to new phones, remains outside it. The case rests on what the scheme has already shown: people respond to a visible, limited budget far more than to prices alone.</p>
   ${tableA("Table 3 · Modelling an extended allowance (Institute for Fair Transitions, 2035e)",`<div class="tw"><table><thead><tr><th>Estimate</th><th class="num">Figure</th></tr></thead><tbody>
    <tr><td>Share of the household footprint covered</td><td class="num">from about 40% to about 70%</td></tr>
    <tr><td>Further cut in the footprint by 2040, if 90% of products carry a carbon label by 2038</td><td class="num">15%</td></tr>
    <tr><td>… if 60% of products carry a label</td><td class="num">9%</td></tr></tbody></table></div>`)}
   <p>The extension would require carbon labels on products and records at every till, which would be demanding for small shops. The authority has already asked a London management consultancy to plan how it would work at the till. Sceptics credit cheaper heat pumps and high prices for the fall so far; the comparison with other countries suggests otherwise. Admittedly, it would also mean that the authority recorded more about people's lives. Even so, the paper concludes that a scheme which works should be completed rather than abandoned halfway.</p>`},
  {from:"Nathaniel Whitlock, Professor of Political Economy, Durham",subj:"Tax it and give it back: the case for a carbon dividend",kind:"Journal article",rel:"high",
   cite:"Whitlock, N. (2035b) 'Tax it and give it back: the case for a carbon dividend', <i>Environmental Economics Today</i>, 29(1), pp. 1–19.",body:`
   <p>This paper proposes replacing the personal allowance with a carbon tax on home energy, road fuel and flights, with every penny returned to adults as an equal dividend. Such a scheme would keep most of the allowance's advantages. Under the allowance, better-off households, who use far more carbon, pay those who use less; under a tax and dividend, they would likewise pay more tax than they received back, while poorer households would receive more than they paid.</p>
   ${tableA("Table 4 · Who gained and who paid under the allowance, 2034 (Institute for Fair Transitions, 2035b)",`<div class="tw"><table><thead><tr><th>Households, by income</th><th class="num">Average gain or cost a year</th></tr></thead><tbody>
    <tr><td>Lowest-income fifth</td><td class="num">gained £310</td></tr>
    <tr><td>Second fifth</td><td class="num">gained £190</td></tr>
    <tr><td>Middle fifth</td><td class="num">gained £150</td></tr>
    <tr><td>Fourth fifth</td><td class="num">gained £50</td></tr>
    <tr><td>Richest fifth</td><td class="num">paid £720 extra</td></tr></tbody></table></div><p class="small">Within the lowest-income fifth, 18% of households lost money, £420 on average, mostly in rural areas, with oil heating or poorly insulated homes. About half of them receive the hardship top-up (Institute for Fair Transitions, 2035c).</p>`)}
   <p>Unlike the allowance, however, a tax requires no personal carbon records: it is collected from energy companies, fuel retailers and airlines, not from individuals. Switzerland has run a similar levy on heating fuels since 2008. A tax set at the allowance's average price would raise about £12 billion a year, or about £230 per adult. Treasury modelling suggests that it would achieve about 60 per cent of the allowance's effect on emissions, because a price is less visible than a shrinking balance, and it would not guarantee any particular level of emissions (HM Treasury, 2035). That, admittedly, is a real cost. Nevertheless, the paper concludes that a slightly smaller cut without a national carbon ledger is a better bargain for a free society.</p>`}
 ]
};
/* the first decision's message from the chair (the recorded REMIT clip on the Context tab): it brings no extra source,
   so each role has exactly two */
const BRANCH={
 leeds:{from:"Margaret Kendrick, Chair of the Review",subj:"Leeds first",rel:"medium",body:`<p>Leeds first, then. That puts a city, where many people walk, cycle or take the bus, at the start of our public sessions. Keep the countryside in view too. The committee will just hear from the city first.</p>`},
 cumbria:{from:"Margaret Kendrick, Chair of the Review",subj:"Cumbria first",rel:"medium",body:`<p>Cumbria first, then. That puts the countryside, where many homes are heated by oil, at the start of our public sessions. Keep the cities in view too. The committee will just hear from rural Cumbria first.</p>`}
};

/* ---------- experts: one per role, from a shortlist ---------- */
const EXPERTS={
 prices:{name:"Energy market analyst",who:"A university energy research centre",q:"high",what:"Tracks energy prices across Europe. Can tell you how prices moved in Britain and in the comparison countries.",
  rep:`<p>Retail energy prices rose by around 40 per cent in Britain in 2031–32, and by between 35 and 45 per cent in the five comparison countries. By 2034, prices had fallen back by about a quarter everywhere.</p>
   <p>As prices fell, household emissions in the comparison countries began to rise again. In Britain they kept falling, including among households that bought neither a heat pump nor an electric car.</p>`},
 nudge:{name:"Behavioural scientist",who:"A university psychology department",q:"medium",what:"Studies how people use the carbon card. Can tell you what changed people's behaviour.",
  rep:`<p>Card holders who use the app check their balance about twice a week, and most often just before booking a flight or filling up the car. In interviews, people describe the balance as “like money”: they notice it falling in a way they never noticed a price.</p>
   <p>The households that changed most were those close to their limit. Those far below it changed little.</p>
   <p class="fine">Interviews and app data from a few hundred households.</p>`},
 authority:{name:"Carbon Account Authority",who:"The public body that runs the carbon card",q:"low",what:"Runs the scheme. Can tell you what the carbon card has achieved and what it could do next.",
  rep:`<p>Our survey of 25,000 card holders who use our app shows that nine in ten have changed how they live because of the carbon card. The scheme is a proven success.</p>
   <p>Extending it to food and goods would be straightforward: the technology is ready.</p>
   <p class="fine">The authority runs the scheme and would run any extension. The survey covers app users who chose to answer it.</p>`},
 privacy:{name:"Data protection researcher",who:"A university law school",q:"high",what:"Tests what can be learned from anonymous data. Can tell you what carbon records reveal about people.",
  rep:`<p>In a test on 1,000 anonymised carbon records, researchers could tell from the dates alone when most households had been away for a week or more, and which ones seemed to have a second home. The records hold no locations, but patterns in time are personal data too.</p>
   <p>Every new category of product recorded would make such patterns sharper.</p>`},
 history:{name:"Historian of state databases",who:"A university history department",q:"medium",what:"Studies what has happened to government databases over time. Can tell you how they tend to change.",
  rep:`<p>The national identity card scheme was created by the Identity Cards Act 2006 and abolished by the Identity Documents Act 2010, after objections that a central register gave the state too much power.</p>
   <p>Most large state databases have later been proposed for purposes beyond the one they were built for. The 2034 proposal to use carbon records to check benefit claims fits that pattern; it was dropped after public protests.</p>`},
 pollster:{name:"Public attitudes researcher",who:"A polling company",q:"high",what:"Has run surveys on the carbon card. Can tell you what would change people's minds about the records.",
  rep:`<p>Younger people are noticeably more comfortable with carbon records than older people. The main worry, for those who are uncomfortable, is what a future government might do with the data.</p>
   <p>When asked about a law that banned any use of the records except for the allowance itself, the share who said they were uncomfortable fell from 47 to 31 per cent.</p>`},
 shops:{name:"Retail economist",who:"A business school",q:"high",what:"Studies how shops would cope with carbon labels. Can tell you how many products could carry a label by 2038.",
  rep:`<p>Supermarkets could label most of their products by 2038. Small shops are far behind: about one in five independent food shops would struggle to afford the new tills, and many rely on suppliers who keep no carbon data.</p>
   <p>Overall, between 60 and 90 per cent of products could carry a label by 2038, nearer the lower figure unless small shops get help with the cost.</p>`},
 canada:{name:"Comparative carbon-pricing researcher",who:"A European university",q:"high",what:"Has studied carbon taxes with rebates abroad. Can tell you how they have worked in practice.",
  rep:`<p>Canada ran a consumer carbon price with rebates for several years, and most households received more back than they paid. Yet the rebates were largely invisible, while the price at the pump was not, and the consumer carbon price was ended on 1 April 2025.</p>
   <p>Switzerland's levy on heating fuels, in place since 2008, returns part of its revenue to every resident through health-insurance premiums, and has caused far less argument.</p>`}
};
const SHORTLIST={A:["authority","nudge","prices"],B:["history","privacy","pollster"],C:["shops","authority","canada"]};

const WIT={
 sophie:{name:"Sophie Lang",role:"Management consultant, London",voice:"female, 30s, London accent, brisk and confident",
  account:`<p class="sd">[Review session in Manchester. Brisk, confident.]</p><p>I paid about fifteen hundred pounds extra last year, mostly for flights, and I've changed how I live. No more weekend trips, and far more meetings on video. Everyone I know has done the same.</p><p>It was the card that did it, full stop. Prices had nothing to do with it. Honestly, it's the best thing this country has done in decades.</p>`,
  qs:[["Should the allowance cover food and shopping too?","Absolutely. Finish the job. If it works for flights, it'll work for food and everything else. People adapt much faster than you think, believe me."],
      ["Have you or your firm done any work on the scheme?","Er… we've done a bit of work for the authority, like most of the big consultancies do. It's not about that. It's about what the card has done for me personally."],
      ["Would you have cut your flights without the card?","Some, honestly. Fares went up, and my firm cut its travel budget in 2032. But the weekend trips stopped because I watched the balance fall. That was the card."]]},
 alan:{name:"Alan Pryce",role:"Retired, Cumbria",voice:"male, late 60s, Cumbrian accent, dignified, patient but frustrated",
  account:`<p class="sd">[Review session in Manchester. Slow, patient.]</p><p>My wife and I live in a farmhouse in Cumbria, built in 1860 and heated by oil. There's no gas and no bus. We've cut back everything we can, and we still run out of units before Christmas. Last winter the extra units cost us about seven hundred pounds.</p><p>I'm not against the climate stuff. But the people who drew this up were thinking about towns.</p>`,
  qs:[["Do you get the hardship top-up?","No. We hadn't heard of it until a neighbour mentioned it last spring, and when we looked, our pension was a few pounds over the limit. Half the people in our village have never even heard of it."],
      ["Would a tax and dividend be better for you?","I've thought about it. We'd still burn the oil and pay tax on every litre, with the same dividend as a student in a flat. So no, not unless someone helps with the house. We need insulation, not a new way of paying."],
      ["Has the card changed what you do at home?","Oh, it has. We heat two rooms now, not five, and I check the balance before I drive into town for the shopping. I'd never thought about any of it before. That's the strange thing: it works on people like me as well."]]}
};

const DEC={
 d1:["Question 1: Why did household emissions fall so fast after 2031?",
   ["Technology and prices","Mainly because of cheaper clean technology and high energy prices, which would have cut emissions anyway."],
   ["The allowance","Mainly because of the allowance itself, which changed how people travelled, heated their homes and flew."]],
 d2:["Question 2: Is a public record of each person's carbon use an acceptable price for cutting emissions?",

const LIST_ID={rank:"rk"};
function flip(key,mutate){
 const sel=`#${LIST_ID[key]} .tc`, before={};
 document.querySelectorAll(sel).forEach(c=>before[c.dataset.id]=c.getBoundingClientRect().top);
 mutate();render();
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 document.querySelectorAll(sel).forEach(c=>{const dy=before[c.dataset.id]-c.getBoundingClientRect().top;
  if(dy){c.style.transition="none";c.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{c.style.transition="transform .22s ease";c.style.transform="";});}});
}
let drag=null;
function bindDrag(key){
 const L=S[key];
 document.querySelectorAll(`#${LIST_ID[key]} .tc[draggable="true"]`).forEach(c=>{
  c.addEventListener("dragstart",e=>{drag=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",drag);}catch(_){}});
  c.addEventListener("dragend",()=>{c.classList.remove("dragging");drag=null;});
  c.addEventListener("dragover",e=>{e.preventDefault();if(c.dataset.id!==drag)c.classList.add("over");});
  c.addEventListener("dragleave",()=>c.classList.remove("over"));
  c.addEventListener("drop",e=>{e.preventDefault();const to=c.dataset.id;if(!drag||to===drag||!L.includes(drag))return;
   flip(key,()=>{const from=L.indexOf(drag);L.splice(from,1);const ti=L.indexOf(to);L.splice(from<=ti?ti+1:ti,0,drag);});});
 });
}

const WHO_AVC=["#2C5282","#2F6B47","#9B2C2C","#7A5A0E","#5B3F8C","#1F6F78","#8C3F63","#4A5562"];
const WHO_SRC=TABS.some(t=>t[0]==="inbox"&&t[1]==="Sources");
function whoAvatar(p){
 const n=p.name.replace(/^(Dr|Prof|Professor|Sir|Dame)\.?\s+/,"").split(/\s+/), ini=(n[0][0]+(n.length>1?n[n.length-1][0]:"")).toUpperCase();
 let h=7; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
 return `<span class="av" style="background:${WHO_AVC[h%WHO_AVC.length]}" aria-hidden="true">${esc(ini)}${PRO_PHOTOS[p.id]?`<img src="${PRO_PHOTOS[p.id]}" alt="" onerror="this.remove()">`:""}</span>`;}
function whoPerson(p,r){
 const roles=p.roles||"", mine=roles.includes(r), other=roles&&!mine&&!p.tag, t=[];
 if(p.tag==="boss") t.push(`<span class="wtag boss">${esc(p.badge||"Your boss")}</span>`);
 if(p.tag==="witness") t.push(`<span class="wtag wit">Everyone hears from them (Investigate)</span>`);
 if(mine) t.push(`<span class="wtag mine">${WHO_SRC?"In your sources":"In your inbox"}</span>`);
 else if(roles) t.push(`<span class="wtag">${WHO_SRC?"Sources of":"Inbox of"}: ${roles.split("").map(x=>esc(ROLES[x].name)).join(", ")}</span>`);
 return `<div class="wp${other?" dim":""}" data-person="${esc(p.id)}">${whoAvatar(p)}<div class="wpt"><b>${esc(p.name)}</b><span class="wjob">${esc(p.title)}</span><span class="wline">${esc(p.line)}</span>${t.length?`<span class="wtags">${t.join("")}</span>`:""}</div></div>`;}
function whoHTML(){
 // an organisation with no people and no name of its own ("A small lab in Bristol") is a line under "Also mentioned",
 // not a card (Andrew, 11 Nov 2026: "either it should have a name, or it's not relevant enough")
 const minor=(o,i)=>i>0&&!o.people.length&&/^(An? |The [a-z])/.test(o.name);
 const orgs=WHO.orgs.filter((o,i)=>!minor(o,i)), extra=WHO.orgs.filter(minor).map(o=>[o.name,o.rel.charAt(0).toLowerCase()+o.rel.slice(1)+"."]);
 const r=R(), team=orgs[0], out=orgs.slice(1);
 const rank=p=>p.tag==="boss"?0:(p.roles||"").includes(r)?1:p.tag==="witness"?2:!p.roles?3:4;
 const ov=`<section class="card"><h2>How it fits together</h2><div class="ov">
   <div class="ovteam"><b>${esc(team.name)}</b><small>${esc(team.rel)}</small>
    <div class="ovdepts">${Object.entries(ROLES).map(([k,v])=>`<div class="ovdept${k===r?" you":""}"><b>${esc(v.name)}</b><small>${k===r?"You":"A teammate"}</small></div>`).join("")}</div></div>
   <div class="ovstem" aria-hidden="true"></div>
   <div class="ovout"><b>${esc(WHO.outside||"Outside")}</b><div class="ovorgs">${out.map(o=>`<div class="ovorg"><b>${esc(o.short||o.name)}</b><small>${esc(o.rel)}</small></div>`).join("")}</div></div>
  </div></section>`;
 const cards=orgs.map((o,i)=>`<section class="card worg${i?"":" wteam"}"><div class="worghead"><h2>${esc(o.name)}</h2><span class="wrel">${esc(o.rel)}</span></div>
   <p class="muted" style="margin:0">${esc(o.what)}</p>${o.people.length?`<div class="wppl">${[...o.people].sort((a,b)=>rank(a)-rank(b)).map(p=>whoPerson(p,r)).join("")}</div>`:""}</section>`).join("");
 const alsoAll=[...extra,...(WHO.also||[])];
 const also=alsoAll.length?`<section class="card"><h2>Also mentioned</h2><ul class="walso">${alsoAll.map(([n,l])=>`<li><b>${esc(n)}</b>: ${esc(l)}</li>`).join("")}</ul></section>`:"";
 return task(`Who's who in this case: the organisations, and the people in each. ${WHO_SRC?"The authors of your sources":"The people who write to you"} are marked; greyed-out people write to a teammate.`)+ov+cards+also;
}
V.who=whoHTML;
function whoMailAv(from){const n=String(from).split(",")[0].trim();
 const p=WHO.orgs.flatMap(o=>o.people).find(x=>x.name===n);
 return p&&PRO_PHOTOS[p.id]?`<img class="mav" src="${PRO_PHOTOS[p.id]}" alt="">`:"";}


function rankList(){const n=S.pick3||0;
 return S.rank.map((id,i)=>{const t=RANK.find(x=>x[0]===id), on=i<n;
  if(S.ranked&&!on)return "";
  return `<li class="tc t3${on?" on":""}"${S.ranked?"":` role="button" tabindex="0" data-act="pick3" data-v="${id}"`} aria-pressed="${on}"><span class="n">${on?i+1:""}</span><span>${t[1]}</span>${S.ranked?"":`<span class="t3h small">${on?"tap to remove":n<3?"tap to pick":""}</span>`}</li>`;}).join("");}
