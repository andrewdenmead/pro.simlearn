const SIMPLE={"This is a thought experiment set in the near future.": ["c.1", "This is an imagined story set in the near future."], "The United Kingdom, its climate law and the history and policies named in the sources are real.": ["c.2", "Some things in it are real: the United Kingdom, its climate law, and the history and policies named in the sources."], "The Personal Carbon Allowance, the review, every person quoted, and every study and figure dated after 2026 are invented for this classroom exercise.": ["c.3", "Other things are made up for this class: the Personal Carbon Allowance, the review, every person quoted, and every study and figure dated after 2026."], "Practise citing these sources as if they were real, but never cite them, or any 'fact' from this scenario, in real academic work.": ["c.4", "Practise citing these sources as if they were real. But never cite them, or any 'fact' from this story, in real academic work."], "The Climate Change Act 2008 committed Britain to deep cuts in its emissions, and since 2019 the law has required net zero by 2050.": ["c.5", "The Climate Change Act 2008 said that Britain must cut its emissions a lot. Since 2019 the law has said that the country must reach net zero by 2050."], "In 2008 the government also studied personal carbon trading, a carbon allowance for every adult, and shelved it as too costly and unlikely to win public support.": ["c.6", "In 2008 the government also looked at personal carbon trading, which means a carbon allowance for every adult. It decided not to go ahead, because it would cost too much and people would probably not support it."], "In April 2031, it tried again.": ["c.7", "In April 2031, the government tried the idea again."], "In October 2034, three and a half years into the scheme, this report went out on national radio:": ["c.8", "In October 2034, when the scheme had run for three and a half years, national radio broadcast this report:"], "Winners and losers of the carbon card.": ["c.9", "The carbon card has made some people better off and some people worse off."], "Jade Bennett, 21, an engineering student in Leeds, walks or cycles almost everywhere and lives in a house with a heat pump; selling her spare units made her about £200 last year.": ["c.10", "Jade Bennett, 21, studies engineering in Leeds. She walks or cycles almost everywhere, and her house has a heat pump. Last year she sold her spare units and made about £200."], "Alan Pryce, 68, lives with his wife in an oil-heated farmhouse in Cumbria, with no gas and no bus; last winter their extra units cost about £700.": ["c.11", "Alan Pryce, 68, lives with his wife in a farmhouse in Cumbria that is heated by oil. There is no gas and no bus. Last winter, the extra units they had to buy cost about £700."], "“I just don't think whoever designed this has ever lived in a place like ours,” he said.": ["c.12", "He said: “I just don't think whoever designed this has ever lived in a place like ours.”"], "In London, Sophie Lang, a management consultant, paid about £1,500 extra, mostly for flights, but says “it's made me think twice”.": ["c.13", "In London, Sophie Lang, a management consultant, paid about £1,500 extra, mostly for flights. But she says: “it's made me think twice”."], "You weigh the evidence on why household emissions fell so fast after 2031.": ["c.18", "You look at the evidence on why emissions from homes fell so quickly after 2031."], "Your sources are the main comparison with other countries and the strongest argument that energy prices did the work.": ["c.19", "Your sources are the main comparison with other countries, and the strongest argument that energy prices caused the fall."], "Four years after every adult was given a personal carbon allowance, a review will decide what happens to it next.": ["c.21", "A review will now decide what happens next to the carbon allowance that every adult got four years ago."], "In April 2031, the UK did something governments had discussed for decades and always rejected: it gave every adult a personal carbon allowance.": ["c.23", "In April 2031, the UK did something that governments had talked about for decades and always said no to: it gave every adult their own carbon allowance."], "Each person receives an allowance of carbon for home energy, road fuel and flights, and it shrinks a little every year.": ["c.24", "Each person gets an amount of carbon to use for home energy, fuel for the car and flights. The amount gets a little smaller every year."], "A \"carbon card\", linked to the holder's bank card, records the units used at the till or on the energy bill.": ["c.25", "A \"carbon card\" is connected to each person's bank card. It records the units they use when they pay at the till or pay their energy bill."], "Anyone who uses less than their allowance can sell the spare units; anyone who uses more has to buy extra from people who have some to sell.": ["c.26", "People who use less than their allowance can sell the units they don't need. People who use more must buy extra units from people who have some to sell."], "Four years later, household emissions from energy and travel have fallen faster than almost anyone predicted, and the money changing hands has produced some surprising winners and losers.": ["c.27", "Four years later, emissions from energy and travel in homes have fallen faster than almost anyone expected. The money that people pay each other has also made some surprising winners and losers."], "It also means that, for the first time, a public authority knows how much carbon every adult in the country uses, and when.": ["c.28", "It also means that, for the first time, a public body knows how much carbon each adult in the country uses, and when."], "The scheme still covers only part of what people consume: food, clothes and other goods are not included.": ["c.29", "The scheme still covers only some of the things people buy: food, clothes and other goods are not part of it."], "The government has now set up a Carbon Allowance Review to decide what should happen next.": ["c.30", "The government has now set up a Carbon Allowance Review to decide what to do next."], "Everyone I met today had already decided.": ["c.33", "Everyone I met today had already made up their mind."], "Half said the card is a surveillance machine.": ["c.34", "Half of them said the card is a machine for watching people."], "The other half said it was the heat pumps all along, and the card did nothing.": ["c.35", "The other half said the heat pumps did it all along, and the card did nothing."], "I don't want either speech.": ["c.36", "I don't want either of those speeches."], "If we lean on a weak one, the committee will take us apart, whichever way we go.": ["c.39", "If we use a weak source, the committee will destroy our arguments, whatever we decide."], "The review's public sessions open next month, and the government wants to know by Friday where the first one will be.": ["c.40", "The review's public meetings start next month, and the government wants to know by Friday where the first one will be."], "Some of the review's advisers want to open in Leeds, a city where many people walk, cycle or take the bus.": ["c.41", "Some of the review's advisers want to start in Leeds, a city where many people walk, cycle or take the bus."], "Others want to open in rural Cumbria, where many homes are heated by oil and there are few buses.": ["c.42", "Others want to start in the countryside in Cumbria, where many homes are heated by oil and there are not many buses."], "Agree as a team, then everyone enters the same choice.": ["c.44", "Agree as a team. Then everyone makes the same choice."], "You advise the review on whether a public record of each person's carbon use is an acceptable price for cutting emissions.": ["c.46", "You advise the review on one question: is it a fair price to keep a public record of each person's carbon use, in order to cut emissions?"], "Your sources are the two most cited papers, one on each side of that question.": ["c.47", "Your sources are the two papers that people quote most often, one on each side of that question."], "You draft the review's recommendation.": ["c.49", "You write the review's recommendation."], "Your sources make the case for each of the two options the government has asked the review to compare.": ["c.50", "Your sources argue for each of the two options that the government has asked the review to compare."], "This is going round.": ["e1.1", "People are sharing this a lot."], "I doubt it helps us, but you should know what people are reading.": ["e1.2", "I don't think it helps us, but you should know what people are reading."], "Pensioners are freezing so that rich people can feel green.”": ["e1.4", "Old people are cold so that rich people can feel good about the environment.”"], "(post by a television presenter with 1.2 million followers, 3 June 2035)": ["e1.5", "(a post by a TV presenter who has 1.2 million followers, 3 June 2035)"], "The post gives no figures and names no source.": ["e1.6", "The post gives no numbers and does not say where its information comes from."], "Household emissions from energy and transport fell by almost a quarter between 2031 and 2034.": ["e2.1", "Emissions from energy and transport in homes fell by almost a quarter between 2031 and 2034."], "Sceptics attribute the fall to cheaper heat pumps, electric cars and high energy prices, which would have reduced emissions with or without an allowance.": ["e2.2", "People who doubt the scheme say the fall came from cheaper heat pumps, electric cars and high energy prices. In their view, emissions would have fallen anyway, with or without an allowance."], "This paper tests that claim by comparing the UK with five European countries that faced the same energy prices and saw similar sales of heat pumps and electric cars over the same period.": ["e2.3", "This paper tests that idea. It compares the UK with five European countries that had the same energy prices and sold a similar number of heat pumps and electric cars in the same years."], "Winters in the comparison countries were a little colder over 2031–34 than in the years before.": ["e2.4", "In 2031–34, winters in the other five countries were a little colder than in the years before."], "The difference, the paper argues, comes from behaviour that technology cannot explain: fewer short car journeys, fewer flights, lower thermostats and, above all, faster decisions to insulate.": ["e2.5", "The paper says the difference comes from behaviour, not technology: fewer short car journeys, fewer flights, homes kept cooler and, most of all, people deciding more quickly to insulate their homes."], "Moreover, the largest changes came from households that were close to their limit, which is exactly what a binding allowance would predict.": ["e2.6", "Also, the biggest changes came from households that were close to their limit. That is exactly what you would expect if a strict allowance was working."], "Admittedly, no comparison between countries is perfect.": ["e2.7", "The paper accepts that no comparison between countries is perfect."], "Nevertheless, the paper concludes that most of the fall is due to the allowance itself.": ["e2.8", "Even so, the paper concludes that the allowance itself caused most of the fall."], "The allowance was introduced at the worst possible moment for its critics and the best for its supporters: in 2031–32, retail energy prices in Britain rose by around 40 per cent.": ["e3.1", "The allowance started at a time that was very bad for its critics and very good for its supporters: in 2031–32, energy prices in Britain went up by around 40 per cent."], "Price rises of that size always cut consumption, as the crisis of 2022 showed, when households turned down their heating and drove less long before any allowance existed.": ["e3.2", "When prices go up that much, people always use less. The crisis of 2022 showed this: people turned down their heating and drove less, long before there was any allowance."], "This article argues that to credit the allowance with a fall that prices were already producing is to mistake timing for cause.": ["e3.3", "This article says that prices were already causing the fall. So if we say the allowance caused it, we are confusing something that happened at the same time with the cause."], "Comparisons with other countries cannot settle the matter, since households in different countries respond to the same price rise in different ways.": ["e3.4", "Comparing countries cannot answer the question, because people in different countries react to the same price rise in different ways."], "If prices did most of the work, the lesson is a simple one: a price on carbon, not a ration, is what changes behaviour.": ["e3.5", "If prices did most of the work, the lesson is simple: a price on carbon changes behaviour, not a limit on how much people can use."], "Is it acceptable for a public authority to know how much carbon each person uses?": ["e4.1", "Is it acceptable for a public body to know how much carbon each person uses?"], "This paper argues that it is, because the data collected are narrow and well protected.": ["e4.2", "This paper says yes, because the body collects only a small amount of data and protects it well."], "The Carbon Account Authority records units, not purchases: litres of fuel, kilowatt-hours of energy and flights, but not what else a person buys, where they shop or with whom.": ["e4.3", "The Carbon Account Authority records units, not purchases: litres of fuel, kilowatt-hours of energy and flights. It does not record what else a person buys, where they shop or who they are with."], "In this respect, a carbon record reveals little more than an energy bill or a meter reading, both of which already exist.": ["e4.4", "So a carbon record shows little more than an energy bill or a meter reading, and those already exist."], "The authority stores the number of units, the category (home energy, road fuel or flights) and the date.": ["e4.5", "The authority stores how many units were used, what kind they were (home energy, road fuel or flights) and the date."], "It might be objected that any database can be misused.": ["e4.7", "Some people may say that any database can be used in the wrong way."], "However, the relevant question is whether the safeguards work, and so far they have: when a 2034 proposal sought to use carbon records to check benefit claims, it was dropped.": ["e4.8", "But what matters is whether the protections work, and so far they have: in 2034 someone proposed using carbon records to check benefit claims, and the idea was dropped."], "Given the scale of the climate threat, the paper concludes, this is a proportionate price to pay.": ["e4.9", "Because the climate threat is so big, the paper concludes that this is a fair price to pay."], "This paper argues that the carbon allowance crosses a line that a free society should not cross, however well it works.": ["e5.1", "This paper says that the carbon allowance goes too far for a free society, however well it works."], "For the first time, the state keeps a running record of how every adult heats their home, travels and takes holidays.": ["e5.2", "For the first time, the state keeps an ongoing record of how every adult heats their home, travels and goes on holiday."], "Supporters say that the record is narrow and protected.": ["e5.3", "Supporters say the record is small and well protected."], "Yet the significance of data lies less in what is collected than in what can be inferred from it: a sudden drop in heating suggests that someone has moved out, and a pattern of journeys suggests where they go.": ["e5.4", "But what matters about data is not so much what is collected as what people can work out from it: if someone suddenly uses much less heating, perhaps they have moved out, and a pattern of journeys suggests where they go."], "The public is divided.": ["e5.5", "People do not agree about this."], "In a survey of 3,800 adults, 47 per cent said they were uncomfortable with the government holding records of their carbon use, most often because of what a future government might do with them, even though 64 per cent wanted the scheme to continue (Institute for Fair Transitions, 2035d).": ["e5.6", "In a survey of 3,800 adults, 47 per cent said they were uncomfortable with the government keeping records of their carbon use. Their main reason was what a future government might do with the records. But 64 per cent wanted the scheme to continue (Institute for Fair Transitions, 2035d)."], "Britain has rejected this kind of infrastructure before, when it scrapped the national identity card scheme in 2010.": ["e5.7", "Britain has said no to this kind of system before: it ended the national identity card scheme in 2010."], "Safeguards depend on the governments that run them, and a database built by one government will be inherited by the next.": ["e5.8", "Protections are only as good as the governments that run them, and the next government will take over any database the last one built."], "It is true that the climate crisis is serious.": ["e5.9", "The paper accepts that the climate crisis is serious."], "Nevertheless, the paper concludes that there are ways of cutting emissions that do not require the state to keep a ledger of private life.": ["e5.10", "Even so, it concludes that emissions can be cut in other ways, without the state keeping a record of people's private lives."], "This paper proposes extending the personal carbon allowance to food and consumer goods by 2038.": ["e6.1", "This paper suggests that the personal carbon allowance should also cover food and other goods by 2038."], "At present, the scheme covers only home energy, road fuel and flights, which account for roughly 40 per cent of a household's carbon footprint.": ["e6.2", "At the moment, the scheme covers only home energy, fuel for the car and flights. These make up roughly 40 per cent of a household's carbon footprint."], "Everything else, from meat to new phones, remains outside it.": ["e6.3", "Everything else, from meat to new phones, is not included."], "The case rests on what the scheme has already shown: people respond to a visible, limited budget far more than to prices alone.": ["e6.4", "The argument is based on what the scheme has already shown: people react much more to a limited budget that they can see than to prices alone."], "The extension would require carbon labels on products and records at every till, which would be demanding for small shops.": ["e6.5", "For the extension, products would need carbon labels and every till would need to keep records. This would be hard for small shops."], "The authority has already asked a London management consultancy to plan how it would work at the till.": ["e6.6", "The authority has already asked a management consultancy in London to plan how it would work at the till."], "Sceptics credit cheaper heat pumps and high prices for the fall so far; the comparison with other countries suggests otherwise.": ["e6.7", "People who doubt the scheme say cheaper heat pumps and high prices caused the fall so far, but the comparison with other countries suggests they are wrong."], "Admittedly, it would also mean that the authority recorded more about people's lives.": ["e6.8", "The paper accepts that the authority would also record more about people's lives."], "Even so, the paper concludes that a scheme which works should be completed rather than abandoned halfway.": ["e6.9", "Even so, it concludes that a scheme that works should be finished, not stopped halfway."], "This paper proposes replacing the personal allowance with a carbon tax on home energy, road fuel and flights, with every penny returned to adults as an equal dividend.": ["e7.1", "This paper suggests replacing the personal allowance with a carbon tax on home energy, fuel for the car and flights. All the money would go back to adults in equal payments, called a dividend."], "Such a scheme would keep most of the allowance's advantages.": ["e7.2", "This would keep most of the good points of the allowance."], "Under the allowance, better-off households, who use far more carbon, pay those who use less; under a tax and dividend, they would likewise pay more tax than they received back, while poorer households would receive more than they paid.": ["e7.3", "Under the allowance, richer households use much more carbon, so they pay the people who use less. With a tax and dividend, they would also pay more in tax than they got back, and poorer households would get back more than they paid."], "Within the lowest-income fifth, 18% of households lost money, £420 on average, mostly in rural areas, with oil heating or poorly insulated homes.": ["e7.4", "In the poorest fifth of households, 18% lost money, £420 on average. Most of them live in the countryside, heat with oil or have homes that are badly insulated."], "About half of them receive the hardship top-up (Institute for Fair Transitions, 2035c).": ["e7.5", "About half of them get the extra payment for people in hardship (Institute for Fair Transitions, 2035c)."], "Unlike the allowance, however, a tax requires no personal carbon records: it is collected from energy companies, fuel retailers and airlines, not from individuals.": ["e7.6", "But unlike the allowance, a tax needs no personal carbon records: energy companies, fuel sellers and airlines pay it, not individual people."], "Switzerland has run a similar levy on heating fuels since 2008.": ["e7.7", "Switzerland has had a similar tax on heating fuels since 2008."], "A tax set at the allowance's average price would raise about £12 billion a year, or about £230 per adult.": ["e7.8", "A tax at the allowance's average price would bring in about £12 billion a year, which is about £230 for each adult."], "Treasury modelling suggests that it would achieve about 60 per cent of the allowance's effect on emissions, because a price is less visible than a shrinking balance, and it would not guarantee any particular level of emissions (HM Treasury, 2035).": ["e7.9", "The Treasury's calculations suggest that a tax would cut emissions by about 60 per cent as much as the allowance, because people notice a price less than a balance that keeps getting smaller. A tax would also not make sure that emissions fall to a certain level (HM Treasury, 2035)."], "That, admittedly, is a real cost.": ["e7.10", "The paper accepts that this is a real cost."], "Nevertheless, the paper concludes that a slightly smaller cut without a national carbon ledger is a better bargain for a free society.": ["e7.11", "Even so, it concludes that for a free society, a slightly smaller cut without a national carbon record is a better deal."], "Leeds first, then.": ["e8.1", "So we start in Leeds."], "That puts a city, where many people walk, cycle or take the bus, at the start of our public sessions.": ["e8.2", "That means a city, where many people walk, cycle or take the bus, comes first in our public meetings."], "Keep the countryside in view too.": ["e8.3", "Don't forget the countryside, though."], "The committee will just hear from the city first.": ["e8.4", "The committee will simply hear from the city first."], "Cumbria first, then.": ["e9.1", "So we start in Cumbria."], "That puts the countryside, where many homes are heated by oil, at the start of our public sessions.": ["e9.2", "That means the countryside, where many homes are heated by oil, comes first in our public meetings."], "Keep the cities in view too.": ["e9.3", "Don't forget the cities, though."], "The committee will just hear from rural Cumbria first.": ["e9.4", "The committee will simply hear from the countryside in Cumbria first."], "Retail energy prices rose by around 40 per cent in Britain in 2031–32, and by between 35 and 45 per cent in the five comparison countries.": ["x1.1", "In 2031–32, energy prices for homes went up by around 40 per cent in Britain, and by between 35 and 45 per cent in the five other countries."], "By 2034, prices had fallen back by about a quarter everywhere.": ["x1.2", "By 2034, prices had come down by about a quarter in all of them."], "As prices fell, household emissions in the comparison countries began to rise again.": ["x1.3", "When prices came down, emissions from homes in the other five countries started to go up again."], "In Britain they kept falling, including among households that bought neither a heat pump nor an electric car.": ["x1.4", "In Britain they continued to fall, even in households that bought no heat pump and no electric car."], "Card holders who use the app check their balance about twice a week, and most often just before booking a flight or filling up the car.": ["x2.1", "People who use the app look at their balance about twice a week, most often just before they book a flight or fill up the car."], "In interviews, people describe the balance as “like money”: they notice it falling in a way they never noticed a price.": ["x2.2", "In interviews, people say the balance is “like money”: they notice it going down, but they never noticed a price in that way."], "The households that changed most were those close to their limit.": ["x2.3", "The households that changed most were the ones close to their limit."], "Those far below it changed little.": ["x2.4", "Households far below their limit changed very little."], "Interviews and app data from a few hundred households.": ["x2.5", "This comes from interviews and app data from a few hundred households."], "Our survey of 25,000 card holders who use our app shows that nine in ten have changed how they live because of the carbon card.": ["x3.1", "We asked 25,000 people who use our app. Nine in ten said the carbon card has changed how they live."], "The scheme is a proven success.": ["x3.2", "The scheme has clearly worked."], "Extending it to food and goods would be straightforward: the technology is ready.": ["x3.3", "It would be easy to make it cover food and goods too: the technology is ready."], "The authority runs the scheme and would run any extension.": ["x3.4", "The authority runs the scheme, and it would also run a bigger scheme."], "The survey covers app users who chose to answer it.": ["x3.5", "Only app users who chose to answer took part in the survey."], "In a test on 1,000 anonymised carbon records, researchers could tell from the dates alone when most households had been away for a week or more, and which ones seemed to have a second home.": ["x4.1", "Researchers tested 1,000 carbon records without names. From the dates alone, they could see when most households had been away for a week or more, and which ones seemed to have a second home."], "The records hold no locations, but patterns in time are personal data too.": ["x4.2", "The records do not show places, but patterns in time are also personal data."], "Every new category of product recorded would make such patterns sharper.": ["x4.3", "Each new kind of product that is recorded would make these patterns clearer."], "The national identity card scheme was created by the Identity Cards Act 2006 and abolished by the Identity Documents Act 2010, after objections that a central register gave the state too much power.": ["x5.1", "The national identity card scheme began with the Identity Cards Act 2006 and ended with the Identity Documents Act 2010. People had complained that one central list of all citizens gave the state too much power."], "Most large state databases have later been proposed for purposes beyond the one they were built for.": ["x5.2", "Most large state databases have later been suggested for other uses, not just the use they were built for."], "The 2034 proposal to use carbon records to check benefit claims fits that pattern; it was dropped after public protests.": ["x5.3", "The 2034 idea of using carbon records to check benefit claims follows that pattern. It was dropped after people protested."], "  hardly noticed the money they got back, while they did notice the price at the petrol station. Canada ended its carbon price for consumers on 1 April 2025."], "Switzerland's levy on heating fuels, in place since 2008, returns part of its revenue to every resident through health-insurance premiums, and has caused far less argument.": ["x8.3", "Switzerland has had a tax on heating fuels since 2008. It gives part of the money back to every person who lives there, through their health insurance, and people have argued about it much less."], "I paid about fifteen hundred pounds extra last year, mostly for flights, and I've changed how I live.": ["w1.1", "Last year I paid about fifteen hundred pounds extra, mostly for flights, and I've changed the way I live."], "No more weekend trips, and far more meetings on video.": ["w1.2", "I don't go away at weekends any more, and I have many more meetings by video."], "Everyone I know has done the same.": ["w1.3", "All the people I know have done the same."], "It was the card that did it, full stop.": ["w1.4", "The card did it, and that's all."], "Prices had nothing to do with it.": ["w1.5", "Prices didn't matter at all."], "Honestly, it's the best thing this country has done in decades.": ["w1.6", "Honestly, I think it's the best thing this country has done for decades."], "Finish the job.": ["w1.8", "Finish what you started."], "If it works for flights, it'll work for food and everything else.": ["w1.9", "If it works for flights, it will work for food and everything else."], "People adapt much faster than you think, believe me.": ["w1.10", "Believe me, people get used to things much faster than you think."], "Er… we've done a bit of work for the authority, like most of the big consultancies do.": ["w1.11", "Er… we've done a small amount of work for the authority, like most of the big consultancies."], "It's not about that.": ["w1.12", "That's not the point."], "It's about what the card has done for me personally.": ["w1.13", "Th
