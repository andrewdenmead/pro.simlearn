<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Hollow Oak Coffee: The First Hundred Days (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>

/* charts: horizontal budget bars and a simple line chart */
function hbars(rows,label){
  const W=500,left=200,right=70,rowH=30,top=4,H=top+rows.length*rowH+4,w=W-left-right,max=Math.max(...rows.map(r=>r.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  rows.forEach((r,i)=>{const y=top+i*rowH,bw=Math.max(2,w*r.v/max);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="sa" x="${left}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="2"/><text class="val" x="${left+bw+6}" y="${y+18}">${r.t}</text>`;});
  return s+"</svg>";
}
function lineChart(pts,label,ylo,yhi,marks){
  const W=500,H=190,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,x0=pts[0][0],x1=pts[pts.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  pts.forEach(([x])=>{if(x%2===0)s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${x}</text>`;});
  s+=`<text x="${l+w/2}" y="${H-2}" text-anchor="middle">Months after that line's launch</text>`;
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;
  return s+"</svg>";
}

 return `<div class="audio"><button class="play" disabled aria-label="Play (recording to come)">▶</button><div><div class="t">${t}</div><div class="s">Recording to come: read the text</div></div><details open><summary>The text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;}

   <p>Hollow Oak is known by about 38 per cent of coffee buyers in the UK, which is remarkable for a brand our size. What makes us valuable, though, isn't how many people know us. It's how loyal they are: our customers come back again and again, and they talk about us.</p>

   <p>Congratulations on the deal, and thank you for keeping us informed. Two things you should know.</p>
   <p>First, we review our coffee shelves in April. Eye-level space goes to brands whose shoppers come back, which we measure as a repeat rate above 40 per cent. Hollow Oak's repeat rate is 47 per cent, the highest in our coffee category. Café Norde sits in our value range on the bottom shelf, and it does very well there.</p>
   <p>Second, Hollow Oak has been growing fast in our stores, and we'd like to triple our order from June, with Hollow Oak in all 340 of our stores instead of 110. We'd want a guarantee that you won't run out over the summer: empty shelves in a new store are the quickest way to lose a brand's place.</p>

   <p>I'll keep this practical, because the roasting is what I know. The team is anxious. Two of our five roasters have families here and have told me they won't go to Hull, and some people think a move would be the end of Hollow Oak as a coffee.</p>
   <p>We're also running out of room. The roastery works at about 90 per cent of its capacity, and this year we turned down two big wholesale customers, worth about £600,000 a year, because we couldn't roast enough for them.</p>

   <p>To be honest, a roaster in London has offered me a job, and I'll decide in January. I'd stay if I knew I'd have real responsibility for the coffee, whatever the plan is.</p>

   <p>Let me explain why we'd like to move most of the roasting to Hull. In 2025 we installed a small-batch line there, with two 60-kilogram drum roasters, built for speciality coffee. It runs at about a third of its capacity, so it could take three times Hollow Oak's current volume from May. Moving the main roasting there would save around £1.8 million a year. We would keep the small roaster in the Bristol flagship café, so customers can still watch coffee being roasted in Bristol.</p>
   <p>We've run a first blind taste test: the same beans, roasted to Marta's profiles in Bristol and in Hull, compared by 200 regular coffee drinkers. Fifty-four per cent couldn't tell which was which.</p>
   <p>One more thing from Halverson's side, since you're also deciding Sam's role. In our last two acquisitions, founders with a veto slowed decisions badly, and in one case the founder and the new managing director stopped speaking to each other. That doesn't mean it would happen here.</p>
   <p class="sig">Henrik</p>`},

function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){

  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}

function pdfByte(ch){

  if (u >= 32 && u <= 126) return u;

function pdfWrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)

}

function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;

    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });

  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }

  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

board will see the plan on 1 December."], "I'm on my way to Hull with Henrik.": ["c.23", "I'm travelling to Hull with Henrik."], "The plan goes to Halverson's board on the first of December, and I'm not walking in there without an answer on each question: the brand, Sam and the roasting.": ["c.24", "Halverson's board will see the plan on the first of December. I must have an answer to each question when I go in: the brand, Sam and the roasting."], "Properly.": ["c.26", "Really talk."], "Someone's posted that the roastery is closing, and the staff are asking Marta what's going on.": ["c.28", "Someone has written online that the roastery is closing. The staff are asking Marta what is happening."], "Do Sam and I tell the whole team tonight what we're considering, or say nothing until the plan is agreed?": ["c.30", "Should Sam and I tell all the staff tonight what we are thinking about? Or should we say nothing until the plan is agreed?"], "Let me know by six.": ["c.31", "Tell me before six o'clock."], "A post saying the Bristol roastery will close is going round, and staff are asking their managers what's happening.": ["c.32", "Many people are sharing a post that says the Bristol roastery will close. Staff are asking their managers what is happening."], "Claire and Sam could tell all 85 staff tonight what the team is considering: they'd hear it from them, not from the internet, but the cafés would close early for the meeting, and anything said will be repeated online.": ["c.33", "Claire and Sam could tell all 85 staff tonight what the team is thinking about. Then the staff would hear it from them, not from the internet. But the cafés would close early for the meeting, and people will repeat online anything that is said."], "Or they say nothing until the plan is agreed: there's nothing to repeat, but the rumours keep growing.": ["c.34", "Or they say nothing until the plan is agreed. Then there is nothing to repeat, but there are more and more stories that may not be true."], "Agree as a team, then everyone enters the same choice.": ["c.36", "Agree together as a team. Then everyone chooses the same answer."], "You look after Hollow Oak's biggest customer and its coffee.": ["c.38", "Your job is Hollow Oak's biggest customer and the coffee itself."], "Your inbox holds messages from Fernley's coffee buyer and from Hollow Oak's head roaster.": ["c.39", "In your inbox there are messages from the person who buys coffee for Fernley's and from Hollow Oak's head roaster."], "You look after how Hollow Oak runs and what it costs.": ["c.41", "Your job is how Hollow Oak works every day and how much it costs."], "Your inbox holds messages from Halverson's chief operating officer and from Hollow Oak's finance manager.": ["c.42", "In your inbox there are messages from the person who runs Halverson's factories and from Hollow Oak's finance manager."], "Hollow Oak is known by about 38 per cent of coffee buyers in the UK, which is remarkable for a brand our size.": ["e1.1", "About 38 per cent of people who buy coffee in the UK know Hollow Oak. That is very high for a brand as small as ours."], "What makes us valuable, though, isn't how many people know us.": ["e1.2", "But our value doesn't come from how many people know us."], "It's how loyal they are: our customers come back again and again, and they talk about us.": ["e1.3", "It comes from how loyal they are. Our customers buy from us again and again, and they tell other people about us."], "Since the announcement, the comments online have been brutal.": ["e1.4", "Since the sale was announced, the comments online have been very angry."], "Roughly half are about the brand itself, and about a quarter are about Sam.": ["e1.5", "About half of them are about the brand, and about a quarter are about Sam."], "The fear is that Hollow Oak will become “just another corporate coffee”, and people keep mentioning Pippin's.": ["e1.6", "People are afraid that Hollow Oak will become “just another corporate coffee”. They often talk about Pippin's."], "Last week we ran a pack test with Hollow Oak buyers, including one design with the Café Norde name on it.": ["e1.7", "Last week we showed different packs to people who buy Hollow Oak. One pack had the Café Norde name on it."], "“Roasted in Bristol” is printed on every bag, and it's the line customers quote back to us most.": ["e1.8", "Every bag says “Roasted in Bristol”. Customers repeat these words to us more than any others."], "On Saturdays visitors queue round the corner to watch the roasting through the café's glass wall, and many tell us it's why they buy Hollow Oak in the supermarket.": ["e1.9", "On Saturdays there is a long line of visitors who want to watch the roasting through the café's glass wall. Many of them tell us that this is why they buy Hollow Oak in the supermarket."], "I've been asked what I want my role to be, so here goes, honestly.": ["e2.1", "People have asked me what job I want. So here is my honest answer."], "Halverson has offered me three years as “brand guardian”, with a veto on any change to the product or the marketing.": ["e2.2", "Halverson has offered me a job as “brand guardian” for three years. I would have the power to stop any change to the product or the marketing."], "Jo tells me there's a second option too.": ["e2.3", "Jo says there is also a second choice."], "I'm grateful, and I'll do it if that's what's best for Hollow Oak.": ["e2.4", "I'm thankful, and I'll do it if that is best for Hollow Oak."], "I'd never want people to think I took the money and ran.": ["e2.5", "I'd never want people to think that I took the money and left."], "Some days I think I'm better at starting things than at running them inside a big company; other days I can't imagine not being here.": ["e2.8", "Some days I think I'm better at starting new things than at running them inside a big company. On other days I can't imagine leaving."], "Whatever you decide, please look after Marta Silva.": ["e2.9", "Whatever you decide, please take care of Marta Silva."], "She's our head roaster, and she's the real heart of the coffee.": ["e2.10", "She's our head roaster, and she is the most important person for the coffee."], "The team would follow her anywhere.": ["e2.11", "The team trusts her completely and would go anywhere with her."], "This is going round today, and the staff have seen it.": ["e3.1", "Many people are sharing this today, and the staff have seen it."], "Is there anything in it?": ["e3.2", "Is any of it true?"], "“Hearing Hollow Oak's Bristol roastery shuts in January and EVERYTHING moves to a Café Norde factory.": ["e3.3", "“I hear that Hollow Oak's Bristol roastery will close in January and that EVERYTHING will move to a Café Norde factory."], "RIP proper coffee.”": ["e3.4", "Good coffee is dead.”"], "(coffee forum account, 12,000 followers)": ["e3.5", "(an account on a coffee website, with 12,000 followers)"], "The post names no source, and nobody on the team has told the staff anything.": ["e3.6", "The post doesn't say where the information came from. Nobody on the team has told the staff anything."], "Congratulations on the deal, and thank you for keeping us informed.": ["e4.1", "Congratulations on the sale, and thank you for telling us what is happening."], "Two things you should know.": ["e4.2", "There are two things you should know."], "First, we review our coffee shelves in April.": ["e4.3", "First, in April we decide again which coffee goes where on our shelves."], "Eye-level space goes to brands whose shoppers come back, which we measure as a repeat rate above 40 per cent.": ["e4.4", "The best space, at the height of shoppers' eyes, goes to brands that shoppers buy again. For us, that means more than 40 per cent of shoppers buy the brand again."], "Hollow Oak's repeat rate is 47 per cent, the highest in our coffee category.": ["e4.5", "For Hollow Oak, 47 per cent of shoppers buy it again. That is the highest of all our coffees."], "Café Norde sits in our value range on the bottom shelf, and it does very well there.": ["e4.6", "Café Norde is with our cheaper products on the bottom shelf, and it sells very well there."], "Second, Hollow Oak has been growing fast in our stores, and we'd like to triple our order from June, with Hollow Oak in all 340 of our stores instead of 110.": ["e4.7", "Second, Hollow Oak's sales in our stores have grown fast. From June we'd like to order three times as much, and sell Hollow Oak in all 340 of our stores, not only 110."], "We'd want a guarantee that you won't run out over the summer: empty shelves in a new store are the quickest way to lose a brand's place.": ["e4.8", "We'd want a promise that you will always have enough coffee during the summer. When a new store has empty shelves, a brand loses its place very quickly."], "I need to know by Christmas whether you can supply that, and what the brand will look like, because that decides where it goes on the shelf.": ["e4.9", "Before Christmas I need to know if you can send us that much, and what the brand will look like. That decides where it goes on the shelf."], "I'll keep this practical, because the roasting is what I know.": ["e5.1", "I'll talk about practical things, because I know about roasting."], "The team is anxious.": ["e5.2", "The team is worried."], "Two of our five roasters have families here and have told me they won't go to Hull, and some people think a move would be the end of Hollow Oak as a coffee.": ["e5.3", "Two of our five roasters have families here. They have told me that they won't go to Hull. Some people think that moving would mean the end of Hollow Oak's coffee."], "We're also running out of room.": ["e5.4", "We also don't have enough space."], "The roastery works at about 90 per cent of its capacity, and this year we turned down two big wholesale customers, worth about £600,000 a year, because we couldn't roast enough for them.": ["e5.5", "The roastery is working at about 90 per cent of what it can do. This year we said no to two big business customers, worth about £600,000 a year, because we couldn't roast enough coffee for them."], "I visited Halverson's Hull plant last month.": ["e5.6", "Last month I visited Halverson's factory in Hull."], "Its new small-batch line is better than our equipment.": ["e5.7", "Its new machines for roasting small amounts are better than ours."], "What makes our coffee isn't the building: it's the beans we choose, the profiles we roast and the people who taste every batch.": ["e5.8", "The building doesn't make our coffee. The beans we choose, the way we roast them and the people who taste every batch make it."], "If I set the roast profiles and sat on the tasting panel, I'd lead a Hull line myself two days a week, as long as the roasters' names were printed on every bag.": ["e5.9", "If I decide how the coffee is roasted and I am one of the tasters, I would run a roasting line in Hull myself, two days a week. But the roasters' names must be printed on every bag."], "To be honest, a roaster in London has offered me a job, and I'll decide in January.": ["e5.10", "To be honest, a roastery in London has offered me a job. I'll decide in January."], "I'd stay if I knew I'd have real responsibility for the coffee, whatever the plan is.": ["e5.11", "Whatever the plan is, I'd stay if I knew that I would really be in charge of the coffee."], "The questions asked most were whether the roasting would move to Hull and whether Sam was staying.": ["e6.2", "People asked most often if the roasting would move to Hull and if Sam would stay."], "Claire said nothing was decided, and Sam said the coffee would stay in good hands.": ["e6.3", "Claire said that nothing was decided. Sam said that good people would take care of the coffee."], "Two roasters asked whether anyone would be expected to move.": ["e6.4", "Two roasters asked if anyone would have to move."], "A customer posted a photo of the closed café door, asking whether the staff were meeting about the “sell-out”, and it was shared a few hundred times.": ["e6.5", "A customer put a photo of the closed café door online. The customer asked if the staff were meeting about the “sell-out”. A few hundred people shared it."], "In a quick poll afterwards, most staff said they'd stay through any change if they knew who would lead the coffee.": ["e6.6", "Afterwards we asked the staff a quick question. Most of them said they would stay, whatever changed, if they knew who would be in charge of the coffee."], "Since the post about the roastery went round, several staff have asked their managers whether it's closing, and we've said nothing is decided.": ["e7.1", "Since people shared the post about the roastery, several staff have asked their managers if it is closing. We have said that nothing is decided."], "A message from one of the roasters, wondering whether they're all off to Hull, is going round the staff group chat.": ["e7.2", "One of the roasters wrote a message asking if they are all going to Hull. People are sharing it in the staff group chat."], "Marta says the team would rather hear it from Claire and Sam than from the internet, and that the longer they wait, the more people will start looking at other jobs.": ["e7.3", "Marta says the team would prefer to hear it from Claire and Sam, not from the internet. She also says that the longer they wait, the more people will start looking for other jobs."], "Let me explain why we'd like to move most of the roasting to Hull.": ["e8.1", "I'll explain why we want to roast most of the coffee in Hull."], "In 2025 we installed a small-batch line there, with two 60-kilogram drum roasters, built for speciality coffee.": ["e8.2", "In 2025 we put in a line for roasting small amounts there. It has two 60-kilogram drum roasters, made for high-quality coffee."], "It runs at about a third of its capacity, so it could take three times Hollow Oak's current volume from May.": ["e8.3", "It only does about a third of the work it can do. So from May it could roast three times as much as Hollow Oak roasts now."], "Moving the main roasting there would save around £1.8 million a year.": ["e8.4", "If we moved most of the roasting there, we would save about £1.8 million a year."], "We would keep the small roaster in the Bristol flagship café, so customers can still watch coffee being roasted in Bristol.": ["e8.5", "We would keep the small roaster in the main café in Bristol. So customers can still watch people roast coffee in Bristol."], "We've run a first blind taste test: the same beans, roasted to Marta's profiles in Bristol and in Hull, compared by 200 regular coffee drinkers.": ["e8.6", "We have done a first taste test where people didn't know which coffee was which. The same beans were roasted in Marta's way, in Bristol and in Hull. Then 200 people who often drink coffee compared them."], "Fifty-four per cent couldn't tell which was which.": ["e8.7", "Fifty-four per cent couldn't say which coffee came from where."], "One more thing from Halverson's side, since you're also deciding Sam's role.": ["e8.8", "You are also deciding Sam's job, so here is one more thing from Halverson."], "In our last two acquisitions, founders with a veto slowed decisions badly, and in one case the founder and the new managing director stopped speaking to each other.": ["e8.9", "In the last two companies we bought, the founders had the power to stop changes. Decisions became very slow. In one company, the founder and the new boss stopped speaking to each other."], "That doesn't mean it would happen here.": ["e8.10", "That doesn't mean it would happen at Hollow Oak."], "On the brand: Oliver estimates that one coffee family would save about £0.9 million a year.": ["e9.1", "About the brand: Oliver thinks that one family of coffee brands would save about £0.9 million a year."], "But our packaging contract runs until the end of 2028, and breaking it would cost more than it saves, so in the first two years the saving would be about £0.2 million a year.": ["e9.2", "But our contract for packaging lasts until the end of 2028. Ending it early would cost more than we would save. So in the first two years we would save about £0.2 million a year."], "On the roastery: our Bristol lease ends in June, and the landlord wants a 60 per cent increase, from £290,000 to £460,000 a year.": ["e9.3", "About the roastery: our rent agreement in Bristol ends in June. The owner of the building wants 60 per cent more rent, £460,000 a year instead of £290,000."], "A unit two streets away has room for a second roaster, at £330,000 a year, but it would take about a year to fit out.": ["e9.4", "A building two streets away has space for a second roaster, for £330,000 a year. But it would take about a year to get it ready."], "On Sam, Claire has set out two options.": ["e9.5", "About Sam, Claire has given two choices."], "Loyal buyers of a challenger brand buy it partly because of who doesn't own it.": ["x1.1", "Loyal buyers of a small new brand buy it partly because a big company doesn't own it."], "When the new owner's name goes on the pack, the most loyal buyers are usually the first to try something else, and they are often the ones who keep the brand on a good shelf.": ["x1.2", "When the new owner puts its name on the pack, the most loyal buyers usually change brand first. They are often the buyers who keep the brand on a good shelf."], "Owners who leave the pack alone and save money behind the scenes, in buying, shipping and systems, usually keep the buyers and part of the savings.": ["x1.3", "Some owners don't change the pack. They save money in ways customers don't see, in buying, transport and computer systems. They usually keep the buyers and part of the money they wanted to save."], "Supermarket buyers decide shelf positions on how often shoppers come back, not on how well known a brand is.": ["x2.1", "Supermarket buyers decide where a brand goes on the shelf by how often shoppers buy it again. They don't decide by how many people know it."], "A brand moved into a value range usually goes to the shelf where that range already sits.": ["x2.2", "When a brand becomes part of a group of cheaper products, it usually goes on the same shelf as those products."], "And a brand that runs out in new stores during its first summer often loses its space at the next review.": ["x2.3", "And if there isn't enough of a brand in new stores in its first summer, it often loses its space when the shelves are decided again."], "Founders who stay with a veto often slow every decision, and in many deals the relationship with the new owner breaks down within two years.": ["x3.1", "Founders who stay and have the power to stop changes often make every decision slow. In many sales, they stop working well with the new owner within two years."], "Earn-outs keep a founder interested in the brand's success without a say in every decision, as long as the targets are clear numbers.": ["x3.2", "With an earn-out, the founder gets more money later if the brand does well. So the founder still cares about the brand but doesn't decide everything. The targets must be clear numbers."], "The bigger risk in the first year is losing the people below the founder who hold the know-how: give them clear roles early.": ["x3.3", "The bigger danger in the first year is that the people who know how things work, below the founder, will leave. Give them clear jobs early."], "When work moves to another site, staff who can't or won't move are usually entitled to redundancy pay, and a company proposing 20 or more redundancies must consult first, for at least 30 days.": ["x4.1", "When work moves to another place, staff who can't or won't move usually get money because they lose their job. If a company plans to end 20 or more jobs, it must talk with the staff first, for at least 30 days."], "Companies that explain early, offer real choices and keep some work at the old site usually lose fewer people than those that announce a finished plan.": ["x4.2", "Some companies explain early, give real choices and keep some work in the old place. They usually lose fewer people than companies that only tell staff about a plan that is already finished."], "A coffee's taste depends on the green beans, the roast profiles and the people who check every batch, far more than on the building.": ["x5.1", "The taste of a coffee comes from the green beans, the way they are roasted and the people who check every batch. The building matters much less."], "Profiles can be moved between similar drum roasters within a few weeks if the same people set them and taste the results.": ["x5.2", "You can use the same way of roasting on another similar drum roaster within a few weeks, if the same people set it up and taste the coffee."], "Moves usually go wrong when the old team is left out.": ["x5.3", "A move usually goes wrong when the old team isn't part of it."], "Industrial rents in Bristol have risen fast, and a landlord asking 60 per cent more at a renewal is no longer unusual.": ["x6.1", "Rents for business buildings in Bristol have gone up fast. It is normal now for an owner to ask for 60 per cent more when a rent agreement ends."], "Fitting out a unit as a roastery, with gas, extraction and permits, usually takes nine to twelve months.": ["x6.2", "Making a building ready to be a roastery, with gas, air systems and official permission, usually takes nine to twelve months."], "A short extension on an existing lease is often possible if the tenant asks early.": ["x6.3", "If you ask early, the owner will often let you stay a little longer under the old agreement."], "Let me say what Halverson's board is thinking.": ["w1.1", "I'll tell you what Halverson's board thinks."], "We'd like Hollow Oak to join our coffee range as Café Norde Craft.": ["w1.2", "We want Hollow Oak to become one of our coffee brands, with the name Café Norde Craft."], "One family of brands means one packaging supplier, one design team and one budget: about nine hundred thousand pounds a year.": ["w1.3", "With one family of brands, we need only one company for packaging, one design team and one budget. That saves about nine hundred thousand pounds a year."], "Supermarkets like fewer, stronger brands.": ["w1.4", "Supermarkets like to have fewer brands that sell well."], "Yes, we got Pippin's wrong, but mainly because we did it overnight.": ["w1.5", "Yes, we made mistakes with Pippin's. But that was mainly because we changed everything very quickly."], "Do it carefully, and the fans come round.": ["w1.6", "If you do it carefully, the fans will accept it in the end."], "Café Norde does very well at Fernley's.": ["w1.7", "Café Norde sells very well at Fernley's."], "It's one of their best-selling coffees, and a Craft range would sit alongside it.": ["w1.8", "It is one of the coffees they sell most. Café Norde Craft products would go next to it."], "They like strong families of brands, so I'd expect them to be pleased.": ["w1.9", "They like strong families of brands, so I think they would be happy."], "We changed the name, the bottle and the recipe in the same month, and the founder said so in public.": ["w1.10", "We changed the name, the bottle and the recipe in the same month. The founder talked about this in public."], "One change at a time, explained, and it would have gone differently.": ["w1.12", "If we had changed one thing at a time and explained it, it would have gone differently."], "Er… some of it straight away, in design and marketing.": ["w1.13", "Er… we can save some of it at once, in design and marketing."], "The bulk is packaging, and that's tied up in Hollow Oak's contract for a while yet.": ["w1.14", "Most of it comes from packaging, and Hollow Oak's contract stops that for some time."], "Jo has the dates.": ["w1.15", "Jo knows the dates."], "Twelve years ago I roasted at night in a railway arch and sold the bags on a market stall.": ["w2.1", "Twelve years ago I roasted coffee at night in a space under a railway bridge. I sold the bags at a market."], "Now there are eighty-five of us.": ["w2.2", "Now eighty-five people work here."], "I promised on the radio that the coffee isn't going to change, and I meant it.": ["w2.3", "I promised on the radio that the coffee will not change, and I really meant it."], "Halverson has offered me three years as brand guardian, with a veto.": ["w2.4", "Halverson has offered me a job as brand guardian for three years, with the power to stop changes."], "I'll do it if that's what's best.": ["w2.5", "I'll do it if that is the best thing."], "I just want whoever runs this to understand what people are buying.": ["w2.6", "I only want the person who runs this to understand what people are really buying."], "A small company that does things properly, pays farmers fairly and roasts in Bristol.": ["w2.8", "A small company that does things in the right way, pays farmers a fair price and roasts in Bristol."], "If any of that changes without an explanation, people will notice, and they'll tell each other about it within a day.": ["w2.9", "If any of that changes and nobody explains why, people will see it. They will tell each other about it in less than a day."], "No question.": ["w2.11", "I'm sure."], "She tastes every batch and trains every roaster, and the team would follow her anywhere.": ["w2.12", "She tastes every batch and teaches every roaster. The team trusts her completely and would go anywhere with her."], "Give her the product decisions and a seat at the table.": ["w2.13", "Let her make the decisions about the product, and let her be part of the management."], "Er… there's a growers' co-operative in Colombia that wants me to work with them.": ["w2.14", "Er… there's a group of coffee farmers in Colombia, who work together, and they want me to work with them."], "I've wanted that for years.": ["w2.15", "I have wanted to do that for years."], "If the earn-out pays me for the brand doing well, I'd hand over in the spring and come back for events.": ["w2.16", "If the earn-out pays me when the brand does well, I'd give my job to someone else in the spring. I'd come back for events."], "You've put Fernley's first, and I think you're right to.": ["b1.1", "You've put Fernley's first, and I think that is right."], "I rang Fatima this morning and asked for her position in writing.": ["b1.2", "I phoned Fatima this morning and asked her to write down what Fernley's will do."], "Her answer is attached.": ["b1.3", "Her answer is with this email."], "As promised.": ["b1.4", "Here it is, as I promised."], "At the April review, Hollow Oak keeps eye level if it stays Hollow Oak; any coffee in the Café Norde range goes with that range, to the value shelf.": ["b1.5", "When we decide the shelves in April, Hollow Oak keeps its place at eye height if it keeps the name Hollow Oak. Any coffee with the Café Norde brands goes with them, to the shelf for cheaper products."], "The June order goes ahead only if you can guarantee supply to all 340 stores from the first week, so we'll need the first deliveries in May.": ["b1.6", "We will only make the June order if you promise to send coffee to all 340 stores from the first week. So we'll need the first coffee in May."], "The anger online worries me too.": ["b2.1", "I'm also worried about the angry comments online."], "I've hired a social media agency to watch the comments and reply for us: £60,000 from the integration budget.": ["b2.2", "I've paid a social media company to read the comments and answer them for us. It costs £60,000 from the money for joining the companies."], "Isla has their first report.": ["b2.3", "Isla has the company's first report."], "Most of the comments come from the same few hundred people, and most of them say they'll wait and see what changes.": ["b2.4", "Most of the comments are from the same few hundred people. Most of them say they will wait and see what changes."], "The agency's advice is to say nothing until there's something to say.": ["b2.5", "The company says we should say nothing until we have news."], "That's £60,000 to hear what we already knew.": ["b2.6", "We paid £60,000 to hear what we already knew."], "You've put Fernley's second, so I've also asked Fatima to keep us posted.": ["b3.1", "You've put Fernley's second, so I've also asked Fatima to tell us any news."], "Fair point.": ["b4.1", "That's a good point."], "I've asked Halverson's lawyers to draft a confidentiality agreement for Sam: £40,000 from the integration budget.": ["b4.2", "I've asked Halverson's lawyers to write an agreement that stops Sam from talking about private company matters. It costs £40,000 from the money for joining the companies."], "Sam has heard about it.": ["b4.3", "Sam knows about it."], "I hear Halverson's lawyers are drafting a confidentiality agreement for me.": ["b4.4", "People tell me that Halverson's lawyers are writing an agreement that stops me from talking about private company matters."], "I've never said a bad word about anyone in twelve years.": ["b4.5", "In twelve years I've never said anything bad about anyone."], "I'll sign whatever you need, but it's a strange way to start.": ["b4.6", "I'll sign anything you need, but it's a strange way to begin."], "Agreed.": ["b5.1", "I agree."], "I've asked an outside firm to check the price against the plan for the board: £80,000 from the integration budget.": ["b5.2", "I've asked another company to check the price we paid against the plan, for the board. It costs £80,000 from the money for joining the companies."], "Jo has their summary.": ["b5.3", "Jo has a short report from them."], "The outside firm says the price only works if the savings and the supermarket growth both happen.": ["b5.4", "The other company says the price is only right if we make the savings and sell more in supermarkets."], "We knew that: it's in the plan.": ["b5.5", "We knew that already. It's in the plan."], "That's £80,000 to be told so.": ["b5.6", "We paid £80,000 to hear it."], "I've ask
