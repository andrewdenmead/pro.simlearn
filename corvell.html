<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Corvell Systems: The Side Letters (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>

/* charts: horizontal bars and a simple line chart */
function hbars(rows,label){
  const W=500,left=200,right=80,rowH=30,top=4,H=top+rows.length*rowH+4,w=W-left-right,max=Math.max(...rows.map(r=>r.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  rows.forEach((r,i)=>{const y=top+i*rowH,bw=Math.max(2,w*r.v/max);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="sa" x="${left}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="2"/><text class="val" x="${left+bw+6}" y="${y+18}">${r.t}</text>`;});
  return s+"</svg>";
}
function lineChart(pts,label,ylo,yhi,marks,xl){
  const W=500,H=190,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,x0=pts[0][0],x1=pts[pts.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  pts.forEach(([x])=>{if(x%2===0)s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${x}</text>`;});
  s+=`<text x="${l+w/2}" y="${H-2}" text-anchor="middle">${xl}</text>`;
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;
  return s+"</svg>";
}

 });

function checkCode(parts){

  return four(fnv(s)) + "-" + four(fnv(s + "#"));

function pdfByte(ch){
  const u = ch.codePointAt(0);
  if (u >= 32 && u <= 126) return u;
  if (u >= 160 && u <= 255) return u;
  if (PDF_WIN[u] !== undefined) return PDF_WIN[u];

  const base = ch.normalize("NFKD").replace(/[̀-ͯ]/g, "");   // ł, ő, ş… fall back to the plain letter
  if (base && base !== ch && base.length === 1) return pdfByte(base);

}).join("");
function pdfWidth(text, font, size){

function pdfStr(text){   // a PDF literal string in WinAnsi, with octal escapes
  let out = "(";

    if (b === 40 || b === 41 || b === 92) out += "\\" + String.fromCharCode(b);
    else if (b > 126) out += "\\" + b.toString(8).padStart(3, "0");

function pdfWrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)
        const chars = [...word]; let n = 0, w = 0;
        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }
        lines.push(chars.slice(0, n).join("")); word = chars.slice(n).join("");
      }
      line = word;
    });

  });

}
function utf16Hex(text){

function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });
  // assemble with byte offsets (all strings here are ASCII)
  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }
  const xref = len;
  let x = `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

const SIMPLE={"Corvell Systems is a Manchester software company that helps restaurants, pubs and hotels manage their stock.": ["c.1", "Corvell Systems is a software company in Manchester. Its software helps restaurants, pubs and hotels keep track of their stock."], "Its founder and chief executive, Daniel Marchetti, has spent ten years building it, and now an American private equity firm, Talvern Capital, has agreed in principle to buy it for £240 million: eight times its annual recurring revenue of £30 million.": ["c.2", "Daniel Marchetti started the company and runs it. He has worked on it for ten years. Now Talvern Capital, an American private equity firm, has agreed (not yet finally) to buy it for £240 million. That is eight times the money Corvell earns each year from regular contracts (£30 million)."], "The deal is due to be signed and completed on 29 January.": ["c.3", "The deal should be signed and finished on 29 January."], "There is a problem, and you are one of the very few people who know about it.": ["c.4", "There is a problem. Only a very few people know about it, and you are one of them."], "Each came with a private “side letter” that lets the customer cancel for free before 30 June, and none of the three has paid anything yet.": ["c.6", "Each contract came with a secret extra letter (a “side letter”). It lets the customer end the contract for free before 30 June. None of the three customers has paid anything yet."], "If Talvern knew, the price would fall by about £48 million, or the deal would collapse.": ["c.7", "If Talvern knew, it would pay about £48 million less, or it would stop the deal."], "Two stories come up in every meeting.": ["c.8", "People talk about two stories in every meeting."], "Two years ago a rival restaurant-software company was sold to a private equity firm; six months later the buyer found that the sales figures had been inflated and sued the founders, and a former finance assistant gave evidence against them.": ["c.9", "Two years ago a private equity firm bought a rival company that makes restaurant software. Six months later the buyer found that the sales figures were too high. It took the founders to court, and a former finance assistant spoke against them."], "Last year, Talvern bought another software company in only seven weeks, because the seller gave it open access to everything it asked for from the first day.": ["c.10", "Last year Talvern bought another software company in only seven weeks. This was because the seller let Talvern see everything it asked for from the first day."], "This is a simulation about how white-collar fraud works and how it is caught.": ["c.11", "This simulation shows how fraud in business works and how people find it."], "Everyone in it is fictional.": ["c.12", "All the people in it are invented."], "You are three members of Daniel's inner circle.": ["c.13", "You are three members of the small group closest to Daniel."], "Only a handful of people at Corvell know about the side letters, and Daniel intends to keep it that way.": ["c.14", "Only a few people at Corvell know about the side letters. Daniel wants to keep it that way."], "You look after the accounts Talvern will check, the year-end timetable and the people in finance.": ["c.18", "You are responsible for the accounts that Talvern will check, the plan for the end of the year and the people in finance."], "Your inbox holds messages from the chief financial officer and a financial analyst.": ["c.19", "You get emails from the head of finance and a financial analyst."], "Talvern needs answers on due diligence by 20 November, and Daniel wants your recommendations before then.": ["c.20", "Talvern needs answers about its checks (due diligence) by 20 November. Daniel wants your advice before then."], "What should Talvern's accountants see: the contract database itself, or a summary pack?": ["c.22", "What should Talvern's accountants see: the contract database itself, or only a short summary?"], "What should Corvell do about Maya Okonjo, an analyst who has been asking questions?": ["c.23", "What should Corvell do about Maya Okonjo? She is an analyst, and she has been asking questions."], "Each choice changes what the others can achieve.": ["c.25", "Each choice changes what the other choices can do."], "Door's closed, so I'll be quick.": ["c.27", "The door is closed, so I'll be quick."], "Finance, sales and customers, the deal: each of you holds part of this, so talk to each other.": ["c.28", "Finance, sales and customers, the deal: each of you knows part of this. So talk to each other."], "Hartwell's operations director wants Leon to confirm their letter in writing.": ["c.32", "The operations director at Hartwell wants Leon to confirm their letter in writing."], "Nothing goes on paper, that's settled.": ["c.33", "We have decided that nothing goes on paper."], "But do we have Leon ring him today, to calm him down, or do we say nothing at all until the deal is signed?": ["c.34", "But should Leon phone him today to make him feel calmer? Or should we say nothing at all until the deal is signed?"], "I need your answer by five.": ["c.35", "I need your answer by five o'clock."], "Hartwell's operations director has asked Leon to confirm Hartwell's side letter in writing.": ["c.36", "The operations director at Hartwell has asked Leon to confirm Hartwell's side letter in writing."], "Leon can ring him today, with nothing in writing, or Corvell can say nothing at all until the deal is signed.": ["c.37", "Leon can phone him today and write nothing. Or Corvell can say nothing at all until the deal is signed."], "Agree as a team, then everyone enters the same choice.": ["c.39", "Agree as a team. Then everyone chooses the same answer."], "You look after the sales team and Corvell's customers, including the three who signed side letters.": ["c.41", "You are responsible for the sales team and for Corvell's customers. This includes the three customers who signed side letters."], "Your inbox holds messages from the sales director and the account manager for Hartwell Inns.": ["c.42", "You get emails from the head of sales and from the person who looks after the Hartwell Inns account."], "You look after the sale itself: Talvern's checks, the auditors and the dates.": ["c.44", "You are responsible for the sale itself: Talvern's checks, the auditors and the dates."], "Your inbox holds messages from Talvern's head of due diligence and Corvell's audit partner.": ["c.45", "You get emails from the person who runs Talvern's checks and from Corvell's auditor."], "I'll keep this short, because the fewer emails about this the better.": ["e1.1", "I'll keep this short. The fewer emails about this, the better."], "Without the three side-letter contracts, our recurring revenue is £24 million, not £30 million, and at eight times revenue that's £192 million instead of £240 million.": ["e1.2", "Without the three side-letter contracts, our income from regular contracts is £24 million, not £30 million. At eight times that income, the price is £192 million, not £240 million."], "Each of you in the senior team has share options worth about £400,000 at the higher price.": ["e1.3", "At the higher price, the share options of each person in the senior team are worth about £400,000."], "My instinct is to give Talvern as little as possible to dig into: a summary pack of our contracts, with the database kept closed.": ["e1.4", "I want to give Talvern as little as possible to look into. I would send a short summary of our contracts and keep the database closed."], "We can say it's about data protection.": ["e1.5", "We can say it is about protecting personal data."], "To be fair, the database holds nothing personal beyond contact names and work email addresses, and removing those would take about two days.": ["e1.6", "But honestly, the database has no personal data except contact names and work email addresses. Taking those out would take about two days."], "Maya Okonjo, the best analyst we have, has been asking about the Hartwell contract.": ["e1.7", "Maya Okonjo is our best analyst. She has been asking about the Hartwell contract."], "I'd keep her close: a retention bonus of about £15,000 over two years and a place on the integration team, where I can see what she's doing.": ["e1.8", "I would keep her close to us. I would give her an extra payment to stay (about £15,000 over two years) and a place on the integration team. There I can see what she is doing."], "Our financial controller says any reconciliation would take him twice as long without her.": ["e1.9", "Our financial controller says any check of contracts against payments would take him twice as long without her."], "Our third-quarter accounts have already been audited.": ["e1.10", "Auditors have already checked our accounts for the third quarter."], "I could close the books early and be ready for 15 December, but I'm in no hurry: closing early is exactly the kind of thing that makes a buyer, or a new auditor, start asking questions.": ["e1.11", "I could finish the accounts early and be ready for 15 December. But I'm in no hurry. Finishing early is the kind of thing that makes a buyer, or a new auditor, start asking questions."], "Hi, two quick things, if you have a moment.": ["e2.1", "Hi, I have two quick things, if you have a moment."], "First, thank you for supporting my application for the Singapore secondment.": ["e2.2", "First, thank you for supporting me when I applied to work in Singapore for a while."], "I applied in July, and if it's approved I could start on 1 December.": ["e2.3", "I applied in July. If they say yes, I could start on 1 December."], "I'd work on the Asia-Pacific accounts for eighteen months, on the Singapore office's own finance system.": ["e2.4", "I would work on the accounts for Asia and the Pacific for eighteen months. I would use the Singapore office's own finance system."], "Second, the financial controller has asked whether I'd lead Talvern's reconciliation if I join the integration team instead.": ["e2.6", "Second, the financial controller has asked me something. If I join the integration team instead, would I lead the check that Talvern wants?"], "Talvern wants every customer contract checked against the payments we've actually received, line by line, before any signing, and the integration team will do it in the first two weeks of December.": ["e2.7", "Talvern wants us to check every customer contract against the payments we have really received, line by line, before any signing. The integration team will do this in the first two weeks of December."], "I built the reconciliation model, so I can see why he asked.": ["e2.8", "I built the tool we use for this check, so I understand why he asked me."], "And it's probably nothing, but last week a support ticket from Hartwell Inns mentioned “your cancellation letter”, and I couldn't find any cancellation terms in their contract on the system.": ["e2.9", "It's probably nothing. But last week a customer message from Hartwell Inns mentioned “your cancellation letter”. I couldn't find any cancellation terms in their contract on the system."], "I'm sure there's an innocent explanation.": ["e2.11", "I'm sure there is a simple, honest reason."], "This is going round a hospitality-tech forum today.": ["e3.1", "People are sharing this on an online forum about technology for hotels and restaurants today."], "Don't reply to it, and don't reply to anything like it.": ["e3.2", "Don't answer it, and don't answer anything like it."], "“Mate at Corvell says the Americans will strip it for parts and sack half the staff by Easter.": ["e3.3", "“A friend at Corvell says the Americans will break it up and sell the parts, and sack half the staff by Easter."], "Classic private equity.”": ["e3.4", "“Typical private equity.”"], "The post names no source.": ["e3.6", "The post does not say where the information comes from."], "Talvern has told Daniel it is not planning any redundancies.": ["e3.7", "Talvern has told Daniel that it does not plan to cut any jobs."], "I know I'm the one who signed them, so let me tell you exactly where things stand.": ["e4.1", "I know I signed them, so let me tell you exactly what the situation is."], "All three signed in September, so they're our newest customers.": ["e4.3", "All three signed in September, so they are our newest customers."], "The letters never went into the contract system.": ["e4.4", "The letters were never put into the contract system."], "They exist only as PDFs in my email.": ["e4.5", "They are only PDF files in my email."], "In the system, all three contracts look completely standard.": ["e4.6", "In the system, all three contracts look completely normal."], "Hartwell's operations director has asked me to confirm their letter in writing, because their new finance director wants it on file.": ["e4.7", "The operations director at Hartwell has asked me to confirm their letter in writing. Their new finance director wants it in their files."], "He's friendly, and they like the software, but he made one thing clear: if anyone asks them about their contract with Corvell, they will describe it as it is.": ["e4.9", "He's friendly, and they like the software. But he made one thing clear: if anyone asks them about their contract with Corvell, they will tell the truth about it."], "I'll be honest: I'm not sleeping well.": ["e4.10", "To be honest, I'm not sleeping well."], "The sooner this deal is signed, the better I'll feel.": ["e4.11", "I'll feel better as soon as this deal is signed."], "You asked me to keep an eye on Hartwell, so here's an update.": ["e5.1", "You asked me to watch Hartwell, so here is some news."], "He's friendly, but he made it clear that Hartwell is “keeping its options open” until the summer.": ["e5.3", "He's friendly. But he said clearly that Hartwell is “keeping its options open” until the summer."], "Their new finance director wants to cut costs and has already cancelled two other suppliers this year, so I think they'll cancel in June unless something changes.": ["e5.4", "Their new finance director wants to cut costs. This year they have already ended contracts with two other suppliers. So I think Hartwell will cancel in June unless something changes."], "If they do, I'd expect the other two to look hard at their own letters as well.": ["e5.5", "If they do, I think the other two customers will also look carefully at their own letters."], "Maya Okonjo from finance has also been asking me about the account: how the contract was set up, and when they'll start paying.": ["e5.6", "Maya Okonjo from finance has also asked me about the account: how the contract was made, and when they will start paying."], "Last week she asked me, quite casually, whether Hartwell had signed anything “outside the system”.": ["e5.7", "Last week she asked me, in a relaxed way, whether Hartwell had signed anything “outside the system”."], "Then she changed the subject and said she was counting the days until Singapore.": ["e5.9", "Then she started talking about something else. She said she couldn't wait to go to Singapore."], "I'm happy to help however I can.": ["e5.10", "I'm happy to help in any way I can."], "I just don't want to be the one who ends up explaining all this to anybody.": ["e5.11", "I just don't want to be the person who has to explain all this to someone in the end."], "I rang Hartwell's operations director this afternoon, as agreed.": ["e6.1", "I phoned Hartwell's operations director this afternoon, as we agreed."], "I told him the letter is safe with us and nothing changes.": ["e6.3", "I told him their letter is safe with us and nothing will change."], "He was friendly and said he'd stop chasing for now.": ["e6.4", "He was friendly. He said he would stop asking for now."], "But he also said that if anyone else asks about their contract, they'll tell them exactly what it says, and he has put a note of our call in their file for the finance director.": ["e6.5", "But he also said this: if anyone else asks about their contract, they will say exactly what it says. And he has put a note about our call in their file for the finance director."], "As agreed, I haven't replied to Hartwell.": ["e7.1", "As we agreed, I haven't answered Hartwell."], "Their operations director wrote again this morning, and this time he copied in their finance director.": ["e7.2", "Their operations director wrote again this morning. This time he also sent it to their finance director."], "He's still polite, but he says they need the confirmation on file before their own year-end.": ["e7.3", "He is still polite. But he says they need the confirmation in their files before the end of their own financial year."], "I'm not replying.": ["e7.4", "I'm not answering."], "I'm just telling you.": ["e7.5", "I'm only telling you."], "Thank you for a very positive first meeting.": ["e8.1", "Thank you for a very good first meeting."], "As agreed, here is how we'd like to proceed.": ["e8.2", "As we agreed, here is what we would like to do next."], "We'd like full read-only access to your contract database.": ["e8.3", "We would like to see your whole contract database, without changing anything in it."], "Our accountants check the revenue figures against it, and with access by 20 November they can finish in about three weeks.": ["e8.4", "Our accountants check the income figures against it. If we can see it by 20 November, they can finish in about three weeks."], "Alongside that, we will interview the ten customers who have been with Corvell longest, as we always do.": ["e8.5", "At the same time, we will talk to the ten customers who have been with Corvell the longest. We always do this."], "Please be aware that our investment committee treats any refusal of database access as a serious warning sign.": ["e8.6", "Please note: our investment committee sees any refusal to show the database as a serious warning."], "If we received a summary pack instead, our lawyers would insist on interviewing every customer worth more than £1 million a year, and everything would slow down.": ["e8.7", "If we only got a short summary, our lawyers would want to talk to every customer worth more than £1 million a year. Everything would take longer."], "On timing, we normally wait for the year-end audit, which is why we proposed 29 January.": ["e8.8", "We usually wait for the end-of-year audit. That's why we suggested 29 January."], "However, if your third-quarter accounts have been audited, we could accept them as the basis for signing.": ["e8.9", "But if auditors have already checked your accounts for the third quarter, we could use those accounts for the signing."], "With full access by 20 November, our committee could approve the deal on 11 December, and we could sign and complete on 15 December.": ["e8.10", "If we can see everything by 20 November, our committee could agree to the deal on 11 December. Then we could sign and finish the deal on 15 December."], "As usual, the senior team will also give warranties, including written confirmation that there are no side agreements with any customer.": ["e8.11", "As usual, the senior team will also make formal promises about the company (warranties). One of them is a written promise that there are no extra secret agreements with any customer."], "Dear Daniel, copying the team,": ["e9.1", "Dear Daniel, and the team,"], "I retire on 31 December after eleven years as Corvell's audit partner.": ["e9.2", "I will retire on 31 December. I have been Corvell's audit partner for eleven years."], "It has been a pleasure, and I wish you every success with the sale.": ["e9.3", "I have enjoyed it, and I hope the sale goes very well."], "From January, my colleague Clare Danvers will take over.": ["e9.4", "From January, my colleague Clare Danvers will take over from me."], "Clare trained in forensic accounting, and she has her own way of doing things.": ["e9.5", "Clare trained as an accountant who investigates problems (forensic accounting), and she has her own way of working."], "For the year-end audit she will send confirmation letters to Corvell's twenty largest customers, asking each of them to confirm their contract terms in writing.": ["e9.6", "For the end-of-year audit, she will write to Corvell's twenty biggest customers. She will ask each of them to confirm the terms of their contract in writing."], "It's standard practice for a company of your size, and frankly I should have introduced it years ago.": ["e9.7", "This is normal for a company of your size. To be honest, I should have started doing it years ago."], "Clare reads every reply herself.": ["e9.8", "Clare reads every answer herself."], "The letters will go out in the third week of January.": ["e9.9", "She will send the letters in the third week of January."], "I've had a look at her list: Hartwell Inns is fourth on it, and Solent Ferries ninth.": ["e9.10", "I have looked at her list: Hartwell Inns is number four on it, and Solent Ferries is number nine."], "Please make sure the customer contact details are up to date by then.": ["e9.11", "Please make sure the customers' contact details are correct by then."], "For what it's worth, my third-quarter audit checked the revenue against the contract database and the bank, and found nothing unusual.": ["e9.12", "Also: my audit of the third quarter checked the income against the contract database and the bank. It found nothing strange."], "It didn't involve writing to customers.": ["e9.13", "It did not include writing to customers."], "A buyer's accountants check the revenue figures against the records in the contract database: each contract's price, dates and terms.": ["x1.1", "A buyer's accountants check the income figures against the records in the contract database: the price, the dates and the terms of each contract."], "They can only test what is recorded there, which is why buyers also interview customers.": ["x1.2", "They can only check what is in the database. That's why buyers also talk to customers."], "When a seller offers a summary instead of the database, buyers rarely walk away.": ["x1.3", "When a seller offers a summary instead of the database, buyers rarely stop the deal."], "Instead they widen their customer interviews, usually from a small sample of long-standing customers to every large customer, because the interviews become their main check.": ["x1.4", "Instead they talk to more customers. They usually go from a few long-standing customers to every big customer, because talking to customers becomes their main check."], "Most hidden contract terms come to light through cash, not paperwork.": ["x2.1", "Most hidden contract terms are found by following the money, not the documents."], "A reconciliation of contracts against payments puts every contract that has been paid late, or not at all, on an exceptions list, and each item has to be explained in writing.": ["x2.2", "A check of contracts against payments makes a list of every contract that was paid late, or not at all. Someone has to explain each one in writing."], "Large new contracts that have paid nothing for months are the first items an experienced analyst looks at.": ["x2.3", "An experienced analyst looks first at big new contracts that have paid nothing for months."], "In the cases we see, the first question usually comes from someone in the finance team, not from an auditor.": ["x2.4", "In our cases, the first question usually comes from someone in the finance team, not from an auditor."], "In a confirmation, the auditor writes directly to the customer, and the reply goes straight back to the auditor, not through the company.": ["x3.1", "In a confirmation, the auditor writes to the customer directly. The answer goes straight back to the auditor, not through the company."], "Customers are asked to confirm the terms of their contract, and most simply attach what they have on file, including any side agreement.": ["x3.2", "Customers are asked to confirm the terms of their contract. Most of them just add what they have in their files, and this includes any extra agreement."], "A new audit partner usually reviews a client from scratch and often sends more confirmations in the first year than the previous partner did.": ["x3.3", "A new audit partner usually checks a client again from the beginning. In the first year, they often send more confirmation letters than the partner before them."], "Sellers give warranties that the accounts are accurate and that nothing material has been hidden, and senior managers usually sign them personally.": ["x4.1", "Sellers make formal promises (warranties) that the accounts are correct and that nothing important has been hidden. Senior managers usually sign these promises themselves."], "If the buyer finds a problem before signing, the price is renegotiated, often sharply, or the buyer walks away.": ["x4.2", "If the buyer finds a problem before signing, the price changes, often a lot, or the buyer stops the deal."], "After completion, the buyer can claim under the warranties, usually for eighteen months to two years.": ["x4.3", "After the deal is finished, the buyer can ask for money under the promises, usually for eighteen months to two years."], "Claims for fraud are different: the time limit only starts when the fraud is discovered.": ["x4.4", "Claims for fraud are different: the time limit only starts when someone discovers the fraud."], "Investment committees judge how a seller behaves as well as the numbers.": ["x5.1", "Investment committees look at how a seller behaves, not only at the numbers."], "Open access from the first day is read as confidence; a refusal is read as a warning sign, and it slows the deal and widens the checks.": ["x5.2", "If a seller lets the buyer see everything from the first day, the committee sees confidence. A refusal is a warning sign: the deal takes longer and the checks get bigger."], "A seller who asks to sign earlier than planned is not unusual, and committees often agree if they have been able to see everything.": ["x5.3", "It is quite normal for a seller to ask to sign earlier than planned. Committees often agree if they have been able to see everything."], "Without full access, they almost always say no.": ["x5.4", "If they can't see everything, they nearly always say no."], "In the UK, a worker who reports wrongdoing is protected by the Public Interest Disclosure Act 1998, and no confidentiality clause can stop a protected disclosure.": ["x6.1", "In the UK, the Public Interest Disclosure Act 1998 protects a worker who reports something wrong. No confidentiality agreement can stop this kind of report."], "A worker who is treated badly for speaking up can take the employer to a tribunal.": ["x6.2", "If a worker is treated badly for speaking up, they can take the employer to a tribunal (a special court)."], "Employers sometimes answer an employee's questions with a promotion or a bonus.": ["x6.3", "Sometimes employers react to an employee's questions with a better job or extra money."], "In our experience, that rarely ends the questions: it usually gives the employee more access, not less concern.": ["x6.4", "In our experience, this rarely stops the questions. It usually gives the employee more access, and they are just as worried."], "Look, I signed them, I know.": ["w1.1", "Look, I know I signed them."], "In the system, all three contracts look completely standard, so nobody else has ever seen them.": ["w1.4", "In the system, all three contracts look completely normal, so nobody else has ever seen them."], "Get the deal signed, and nobody ever needs to.": ["w1.5", "If the deal gets signed, nobody will ever need to see them."], "That's all I'm asking.": ["w1.6", "That's the only thing I'm asking for."], "Each of them signed one, so each of them has a copy.": ["w1.8", "Each customer signed one, so each customer has a copy."], "Hartwell's is in their finance director's file.": ["w1.9", "Hartwell's copy is in their finance director's file."], "Most of this year's.": ["w1.11", "Most of this year's bonus."], "Er… they took me over my target.": ["w1.12", "Er… they took me above my sales target."], "They were worried Corvell would be sold to someone they didn't trust, and that prices would go up.": ["w1.14", "They were worried that Corvell would be sold to someone they didn't trust, and that prices would go up."], "The letters closed the deals before the end of the quarter.": ["w1.15", "The letters helped me finish the deals before the end of the quarter."], "At the time, I honestly thought none of them would ever use them.": ["w1.16", "At the time, I really thought none of them would ever use them."], "I'm really hoping the Singapore secondment comes through: I could start on 1 December, and it would be a big step for me.": ["w2.3", "I really hope I can go to Singapore: I could start on 1 December, and it would be a big step for me."], "But Nadia's mentioned the integration team too, and honestly, I'd enjoy that as well.": ["w2.4", "But Nadia has also talked about the integration team, and honestly, I would enjoy that too."], "I just like numbers that add up.": ["w2.5", "I just like numbers that are correct."], "The Asia-Pacific accounts, on the Singapore office's own finance system, for eighteen months.": ["w2.6", "The accounts for Asia and the Pacific, on the Singapore office's own finance system, for eighteen months."], "I wouldn't have access to the UK systems at all.": ["w2.7", "I wouldn't be able to use the UK systems at all."], "A completely fresh start.": ["w2.8", "A completely new start."], "With a full reconciliation of every contract against payments.": ["w2.9", "With a full check of every contract against the payments."], "Not a penny.": ["w2.11", "Not even a little."], "We were bought by a larger competitor, and their accountants spent weeks in our systems.": ["w2.14", "A bigger competitor bought us, and their accountants spent weeks looking at our systems."], "They were thorough but fair, and the deal went through.": ["w2.15", "They were careful but fair, and the deal happened."], "Buyers mostly want to understand a business, not catch it out.": ["w2.16", "Buyers mostly want to understand a business, not catch it doing something wrong."], "You've put Maya first, and I think you're right: questions are how these things come out.": ["b1.1", "You put Maya first, and I think you're right: questions are how these things come out."], "I've asked Nadia to find out quietly what Maya has actually got.": ["b1.2", "I've asked Nadia to find out, without anyone noticing, what Maya really knows."], "Daniel asked me to look quietly at what Maya has been working on.": ["b2.1", "Daniel asked me to look, without anyone noticing, at what Maya has been working on."], "Her working file has a tab called “Check before Talvern”: Hartwell, Solent and the hotel group, £6 million a year between them, nothing paid since September, and a note that says “cancellation terms?”": ["b2.2", "Her working file has a page called “Check before Talvern”. It lists Hartwell, Solent and the hotel group, £6 million a year together, nothing paid since September, and a note: “cancellation terms?”"], "She has also asked HR when the secondment panel will decide.": ["b2.3", "She has also asked HR when the group that decides about Singapore will decide."], "As far as I can tell, she hasn't shown the file to anyone yet.": ["b2.4", "As far as I know, she hasn't shown the file to anyone yet."], "I've hired a data-room firm to go through it before Talvern does: £30,000, and they start tomorrow.": ["b3.2", "I've paid a data-room company to check it before Talvern does: £30,000. They start tomorrow."], "The data-room firm has finished.": ["b4.1", "The data-room company has finished."], "Their report: the database is complete and consistent, and every contract shows standard terms.": ["b4.2", "Their report says the database is complete and correct, and every contract shows normal terms."], "£30,000 to be told what we already knew, and two more outsiders have now been through our records.": ["b4.3", "We paid £30,000 to hear what we already knew. And now two more people from outside have looked at our records."], "You've put Maya second, so I've mentioned her to Nadia as well.": ["b5.1", "You put Maya second, so I've also told Nadia about her."], "Leon has been looking terrible.": ["b6.1", "Leon has looked very stressed."], "I've sent him on two weeks' leave until things calm down.": ["b6.2", "I've sent him on two weeks' holiday until things are calmer."], "With Leon on leave, Hartwell's operations director rang me instead.": ["b7.1", "With Leon on holiday, Hartwell's operations director phoned me instead."], "He asked whether I could confirm their letter, since Leon hasn't.": ["b7.2", "He asked if I could confirm their letter, because Leon hasn't."], "I said I'd pass the message on.": ["b7.3", "I said I would give the message to someone else."], "He now wants the confirmation sent to their finance director directly.": ["b7.4", "Now he wants the confirmation to go straight to their finance director."], "I don't like that coverage either.": ["b8.1", "I don't like those news stories either."], "I've hired a financial PR agency for the next two months to put the price in a better light: £25,000.": ["b8.2", "I've paid a financial PR company for the next two months to make the price look better: £25,000."], "The PR agency wants a briefing on “the story behind the numbers”, starting with how we won our three biggest new contracts.": ["b9.1", "The PR company wants us to explain “the story behind the numbers”. They want to start with how we won our three biggest new contracts."], "I've put them off for now.": ["b9.2", "I've told them to wait for now."], "£25,000, and one more set of people asking questions.": ["b9.3", "That's £25,000, and one more group of people asking questions."], "Losing Hartwell in June would hurt.": ["b10.1", "It would be bad to lose Hartwell in June."], "I've asked Grace to offer them a 10% discount for a two-year renewal, in a normal letter, so it looks like business as usual.": ["b10.2", "I've asked Grace to offer them 10% off the price if they stay for two more years. She'll send a normal letter, so it looks like everyday business."], "Hartwell's operations director thanked us for the discount offer and passed it to their finance director.": ["b11.1", "Hartwell's operations director thanked us for the offer of a lower price. He sent it to their finance director."], "The finance director replied the same day with one question: does the offer change anything in the side letter?": ["b11.2", "The finance director answered the same day with one question: does the offer change anything in the side letter?"], "Talvern has asked Sales and Customers for customer contacts for its interviews, and Leon has to reply before Daniel answers on the database.": ["p1.2", "Talvern has asked Sales and Customers for the contact details of customers it can interview. Leon has to answer before Daniel says what Talvern can see."], "He wants the facts behind both options checked with the whole team first.": ["p1.3", "He wants to check the facts about both options with the whole team first."], "Customer contacts for your interviews: list attached (to be checked).": ["p1.5", "Contact details of customers for your interviews: the list is attached (still to check)."], "Contract records: full database access, or a summary pack (Daniel to decide).": ["p1.6", "Contract records: the whole database, or a short summary (Daniel will decide)."], "HR needs Finance's answer on Maya by Friday, when the secondment panel meets, and the integration team's names go to Talvern next week.": ["p2.2", "HR needs an answer about Maya from Finance by Friday. The group that decides about Singapore meets then, and the names of the integration team go to Talvern next week."], "Nadia wants the facts behind both options checked wi
