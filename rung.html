const SIMPLE={"This is a thought experiment set in the near future.": ["c.1", "This is an imagined story set in the near future."], "The United Kingdom, its institutions, its student loans and the history mentioned in the sources are real.": ["c.2", "Some things in it are real: the United Kingdom, its institutions, its student loans and the history in the sources."], "The AI agents, the commission, every person quoted, every study and every figure in the sources, apart from the history they name, are invented for this classroom exercise.": ["c.3", "Other things are made up for this class: the AI agents, the commission, every person quoted, and every study and every figure in the sources, except the history they name."], "Practise citing these sources as if they were real, but never cite them, or any 'fact' from this scenario, in real academic work.": ["c.4", "Practise citing these sources as if they were real. But never cite them, or any 'fact' from this story, in real academic work."], "For more than a century, Britain's professions trained their own: a trainee solicitor spent two years drafting contracts and checking documents under a partner's eye, and a junior auditor learned the trade by working through other people's accounts.": ["c.5", "For more than a hundred years, Britain's professions trained their own new staff. A trainee solicitor spent two years writing contracts and checking documents while a partner watched. A junior auditor learned the job by working through other people's accounts."], "The routine work earned fees and made tomorrow's partners.": ["c.6", "This routine work brought in money and turned trainees into the partners of the future."], "Meanwhile, the state encouraged young people to go to university: in 1999 the government set a target of half of all young people entering higher education.": ["c.7", "At the same time, the state encouraged young people to go to university. In 1999, the government set a target: half of all young people should go into higher education."], "Two generations earlier, coal and steel towns had lost their main employers, and their workers had been told to retrain, move or accept lower pay.": ["c.8", "Two generations before, coal and steel towns had lost their main employers. Their workers were told to train for new work, move somewhere else, or accept lower pay."], "In July 2033, a year before the commission began its work, this report went out on national radio:": ["c.9", "In July 2033, one year before the commission started its work, national radio played this report:"], "Chloe Brennan, 22, has a law degree, 140 job applications behind her and a job in a café near the station.": ["c.11", "Chloe Brennan is 22. She has a law degree. She has applied for 140 jobs, and she works in a café near the station."], "Five years ago, the Leeds law firm Firth Doyle took on twelve trainees a year; this year it took two.": ["c.13", "Five years ago, the Leeds law firm Firth Doyle took twelve new trainees a year. This year it took two."], "“The agents produce a better first draft than most trainees did, they do it in minutes, and our clients are paying about a third of what they used to,” said its managing partner, Martin Firth.": ["c.14", "“The agents write a better first draft than most trainees did. They do it in minutes. And our clients pay about a third of what they used to,” said Martin Firth, the firm's managing partner."], "“If nobody's training now, who's going to run this firm in 2050?”": ["c.15", "“If nobody is training new people now, who will run this firm in 2050?”"], "Across the city, the electrician Dean Walsh can't find apprentices fast enough, and now earns more than his cousin, a solicitor.": ["c.16", "In another part of the city, the electrician Dean Walsh cannot find enough apprentices. He now earns more than his cousin, who is a solicitor."], "You are three researchers on the commission's evidence team.": ["c.17", "You are three researchers. You work on the commission's evidence team."], "Each of you holds different sources.": ["c.18", "Each of you has different sources."], "You weigh the evidence on why the graduate jobs went and whether they will come back.": ["c.21", "You look at the evidence on two questions: why did the graduate jobs go, and will they come back?"], "Your sources are research on what the agents do and on what has happened to the first rung of professional careers.": ["c.22", "Your sources are research on what the agents do, and on what has happened to the first step of professional careers."], "It began in 2029, when the first AI “agents” arrived in British offices.": ["c.27", "It started in 2029. That year, the first AI “agents” came into British offices."], "Unlike the chatbots before them, an agent does not just answer questions: it carries out a whole piece of work, such as drafting a contract, checking a company's accounts or writing a policy briefing, while a senior professional supervises.": ["c.28", "Earlier chatbots only answered questions. An agent does more: it does a whole piece of work, for example writing a contract, checking a company's accounts or writing a short report on a policy. A senior professional watches over its work."], "Within four years, most of the work that young graduates used to do in law firms, accounting firms, banks, consultancies and government departments was being done by agents.": ["c.29", "Four years later, agents were doing most of the work that young graduates used to do. This was true in law firms, accounting firms, banks, consultancies and government departments."], "For the class of 2032, more than a quarter of graduates were still unemployed six months after graduating, and many more were working in jobs that did not need a degree.": ["c.31", "Look at the students who finished university in 2032. Six months later, more than a quarter of them still had no job. Many more had jobs that did not need a degree."], "At the same time, legal and accounting help became cheap enough for almost anyone to afford, and the professions became more productive than they had been for decades.": ["c.32", "At the same time, help from lawyers and accountants became so cheap that almost anyone could pay for it. The professions also got more done than they had for decades."], "Meanwhile, electricians and plumbers found themselves earning more than junior lawyers.": ["c.33", "During this time, electricians and plumbers started to earn more than junior lawyers."], "The government has set up a Commission on Work and the Graduate Economy to recommend what to do.": ["c.34", "The government has created a Commission on Work and the Graduate Economy. Its job is to say what should be done."], "The government wants our terms of reference by Friday.": ["c.37", "The government wants our terms of reference (what exactly we will look at) by Friday."], "Everyone I met had already decided.": ["c.38", "Everyone I met had already made up their mind."], "Half said the firms are just being greedy.": ["c.39", "Half of them said the firms are just greedy."], "The other half said new jobs always turn up.": ["c.40", "The other half said new jobs always appear."], "I don't want either speech.": ["c.41", "I don't want to give either of those speeches."], "If we lean on a weak one, the committee will take us apart, whichever way we go.": ["c.44", "If we depend on a weak source, the committee will destroy our argument, whatever we decide."], "The government needs the commission's terms of reference by Friday.": ["c.45", "The government needs the commission's terms of reference (what exactly it will look at) by Friday."], "Some of the commission's advisers want narrow terms: “What happened to the graduate route into the professions, and what should be done about it?”": ["c.46", "Some advisers on the commission want narrow terms: “What happened to the graduate route into the professions, and what should be done about it?”"], "Others want broad ones: “What has happened to everyone whose work the agents changed, with a degree or without?”": ["c.47", "Other advisers want broad terms: “What has happened to everyone whose work the agents changed, with a degree or without?”"], "Agree as a team, then everyone enters the same choice.": ["c.49", "Agree as a team. Then everyone enters the same choice."], "You advise the commission on who deserves help.": ["c.51", "You advise the commission on who should get help."], "Your sources are the two most cited papers on whether graduates who lost out to AI have a special claim.": ["c.52", "Your sources are the two papers that people cite most often on one question: do graduates who lost out to AI have a special right to help?"], "You draft the commission's recommendation.": ["c.54", "You write the first version of the commission's recommendation."], "Your sources make the case for each of the two proposals the government has asked the commission to compare.": ["c.55", "Your sources give the arguments for each of the two plans that the government wants the commission to compare."], "This is going round.": ["e1.1", "People are sharing this."], "I doubt it helps us, but you should know what people are reading.": ["e1.2", "I don't think it helps us, but you should know what people are reading."], "“My grandad lost his job when the pits closed, and he retrained.": ["e1.3", "“My grandad lost his job when the coal mines closed, and he trained for new work."], "Graduates should stop moaning and do the same.”": ["e1.5", "Graduates should stop complaining and do the same.”"], "(post by a business commentator with 1.2 million followers, 3 June 2034)": ["e1.6", "(a post by a business commentator who has 1.2 million followers, 3 June 2034)"], "The post gives no figures and names no source.": ["e1.7", "The post has no figures and does not name a source."], "This report asks why graduate vacancies in professional services fell by 61 per cent between 2029 and 2033.": ["e2.1", "This report asks a question: why did graduate jobs in professional services fall by 61 per cent between 2029 and 2033?"], "The popular answer, that firms used AI as an excuse to cut costs and that quality suffered, does not fit the evidence.": ["e2.2", "Many people say firms used AI as a reason to save money, and the quality of work got worse. The evidence does not support this answer."], "On most entry-level tasks the agents make fewer mistakes than the trainees they replaced, at a fraction of the cost, and clients notice little difference except in the price: routine legal services cost about 70 per cent less than in 2029 (Commission on Work and the Graduate Economy, 2034a).": ["e2.3", "On most beginner tasks, the agents make fewer mistakes than the trainees did before, and they cost much less. Clients see almost no difference, apart from the price: simple legal services cost about 70 per cent less than in 2029 (Commission on Work and the Graduate Economy, 2034a)."], "Senior professionals marked contract drafts, audit samples and policy briefings without knowing who had produced them.": ["e2.4", "Senior professionals marked draft contracts, samples from audits and policy reports. They did not know who had done each piece of work."], "On tasks that needed knowledge of a client's history, the agents' error rate rose to 5.8%.": ["e2.5", "On tasks where you need to know a client's history, the agents' error rate went up to 5.8%."], "Admittedly, some firms cut too quickly, a few have rehired after expensive mistakes, and others simply followed their competitors.": ["e2.6", "It is true that some firms cut jobs too fast, a few have hired again after mistakes that cost a lot, and others just did what their competitors did."], "These cases are the exception.": ["e2.7", "But these cases are unusual."], "The report concludes that the jobs went because the work can be done better and more cheaply without them, which is a far harder problem to solve than greed.": ["e2.8", "The report's conclusion is this: the jobs went because the work can be done better and more cheaply without them. That problem is much harder to fix than greed."], "Optimists expect new graduate work to replace the jobs that agents have taken, as after earlier technologies: after cash machines spread, the number of bank tellers in the United States did not fall for three decades, and job adverts with new AI-related titles rose from 11,000 in 2031 to 44,000 in 2033 (Quality in Advice Forum, 2034).": ["e3.1", "Optimists think new graduate jobs will take the place of the jobs agents have taken, as with earlier technologies. For example, when cash machines became common, the number of bank tellers in the United States did not fall for thirty years. And job adverts with new AI-related titles went up from 11,000 in 2031 to 44,000 in 2033 (Quality in Advice Forum, 2034)."], "This article argues that the comparison breaks down.": ["e3.2", "This article says the comparison does not work."], "Earlier machines took over particular tasks, and people moved on to the work around them.": ["e3.3", "Earlier machines took over certain tasks, and people moved to the work around them."], "This time, the tasks being automated are the very ones through which young professionals learned their trade: a trainee solicitor became a solicitor by spending two years drafting contracts and checking documents.": ["e3.4", "This time, machines are doing exactly the tasks that young professionals learned their job from. A trainee solicitor became a solicitor by spending two years writing contracts and checking documents."], "Without that first rung, nobody can climb onto the ladder.": ["e3.5", "Without that first step, nobody can get onto the ladder."], "New roles, such as supervising and auditing agents, numbered about 44,000 between 2030 and 2033, against about 390,000 entry-level graduate roles lost, and 80 per cent of them ask for at least three years' professional experience.": ["e3.6", "Between 2030 and 2033, there were about 44,000 new jobs, such as watching over agents and checking their work. In the same time, about 390,000 beginner jobs for graduates were lost. 80 per cent of the new jobs need at least three years' professional experience."], "Left alone, the article concludes, the market will not rebuild the first rung.": ["e3.7", "The article's conclusion is this: if nobody acts, the market will not create the first step again."], "This paper argues that graduates who have lost out to AI deserve more help than earlier workers whose jobs disappeared, because the state made them a promise.": ["e4.1", "This paper says that graduates who lost out to AI deserve more help than earlier workers whose jobs disappeared. The reason is that the state made them a promise."], "Governments called a degree the safest investment, and in 1999 set a target of half of all young people going into higher education, first met in 2017–18.": ["e4.2", "Governments said a degree was the safest investment. In 1999, they set a target: half of all young people should go into higher education. This was first reached in 2017–18."], "The class of 2032 borrowed an average of £52,000, and within four years the jobs had largely gone: between enrolment and graduation, not over decades.": ["e4.3", "The class of 2032 borrowed £52,000 on average. Four years later, most of the jobs were gone. This happened between the start of university and graduation, not slowly over decades."], "Six months after graduating, 27 per cent of that class were unemployed, against 5 per cent of the class of 2028, and a further 22 per cent were in jobs that did not need a degree.": ["e4.4", "Six months after finishing university, 27 per cent of that class had no job. Another 22 per cent of them had jobs that did not need a degree. For the class of 2028, the share with no job was 5 per cent."], "A third of the unemployed were the first in their family to go to university, 41 per cent were living with their parents, and anxiety was twice as common as among those in work (Institute for Work and Technology, 2033b).": ["e4.5", "Of the graduates without jobs, a third were the first in their family to go to university, and 41 per cent lived with their parents. Anxiety was twice as common for them as for graduates with jobs (Institute for Work and Technology, 2033b)."], "Nor has retraining filled the gap: of 118,000 graduates who completed the Second Start programme, 26 per cent were in work that used their new skills eighteen months later, at a median £23,800, against £31,500 for a graduate starter in 2029 (Institute for Work and Technology, 2034b).": ["e4.6", "Retraining has not solved the problem either. 118,000 graduates finished the Second Start programme. Eighteen months later, 26 per cent had jobs that used their new skills. Their median pay was £23,800. In 2029, a graduate starter earned £31,500 (Institute for Work and Technology, 2034b)."], "These graduates followed advice that the state itself gave them.": ["e4.7", "These graduates followed advice from the state itself."], "Where the state has encouraged an investment, the paper concludes, it has a special duty when that investment fails.": ["e4.8", "The paper's conclusion is this: when the state has encouraged people to make an investment, it has a special duty if that investment fails."], "When Britain's pits and steelworks closed, their workers were told to retrain, move or accept lower pay, often by the same professional class that now asks for special help for graduates.": ["e5.1", "When Britain's coal mines and steelworks closed, the workers were told to train for new work, move somewhere else, or accept lower pay. The people who said this were often from the same professional class that now wants special help for graduates."], "This paper argues that graduates do not deserve more help than those workers did.": ["e5.2", "This paper says graduates do not deserve more help than those workers got."], "The graduates' jobs went quickly, but so did the miners'.": ["e5.3", "The graduates' jobs disappeared fast, but so did the miners' jobs."], "About 170 pits were still working in 1984; by the mid-1990s fewer than twenty remained, and the last deep mine closed in 2015.": ["e5.4", "In 1984, about 170 pits were still working. By the mid-1990s, fewer than twenty were left. The last deep mine closed in 2015."], "The employment rate in former coalfield areas is still 4 percentage points below the national average.": ["e5.5", "In areas that used to have coal mines, the employment rate is still 4 percentage points lower than the national average."], "Unemployed graduates, by contrast, are young, their skills can be used elsewhere, and many have families who can help: the median household wealth of their parents is £340,000, against £120,000 for all households of unemployed people (Commission on Work and the Graduate Economy, 2034d).": ["e5.6", "But unemployed graduates are young, they can use their skills in other jobs, and many have families who can help them. The median household wealth of their parents is £340,000. For all households of unemployed people, it is £120,000 (Commission on Work and the Graduate Economy, 2034d)."], "Some, admittedly, are the first in their family to go to university, and they deserve help like anyone else in need.": ["e5.7", "It is true that some are the first in their family to go to university. They deserve help like anyone else who needs it."], "A special scheme, however, would reward qualifications rather than need.": ["e5.8", "But a special scheme would reward qualifications, not need."], "Help, the paper concludes, should go to whoever needs it most, whether they hold a degree or not.": ["e5.9", "The paper's conclusion is this: help should go to the people who need it most, with or without a degree."], "This paper proposes a Human Trainee Requirement: every professional-services firm with 250 or more staff would employ one human trainee for every fifteen AI agents it uses.": ["e6.1", "This paper suggests a Human Trainee Requirement. Every professional-services firm with 250 or more staff would employ one human trainee for every fifteen AI agents it uses."], "The case does not rest on any claim that the agents work badly.": ["e6.2", "The argument does not say that the agents do bad work."], "On the contrary, they work well, and that is precisely the problem: a firm that can buy a near-flawless first draft for a fraction of a trainee's cost has no reason to train anyone, so firms acting sensibly are together dismantling the system that produces experienced professionals.": ["e6.3", "The opposite is true: they do good work, and that is exactly the problem. A firm can buy an almost perfect first draft for a small part of what a trainee costs, so it has no reason to train anyone. Each firm is being sensible, but all together they are breaking the system that creates experienced professionals."], "The cost includes trainees' salaries but not the time senior staff would spend supervising them.": ["e6.4", "The cost includes trainees' pay. It does not include the time senior staff would spend watching over them."], "The model assumes that firms will not move work to subsidiaries with fewer than 250 staff.": ["e6.5", "The model expects that firms will not move work to smaller companies they own with fewer than 250 staff."], "A requirement would share the cost of training across the industry.": ["e6.6", "With a requirement, the whole industry would share the cost of training."], "Critics say that firms will invent work for trainees; however, trainees can do useful work by checking and correcting what the agents produce.": ["e6.7", "Critics say firms will make up work for trainees. But trainees can do useful work: they can check and correct what the agents produce."], "About £1.9 billion a year, the paper concludes, is a small price for keeping the professions alive.": ["e6.8", "The paper's conclusion is this: about £1.9 billion a year is a small price for keeping the professions alive."], "This paper proposes an AI Dividend: a levy of 25 per cent on firms' spending on AI agents, paid out in equal shares to every adult.": ["e7.1", "This paper suggests an AI Dividend. Firms would pay a levy of 25 per cent on what they spend on AI agents. The money would be shared equally among all adults."], "Output per hour in the professions has risen by almost 4 per cent a year since 2030, but the gains have gone mainly to the firms that own the agents and to the senior staff who supervise them.": ["e7.2", "In the professions, output per hour has gone up by almost 4 per cent a year since 2030. But most of the gains have gone to the firms that own the agents and to the senior staff who watch over them."], "Slow adopters, many of them high-street practices, have lost about two fifths of their routine work; they make up most of the Quality in Advice Forum's membership, fund it, and back its campaign for a human to sign off all agent work.": ["e7.3", "Firms that were slow to start using agents, many of them high-street firms, have lost about two fifths of their routine work. Most of the Quality in Advice Forum's members are firms like these. They pay for the Forum, and they support its campaign for a human to approve all agent work."], "The new jobs that optimists promised have been few, and most demand experience that young graduates cannot have.": ["e7.4", "There have been few of the new jobs that optimists promised. Most of them need experience that young graduates cannot have."], "A dividend shares the gains with everyone, including care workers, shop assistants and former industrial towns, and needs no guess about which jobs will exist.": ["e7.5", "A dividend shares the gains with everyone, including care workers, shop assistants and old industrial towns. Also, nobody has to guess which jobs will exist."], "Nor need it stop people working: Alaska has paid every resident a dividend since 1982 with no fall in employment, although neither Alaska nor Finland's experiment of 2017–18 tested such payments on unemployed graduates (Commission on Work and the Graduate Economy, 2034f).": ["e7.6", "It also does not have to stop people working. Alaska has paid every resident a dividend since 1982, and employment did not fall. But neither Alaska nor Finland's experiment of 2017–18 tested payments like these on unemployed graduates (Commission on Work and the Graduate Economy, 2034f)."], "Narrow terms it is: the graduate route into the professions.": ["e8.1", "So we choose narrow terms: the graduate route into the professions."], "That puts the class of 2032 first: what they borrowed, and what became of them.": ["e8.2", "That means the class of 2032 comes first: what they borrowed, and what happened to them."], "Keep everyone else in view too.": ["e8.3", "But don't forget everyone else."], "Broad terms it is: everyone whose work the agents changed, degree or not.": ["e9.1", "So we choose broad terms: everyone whose work the agents changed, with or without a degree."], "That puts the comparison first: who lost what, and who was helped before.": ["e9.2", "That means the comparison comes first: who lost what, and who got help in the past."], "Keep the graduates in view too.": ["e9.3", "But don't forget the graduates."], "Insurers pay for advisers' costly mistakes out of their own money, so they watch error rates closely.": ["x1.1", "When advisers make expensive mistakes, insurers pay with their own money. So they watch error rates carefully."], "Between 2029 and 2033, negligence claims per 1,000 routine matters fell by about a third, and premiums for firms whose agents' work is checked by a qualified professional fell by about a fifth.": ["x1.2", "Between 2029 and 2033, claims for careless mistakes fell by about a third for every 1,000 routine cases. For firms where a qualified professional checks the agents' work, the price of insurance fell by about a fifth."], "The exception is matters that depend on a client's long history, where claims rose slightly; the £300 million takeover case was one of them.": ["x1.3", "The exception is cases that depend on a client's long history. There, claims went up a little. The £300 million takeover case was one of these."], "Insurers do not cut their prices for work that has become less reliable.": ["x1.4", "Insurers do not lower their prices for work that has become less reliable."], "Of 1,200 firms, 34 per cent said they had reduced graduate hiring partly because competitors were doing so, and 9 per cent have since rehired some trainees after costly errors.": ["x2.1", "Of 1,200 firms, 34 per cent said they had hired fewer graduates partly because their competitors were doing the same. 9 per cent have since hired some trainees again after mistakes that cost a lot."], "The best known, at a large City law firm in 2032, was an agent that missed a change-of-control clause in a £300 million takeover.": ["x2.2", "The best-known case was at a big law firm in the City of London in 2032. An agent missed a change-of-control clause in a £300 million takeover."], "Fashion, rather than capability alone, drove at least part of the retreat from graduate recruitment.": ["x2.3", "Firms stopped hiring graduates at least partly because it was fashionable, not only because of what the agents could do."], "Our review shows that our agents now deliver partner-quality first drafts at a fraction of the old cost, and our clients would not go back.": ["x3.1", "Our review shows that our agents now produce first drafts as good as a partner's, for a small part of the old cost. Our clients would not go back."], "Our twelve-week accredited course prepares them for “agent supervisor” roles, and tens of thousands of AI-related roles already exist.": ["x3.3", "Our accredited course lasts twelve weeks and prepares graduates for “agent supervisor” jobs. Tens of thousands of AI-related jobs already exist."], "A quota or a levy would slow adoption and cost Britain its lead.": ["x3.4", "A quota or a levy would slow down the use of agents, and Britain would lose its lead."], "The company would pay a large share of either a levy or a quota, and it sells the twelve-week course.": ["x3.5", "The company would pay a large part of either a levy or a quota. It also sells the twelve-week course."], "The case for helping graduates does not depend on whether they deserve it more than miners did.": ["x4.1", "The reason to help graduates is not about whether they deserve it more than the miners did."], "It depends on who will check the agents' work in ten years' time.": ["x4.2", "The reason is this: who will check the agents' work in ten years?"], "If no one is trained now, the shortage of experienced solicitors, auditors and analysts will fall on everyone who needs a will checked, a company audited or a policy tested.": ["x4.3", "If nobody is trained now, there will not be enough experienced solicitors, auditors and analysts. This will hurt everyone who needs someone to check a will, audit a company or test a policy."], "Training them is not charity; it is maintenance of public infrastructure.": ["x4.4", "Training them is not charity. It is looking after something the whole public needs."], "Calling Plan 5 loans debt is misleading.": ["x5.1", "It is misleading to call Plan 5 loans debt."], "Graduates in England who started university from 2023 repay 9 per cent of their income above a threshold (£25,000 when the plan began), and any balance left after forty years is written off.": ["x5.2", "Graduates in England who started university in 2023 or later pay back 9 per cent of the income they earn above a set level. That level was £25,000 when the plan began. After forty years, any money still owed is cancelled."], "A graduate who never earns above the threshold repays nothing: the loan works like a tax on graduates who do well, so those hit hardest by automation will repay least.": ["x5.3", "If a graduate never earns more than that level, they pay nothing back. So the loan works like a tax on graduates who earn well, and the people who lose most from automation will pay back the least."], "Over five decades, job losses among professional and office workers received about three times as much newspaper coverage per job lost as losses in manufacturing and mining.": ["x6.1", "Over fifty years, newspapers wrote about three times as much about each lost job among professional and office workers as about each lost job in factories and mines."], "The former were usually described as inevitable, the latter as a crisis.": ["x6.2", "Newspapers usually said the office job losses could not be stopped, but they called the factory and mining losses a crisis."], "Public sympathy follows the social distance between those who lose their jobs and those who write about them.": ["x6.3", "How sorry the public feels depends on how close, socially, the people losing jobs are to the people writing about them."], "A Manchester law firm kept taking twenty trainees a year after 2030.": ["x7.1", "One law firm in Manchester kept taking twenty trainees a year after 2030."], "Its trainees no longer write first drafts: they check and correct the agents' work and discuss every correction with a partner, who spends about four hours a week with each trainee.": ["x7.2", "Its trainees do not write first drafts any more. They check and correct the agents' work and talk about every correction with a partner. The partner spends about four hours a week with each trainee."], "The partners report that trainees now reach the standard of a second-year associate more quickly than before.": ["x7.3", "The partners say trainees now reach the level of a second-year associate faster than before."], "One firm, and the partners' own judgement: no formal comparison with earlier trainees.": ["x7.4", "This is only one firm, and only the partners' own opinion: there is no formal comparison with earlier trainees."], "The apprenticeship levy, introduced in April 2017, was meant to increase training by making large employers pay for it.": ["x8.1", "The apprenticeship levy started in April 2017. Its aim was more training: large employers had to pay for it."], "Instead, apprenticeship starts in England fell by about a quarter in the first year, and much of the money was spent relabelling existing training.": ["x8.2", "But in the first year, the number of new apprentices in England fell by about a quarter. Much of the money was spent on giving existing training a new name."], "Rules that force firms to train tend to produce the appearance of training: firms comply, but they do not necessarily teach, and large firms are skilled at reorganising themselves around a threshold.": ["x8.3", "When rules force firms to train people, the result often only looks like training. Firms follow the rules, but they do not always teach. And large firms are good at changing their structure to stay under a limit."], "Firms didn't stop hiring because the machines are brilliant.": ["w1.1", "Firms didn't stop hiring because the machines are amazing."], "They stopped because their rivals did, and because the savings looked good.": ["w1.2", "They stopped because other firms did, and because the money they saved looked good."], "Look at the takeover case: three hundred million pounds, and the agent missed a change-of-control clause.": ["w1.3", "Think about the takeover case. It was worth three hundred million pounds, and the agent missed a change-of-control clause."], "Fast and cheap is not the same as good.": ["w1.4", "Fast and cheap does not mean good."], "Give it a few years, and the firms will be hiring again.": ["w1.5", "Wait a few years, and the firms will start hiring again."], "Make it law that a qualified professional signs off every piece of agent work.": ["w1.6", "There should be a law that a qualified professional must approve every piece of agent work."], "Our member firms are ready to provide that service, at a fair price.": ["w1.7", "Our member firms are ready t
