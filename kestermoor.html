<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Kestermoor Energy: The Listing Decision (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>

/* charts: horizontal bars and a simple line chart */
function hbars(rows,label){
  const W=500,left=200,right=80,rowH=30,top=4,H=top+rows.length*rowH+4,w=W-left-right,max=Math.max(...rows.map(r=>r.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  rows.forEach((r,i)=>{const y=top+i*rowH,bw=Math.max(2,w*r.v/max);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="sa" x="${left}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="2"/><text class="val" x="${left+bw+6}" y="${y+18}">${r.t}</text>`;});
  return s+"</svg>";
}
function lineChart(pts,label,ylo,yhi,marks,xl){
  const W=500,H=190,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,x0=pts[0][0],x1=pts[pts.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  pts.forEach(([x])=>{if(x%2===0)s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${x}</text>`;});
  s+=`<text x="${l+w/2}" y="${H-2}" text-anchor="middle">${xl}</text>`;
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;
  return s+"</svg>";
}

const EXPERTS={
 ecm:{name:"Independent IPO adviser",who:"an IPO advisory firm that works for companies, not banks",what:"Can tell you how an order book really behaves in the final week.",
  rep:`<p>Banks are paid a share of what is raised, so they start at the top of the range. In a nervous market, soft indications shrink in the final week, and the gap is filled by short-term funds that sell in the first days of trading.</p>
   <p>Nearly a third of European renewable-energy listings in the last two years traded below their offer price within a month. The ones that held up were covered by binding orders before launch, usually at a price a little below what the company had hoped for.</p>`},
 infra:{name:"Grid and infrastructure analyst",who:"an energy research firm in Lisbon",what:"Tracks grid connections in the Benelux and Iberia. Can tell you how much delay investors build into a developer's forecasts.",
  rep:`<p>Grid connections in the Benelux and Iberia are slower than at any time in the last decade. About six in ten battery-storage connections there since 2023 came in late, by about seven months on average. Developers blame the operators; the operators blame the queue. Both are partly right.</p>
   <p>Most infrastructure investors now cut a developer's revenue forecasts by 15–25% for delays, whatever the prospectus says.</p>
   <p>Forecasts that already assume delays tend to be believed. Forecasts that assume everything connects on time tend to be marked down, often in the first month of trading.</p>`},
 lender:{name:"Debt and refinancing adviser",who:"a debt advisory firm for energy developers",what:"Can tell you what happens to a bridge loan when a listing runs late.",
  rep:`<p>A bridge loan can be extended, but usually only against signed equity commitments, for a fee of 1–2% and a higher interest margin. A full private refinancing takes six to eight weeks, so if a listing fails in week six, it's too late to refinance cheaply before week nine.</p>
   <p>If the book is covered by signed orders before launch, an extension is usually a formality. If it rests on soft indications, lenders ask for security over the projects, and that can hold up construction for months.</p>`},
 gov:{name:"Governance and stewardship adviser",who:"a firm that advises pension funds and insurers on how they vote",what:"Can tell you how long-term investors see founder control.",
  rep:`<p>Only about one European listing in eight last year used dual-class shares, almost all of them in technology. In infrastructure, pension funds and insurers usually vote against them, or ask for a lower price. A sunset clause helps with some investors, but most index providers exclude a company until the extra votes have actually ended.</p>
   <p>Founders who give up extra votes usually protect their plan in other ways: the build plan and the use of the money written into the prospectus, a strategy committee they chair, and a board that has publicly backed the plan.</p>`},
 retail:{name:"Retail offer specialist",who:"formerly head of retail offers at a Benelux bank",what:"Can tell you how big a retail tranche can safely be.",
  rep:`<p>Size a retail tranche to firm demand, not to sign-ups: in recent Dutch listings, usually 5–15% of the offer. Retail orders come in during the last two or three days, and unsold retail shares go to institutions only if they want more. In a nervous week they often don't.</p>
   <p>Companies that want small shareholders but can't risk the money often give pre-registered investors priority in a later offer, or a small guaranteed allocation, rather than a large tranche now.</p>`},
 pr:{name:"Financial communications consultant",who:"a financial PR agency",what:"Can tell you which stories follow a company after listing day.",
  rep:`<p>Three stories follow a new listing: the founder, the first-week share price, and anything the company didn't say first. A founder who keeps extra votes is asked about them in every interview, and the answer becomes the headline.</p>

    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf" data-act="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${x.ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(x.block)}</textarea>
    <p><button type="button" class="btn" id="copy" data-act="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;}
function handinHTML(){
 return `<div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and your group's choices would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${S.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>
    <div id="issues" class="issues">${(S.issues||[]).map(m=>`<p>${esc(m)}</p>`).join("")}</div>
    <button type="button" class="btn" data-act="hand">Create my submission</button>
    <div id="out">${subHTML()}</div>`;
}
function downloadPdf(){
 const x=S.sub; if(!x) return;
 const W=roleW(x.r), rr=LITE.roles[x.r];
 const cap=taskName(W).charAt(0).toUpperCase()+taskName(W).slice(1);
 const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
 const blob=makePdf({
  title: cap,
  subtitle: `${LITE.title} · Role ${x.r}${rr.dept?" ("+rr.dept+")":""} · ${x.n} words · ${today}`,
  body: x.memo,
  note: (x.ai==="yes"
   ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
   : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
   + ` Check code: ${x.code}.`,
  footer: `SimLearn · ${LITE.title}`,
  block: x.blockOnly, fileName: "simlearn-submission.txt"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob); a.download=`simlearn-${LITE.id}-role-${x.r}.pdf`;
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),120000);
 const m=document.getElementById("pdfmsg"); if(m) m.textContent="Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
}
async function copyBlock(){
 const ta=document.getElementById("block"), msg=document.getElementById("copied"); if(!ta) return;
 const done=()=>{msg.textContent="Copied — now paste it into Moodle.";};
 try{await navigator.clipboard.writeText(ta.value); return done();}catch(e){}
 // older method: still works in many embedded frames where the modern one is blocked
 ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
 let ok=false; try{ok=document.execCommand("copy");}catch(e){}
 if(ok) return done();
 msg.textContent="Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
}

// a recorded clip's text appears once the student has listened to the end (GUIDE 2h); media events don't bubble
document.addEventListener("ended",e=>{const a=e.target; if(!a||a.tagName!=="AUDIO"||!a.dataset.f)return;
 S.heard=Object.assign({},S.heard,{[a.dataset.f]:1}); const box=a.closest(".audio"), dt=box&&box.querySelector("details"); if(dt)dt.hidden=false; save();},true);

document.addEventListener("change",e=>{if(e.target.id==="consent"){S.consent=e.target.checked;S.sub=null;S.issues=[];render();}});
document.addEventListener("input",e=>{if(e.target.id!=="cf")return; if(S.sub){S.sub=null;const o=document.getElementById("out");if(o)o.innerHTML="";} save();});

function whoAvatar(p){
 const n=p.name.replace(/^(Dr|Prof|Professor|Sir|Dame)\.?\s+/,"").split(/\s+/), ini=(n[0][0]+(n.length>1?n[n.length-1][0]:"")).toUpperCase();
 let h=7; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
 return `<span class="av" style="background:${WHO_AVC[h%WHO_AVC.length]}" aria-hidden="true">${esc(ini)}${PRO_PHOTOS[p.id]?`<img src="${PRO_PHOTOS[p.id]}" alt="" onerror="this.remove()">`:""}</span>`;}
function whoPerson(p,r){

 in during the last two or three days, and unsold retail shares go to institutions only if they want more.": ["x5.2", "Orders from the public come in during the last two or three days. Public shares that nobody buys go to institutions only if they want more."], "In a nervous week they often don't.": ["x5.3", "In a nervous week, they often don't."], "Companies that want small shareholders but can't risk the money often give pre-registered investors priority in a later offer, or a small guaranteed allocation, rather than a large tranche now.": ["x5.4", "Some companies want small shareholders but can't risk the money. They often give people who signed up first place in a later sale, or a small number of shares for sure, instead of a large public share now."], "Three stories follow a new listing: the founder, the first-week share price, and anything the company didn't say first.": ["x6.1", "After a new listing, there are three stories: the founder, the share price in the first week, and anything the company didn't say first."], "A founder who keeps extra votes is asked about them in every interview, and the answer becomes the headline.": ["x6.2", "If a founder keeps extra votes, every interview asks about them, and the answer becomes the headline."], "A first-week fall is a story for a day among professionals, and for months among the small investors who bought in.": ["x6.3", "If the share price falls in the first week, professionals talk about it for a day, but small investors who bought shares talk about it for months."], "Bad news you publish yourself is a paragraph; bad news a journalist finds is a week.": ["x6.4", "If you publish bad news yourself, it gets one paragraph; if a journalist finds it, it's news for a week."], "I know a strong book when I see one, and this is a strong book.": ["w1.2", "I know when there are strong orders, and these orders are strong."], "The anchors love the story, the retail interest is extraordinary, and the market wants renewable infrastructure.": ["w1.3", "The anchors really like the story, the public is very interested, and the market wants renewable infrastructure."], "My advice is simple: price at the top of the range.": ["w1.4", "My advice is simple: set the price at the top of the range."], "Kestermoor needs the money, and leaving it on the table would be a mistake.": ["w1.5", "Kestermoor needs the money, and it would be a mistake not to take it."], "Honestly, this deal will be fine.": ["w1.7", "Honestly, this deal will be OK."], "Er… at the top?": ["w1.8", "[pause] At the top of the range?"], "They'll give us indications.": ["w1.9", "They'll tell us what they might buy."], "Firm orders come when they see the rest of the book.": ["w1.10", "Firm orders come when they see the other orders."], "A percentage of what's raised: two and a quarter per cent, plus a bonus of half a per cent if we price at the top.": ["w1.12", "A part of what is raised: two and a quarter per cent, and an extra half a per cent if we set the price at the top."], "Er… but our advice has nothing to do with our fee.": ["w1.13", "[pause] But our advice has nothing to do with how much we're paid."], "Seven in Europe, three of them in energy.": ["w1.14", "Seven in Europe, and three of them in energy."], "Two in Amsterdam, one in Oslo, and the rest in Frankfurt and Paris.": ["w1.15", "Two in Amsterdam, one in Oslo, and the others in Frankfurt and Paris."], "Every one of them was fully covered.": ["w1.16", "All of them had enough orders for every share."], "Our cooperative is two kilometres from your Évora site.": ["w2.1", "Our cooperative is two kilometres from your site in Évora."], "We have four hundred members: farmers, teachers, a few retired people like me.": ["w2.2", "We have four hundred members: farmers, teachers and a few retired people like me."], "Two or three thousand euros each, maybe.": ["w2.5", "Maybe two or three thousand euros each."], "But we have also seen companies come here, make promises and leave.": ["w s second, so I've asked Tomasz to keep a close eye on their orders as well.": ["b5.1", "You've put the anchors second, so I've also asked Tomasz to watch their orders closely."], "I've commissioned a survey of the pre-registered investors, so we know how they would react: €25,000 from the listing budget.": ["b6.2", "I've ordered a survey of the people who signed up, so we know how they would react. It costs €25,000 from the listing budget."], "The survey is in.": ["b7.1", "The survey results have arrived."], "Most of our pre-registered investors would be disappointed to get no shares, but most would buy on the market later if the price was fair.": ["b7.2", "Most people who signed up would be disappointed to get no shares, but most would buy on the market later if the price was fair."], "What they fear most is buying high and watching the price fall.": ["b7.3", "What they are most afraid of is buying at a high price and then seeing the price fall."], "€25,000 to learn what my team hears on the phone every day.": ["b7.4", "We paid €25,000 to learn what my team hears on the phone every day."], "Agreed: we mustn't sell ourselves short.": ["b8.1", "I agree: we mustn't ask for too little."], "I've asked the bank for an extra valuation report to support the top of the range: €60,000 from the listing budget.": ["b8.2", "I've asked the bank for an extra report on the company's value to support the top of the range. It costs €60,000 from the listing budget."], "The bank's report is in.": ["b9.1", "The bank's report has arrived."], "It says the range is fair.": ["b9.2", "It says the price range is fair."], "It also assumes, like the bank's first model, that all four new sites connect on time, so it supports the top of the range by assuming away the risk investors care about most.": ["b9.3", "But, like the bank's first model, it assumes that all four new sites connect on time. So it supports the top of the range by ignoring the risk investors care about most."], "€60,000, and nothing I can put in front of an investor.": ["b9.4", "We paid €60,000, and I can't show any of it to an investor."], "Daan can be stubborn, I know.": ["b10.1", "I know Daan can be stubborn."], "I've hired a governance mediator to work with him and the board this week: €30,000 from the listing budget.": ["b10.2", "I've hired a governance mediator (someone who helps people agree) to work with him and the board this week. It costs €30,000 from the listing budget."], "Her report: he isn't attached to the extra votes for their own sake.": ["b11.2", "Her report says he doesn't want the extra votes just for themselves."], "What he wants protected is the build plan: the four sites, the timetable and the €120 million.": ["b11.3", "What he wants to protect is the building plan: the four sites, the timetable and the €120 million."], "Anyone who had sat in a board meeting with him could have told her that.": ["b11.4", "Anyone who had been in a board meeting with him could have told her that."], "Sofia's draft offer structure goes to the banks on Thursday, and she wants the facts behind the price checked with the whole team first.": ["p1.2", "Sofia's first plan for the share sale goes to the banks on Thursday. Before that, she wants to check the facts behind the price with the whole team."], "New shares: 10 million, in an indicative range of €21 to €23 a share.": ["p1.4", "New shares: 10 million, with a price range of €21 to €23 a share."], "Use of the money: repay the bridge loan; build the next battery-storage phase.": ["p1.5", "What the money is for: paying back the bridge loan, and building the next battery-storage phase."], "Institutional book: 70% of the offer.": ["p1.6", "Shares for large investors: 70% of the offer."], "Cornerstone orders, if any, signed before launch.": ["p1.7", "Cornerstone orders, if there are any, are signed before the sale starts."], "Retail tranche: 30% of the offer, as Eva proposed: €63 million at €21 a share, €69 million at €23.": ["p1.8", "Shares for the public: 30% of the offer, as Eva suggested. That is €63 million at €21 a share, or €69 million at €23."], "This puzzle helps with Decision 2: one share, one vote or two classes of shares.": ["p2.1", "This puzzle helps with Decision 2: one vote for every share, or two kinds of shares."], "Henrik Vos at the lead bank has sent Lucien a one-page pitch for Thursday's board meeting.": ["p2.2", "Henrik Vos at the main bank has sent Lucien a one-page sales pitch for Thursday's board meeting."], "Before Lucien forwards it, he wants three facts about the share structure checked with the whole team.": ["p2.3", "Before Lucien sends it on, he wants to check three facts about the shares and votes with the whole team."], "Claim 1: The sustainability index will include Kestermoor as soon as a sunset clause is agreed.": ["p2.4", "Claim 1: The sustainability index will take Kestermoor in as soon as an end date for the extra votes (a sunset clause) is agreed."], "Claim 2: Unequal voting rights won't cost Kestermoor a single buyer.": ["p2.5", "Claim 2: Unequal voting rights won't lose Kestermoor even one buyer."], "Daan's office has sent Mireille the financing milestones in the four grid contracts, and she has to tell the grid operators where the money will come from.": ["p3.2", "Daan's office has sent Mireille the dates for the money in the four grid contracts. She has to tell the grid companies where the money will come from."], "Kestermoor must show committed funding for each site by its milestone.": ["p3.4", "For each site, Kestermoor must show by its date that the money is promised."]};   // sentence as the page shows it -> [id, plain-English version]
