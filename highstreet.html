<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Highstreet Inquiry (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>
  <h1>The Highstreet Inquiry</h1>

function audio(t,voice,script,file){if(file&&PRO_AUDIO.includes(file))return `<div class="audio rec"><div style="flex:1;min-width:0"><div class="t">${t}</div><audio controls preload="none" data-f="${file}" src="audio/${file}.mp3" style="width:100%;margin-top:6px"></audio></div><details data-tf="${file}" ${(S.heard||{})[file]?"":"hidden"} ${(S.tOpen||{})[file]?"open":""}><summary>Show the text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;
 return `<div class="audio"><button class="play" disabled aria-label="Play (recording to come)">▶</button><div><div class="t">${t}</div><div class="s">Recording to come: read the text</div></div><details open><summary>The text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;}
function mail(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k];
 return `<details class="mail ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="from">${whoMailAv(m.from)}${r?"":`<span class="udot" aria-label="Unread"></span>`}<span class="lbl">From:</span> ${m.from}</span><span class="subj">${m.subj}</span></summary><div class="body" data-src="${m.from.split(",")[0]}" data-q="${m.rel}">${m.body}</div></details>`;}
function att(name,html){return `<div class="attach"><div class="an">📎 ${name}</div>${html}</div>`;}

const INBOX={
 A:[
  {from:"Naomi Blackwood, Story Editor, Beacon Pictures",subj:"The memo nobody wants to talk about",rel:"high",body:`
   <p>Six weeks before release, I sent marketing leadership a memo about our test-screening comment cards. Forty-one per cent of the audience used words like “confusing” or “not what I expected” when they compared the trailer with the film. That's not a normal number for us, and our “definite recommend” score was only 58 per cent.</p>
   <p>My memo said it in writing: the film is a pointed story about debt and who gets to own a home, and the marketing was selling something much lighter. The cards didn't say the film was bad: many praised the writing and the family's story. What people disliked was the surprise.</p>
   <p>What I don't know is whether anyone else in the building saw the same risk before release.</p>
   ${att("Three of the test-screening comment cards",`<p>“Great writing. But the trailer made it look like a party game.”</p><p>“Not what I expected. My two kids were confused.”</p><p>“Moving. I had no idea it would be about losing a home.”</p>`)}
   <p class="sig">Naomi</p>`},
  {from:"Kwame Osei, Trailer Editor, Beacon Pictures",subj:"How many versions of that trailer did you see?",rel:"high",body:`
   <p>I cut the teaser trailer four times. Each round, at marketing's request, I took out more of the film's central story, a family facing eviction, and added more comedy and board-game nostalgia. The trailer that shipped kept less than ten seconds of the eviction story in two and a half minutes. Only my second cut ever went in front of a test audience. The fourth, the one that shipped, was never tested.</p>
   <p>The director asked twice to keep the family's story in: after marketing's first round of notes, and again six weeks before release. Both times the studio said it was too late to change course.</p>
   <p>In fairness to marketing, the light version did very well online, with more views and shares than any Beacon trailer before it. They'd tell you the promise is theirs to make, because they carry the commercial risk.</p>
   ${att("My cutting-room log",`<div class="tw"><table><thead><tr><th>Cut</th><th>The family's story</th><th>Tested?</th></tr></thead><tbody>
    <tr><td>1</td><td>About 40 seconds</td><td>No</td></tr>
    <tr><td>2</td><td>About 25 seconds</td><td>Yes, with a test audience</td></tr>
    <tr><td>3</td><td>About 15 seconds</td><td>No</td></tr>
    <tr><td>4 (shipped)</td><td>Under 10 seconds</td><td>No</td></tr></tbody></table></div>`)}
   <p class="sig">Kwame</p>`}
 ],
 B:[
  {from:"Diego Ferraro, Exhibitor Relations, Silverline Cinemas",subj:"The exit-poll numbers, if you want the real picture",rel:"high",body:`
   <p>Here are the real opening-weekend numbers, not the trade headlines. Our pre-show surveys showed the audience was mainly families expecting light, nostalgic entertainment: that's who the marketing brought in. In our exit polls, that family group's “would recommend” score fell to about a third of our usual level for a wide family release. A smaller group of adults who usually watch more serious films gave it some of their best scores all year.</p>
   <p>By the Sunday, the clips people were sharing online were scenes of the family packing up their home, with captions like “they said this was a comedy”. Then the second weekend fell about 65 per cent. For a family film with an opening like that, we'd normally expect 35 to 40.</p>
   <p>What I can't tell from my side is whether that mismatch was predictable before release.</p>
   ${att("Silverline exit polls, opening weekend: “would recommend”",`<div class="tw"><table><thead><tr><th>Group</th><th class="num">Highstreet</th><th class="num">Our usual level</th></tr></thead><tbody>
    <tr><td>Families with children</td><td class="num">24%</td><td class="num">72%</td></tr>
    <tr><td>Adults who usually watch more serious films</td><td class="num">89%</td><td class="num">74%</td></tr></tbody></table></div>`)}
   <p class="sig">Diego</p>`},
  {from:"Idris Bakare, Film Critic, The Weekly Reel",subj:"What critics actually said, versus what got repeated",rel:"medium",body:`
   <p>Critics were positive about the writing and the film's message, and several reviews praised how it handled the housing story. But an unusual number of reviews, written independently, used some version of the same phrase: “the marketing sold a different movie.”</p>
   <p>Ordinary filmgoers' reviews were harshest about feeling misled by the campaign, far more than about the film itself. Several people wrote that they had taken their children because the trailer looked like a family comedy, and left halfway through. That's a reaction to a broken promise, not a bad film, and it spreads by word of mouth.</p>
   <p>What I don't know is whether anyone inside the studio said the same thing before release.</p>
   <p class="sig">Idris</p>`}
 ],
 C:[
  {from:"Julia Grant, Head of Global Marketing, Beacon Pictures",subj:"I made that call, and I'd want you to understand why",rel:"medium",body:`
   <p>I read Naomi Blackwood's memo before release, including her figure of 41 per cent, and I decided not to change course. We had followed the same light, nostalgic playbook as last year's big toy adaptation, which became one of the biggest cultural moments the industry had seen in years.</p>
   <p>By the time the memo landed, our partners had built stock and displays for over two thousand shops around that lighter tone, and I understood their contracts to mean penalties for any major change so close to release. The board treated a change as off the table. The director raised the tone with me as well, and I gave the same answer: it was too late. And remember Halbrook: we once spent millions reacting to a few test comments, for nothing.</p>
   <p>I made a defensible decision with the information I had. What I haven't seen is the cinemas' exit-poll data, broken down by audience.</p>
   <p class="sig">Julia</p>`},
  {from:"Malik Harlan, Head of Communications, Beacon Pictures",subj:"The gap between what we said and what we knew",rel:"high",body:`
   <p>In public, our messaging expressed full confidence throughout the campaign, and we never mentioned internal concerns. That's fairly standard. But about a month before release, my own team wrote an internal risk memo that rated “audience expectation mismatch” as a moderate-to-high risk. That memo stayed in my department: risk memos go to the department head, there's no rule for when one must go higher, and it was never passed on to the wider leadership group.</p>
   <p>Within 48 hours of release, my press office was answering questions about clips of the eviction scenes that had spread online without any context.</p>
   <p>What I don't know is whether the trailer that shipped was the version the studio originally tested.</p>

    <p>Beacon Pictures spent eighteen months building the marketing campaign for Highstreet, a big-budget film based on a much-loved property-trading board game. The playbook was almost identical to last year's surprise blockbuster toy adaptation: an online content tool, dozens of brand collaborations, a bold colour identity and a release date set directly against a rival blockbuster, Stormbreak. Every box was ticked. Then the film opened to a soft weekend, word of mouth never built, and by the second week it had almost vanished from conversation.</p>
    <p>In film marketing, the campaign is a promise. The trailer, the key art (the main poster image) and the brand tie-ins all tell audiences what kind of film to expect. Before release, studios hold test screenings, where a recruited audience watches the film and fills in comment cards; many studios treat the share who would “definitely recommend” it as the key score. After release, cinemas run exit polls, and the drop in ticket sales from the first weekend to the second shows how strong word of mouth is.</p>
    <p>Two old stories shape how Beacon's leaders think about warnings. Two years ago, Beacon pulled and reshot a campaign after a handful of negative test-screening comments, at a cost of several million dollars, and the original version, quietly tested afterwards, would have done just as well: the Halbrook False Alarm. On an earlier release, though, a mid-level story editor raised concerns early, leadership delayed the trailer by three weeks to recut it, and the film modestly outperformed expectations: the Sentinel Save.</p>
    <div class="facts"><div class="fact"><div class="l">Campaign</div><div class="v">18 months</div></div><div class="fact"><div class="l">Opening weekend</div><div class="v">Soft, against Stormbreak</div></div><div class="fact"><div class="l">Second weekend</div><div class="v">Almost gone</div></div><div class="fact"><div class="l">Next adaptation</div><div class="v">Marble Run</div></div></div></section>`

    <p>Theories inside the building already conflict. Some blame bad luck and a crowded release calendar. Others think something went wrong between what the marketing promised and what audiences found in the cinema. Beacon's next adaptation, Marble Run, based on a children's toy, begins its marketing planning in exactly one week, and fourteen brand partners are waiting for its brief.</p>
    <p>The board wants your root-cause report before that kick-off meeting, not after it. It must give three findings: the main cause of Highstreet's collapse, whether there was a clear early warning, and who should have final say over whether a campaign's tone matches its film.</p></section>`

    ${audio("Voicemail from Renata Cole","female, Dublin accent, calm and decisive",`<p class="sd">[An office. Phones ring in the background.]</p><p>Hello, it's Renata Cole. Thanks for taking this on at such short notice. Half the building says Highstreet was bad luck: Stormbreak opened the same weekend, and that was that. The other half says the trailer sold a different film.</p><p>I need to know which before Thursday, because Marble Run's marketing starts the week after, and fourteen partners are waiting for our brief. I'm not looking for someone to blame. I want to understand what happened, so it doesn't happen twice.</p><p>Oh, and one thing can't wait. Malik wants to know today whether we ask the fans what went wrong, in public. Talk to each other and let me know this afternoon.</p>`,"highstreetpro_voicemail")}</section>`

  h+=`<section class="card"><h2>${roleW(S.role).section?"Your section: "+esc(roleW(S.role).section.label):"Root cause report"}</h2>${roleW(S.role).section?`<p>About ${roleW(S.role).words} words. ${esc(roleW(S.role).section.task)}</p>`:`<p>Write 120–180 words for Renata: your three findings, the evidence that convinced you (name the person or document, and use the numbers and dates), and the strongest argument against your findings, with your answer to it.</p>`}
   <p class="muted small">Useful language: <em>The main cause was…</em> · <em>According to…</em> · <em>Although the decision was understandable at the time, …</em> · <em>In future, … should …</em></p>
   <textarea id="cf" aria-label="${roleW(S.role).label}"></textarea>
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="wc" id="wc">0 words</span></div>${handinHTML()}</section>`;

   <p><strong>Six months on, Beacon is ${netWords()} on Highstreet and Marble Run.</strong></p>
   <details><summary class="small" style="cursor:pointer;color:var(--blue);font-weight:600">How that adds up</summary><div class="tw"><table class="sums"><thead><tr><th>What happened</th><th>Paid from / effect</th><th class="num">Amount</th></tr></thead><tbody>${ledger().map(([l,src,v])=>`<tr><td>${l}</td><td class="muted">${src}</td><td class="num">${v>0?"+":""}${fmt(v)}</td></tr>`).join("")}<tr class="tot"><td>Against plan</td><td></td><td class="num">${net()>0?"+":""}${fmt(net())}</td></tr></tbody></table></div></details>
   <p>Now find a group that made the other choice at the start, and ask them what happened to them.</p></section>`;
  return h;

  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

/* ---------- Pro hand-in ---------- */
function proChoices(r){
 const c=LITE.roles[r].chars, sl=SHORTLIST[r]||[], out=[];
 out.push(`${c.expert}=${S.expert&&sl.includes(S.expert)?"o"+(sl.indexOf(S.expert)+1):"-"}`);
 Object.keys(WIT).forEach(w=>{const p=S.picks[w]; out.push(`${c[w]}=${p===null||p===undefined?"-":"o"+(p+1)}`);});
 return out.join(", ");
}
// The Pro line: the team's fork, interim briefing (Morven/Moira acts on the first) and puzzle tiers (no evidence= since
// the evidence step was removed, 9 Nov 2026). Not part of the check code (blocks.py reads it into sub["pro"]).
function proLine(){
 return `Pro: fork=${S.fork||"none"}, briefing=${S.ranked?S.rank.slice(0,3).join(">"):"none"}, puzzles=${[1,2,3].map(n=>`${n}:${S.pz[n].tier||"none"}`).join(",")}`;
}
// writing.by_role (GUIDE 3c): the student's role writes its own section of the group's report
function roleW(r){const W=LITE.writing, t=W.by_role&&W.by_role[r];
 return t?Object.assign({},W,{label:t.label||W.label,words:t.words,section:t}):W;}
function makeSub(){
 const r=S.role, W=roleW(r), missing=[];
 S.sub=null;
 if(!r||!LITE.roles[r]){S.issues=["Choose your role first (Context)."];return;}
 const memoText=(S.text||"").trim();
 const open=Object.entries(WIT).filter(([k])=>S.picks[k]===null||S.picks[k]===undefined).map(([,w])=>w.name);
 if(open.length) missing.push(`You haven't chosen what to ask ${open.join(", ")} yet (Investigate).`);
 const openDec=LITE.budget?(S.decided?[]:["budget"]):Object.keys(LITE.decisions).filter(k=>!S[k]);
 if(openDec.length) missing.push(LITE.budget?"Your group's budget isn't confirmed yet (Decide).":`Your group's answer is missing for ${openDec.map(k=>LITE.decisions[k]).join(", ")} (Decide).`);
 if(words(memoText)<50) missing.push("Your text is very short — write your "+W.label+" first.");
 S.issues=missing;
 if(openDec.length||words(memoText)<50) return;
 const ai=S.consent?"yes":"no";
 const choices=proChoices(r);
 const decisions=LITE.budget?LITE.budget.map(id=>`${id}=${+((S.budget||{})[id])||0}`).join(", ")   // Lite's budget format
                           :Object.entries(LITE.decisions).map(([k,id])=>`${id}=${S[k]}`).join(", ");
 const parts=[LITE.id, LITE.version, r, choices, decisions, ai, ai==="yes"?norm(memoText):""];
 const code=checkCode(parts);
 const head=[
  "=== SIMLEARN SUBMISSION ===",
  ai==="yes"?"AI check: ALLOWED":"AI check: NOT ALLOWED - grade by hand",
  `Scenario: ${LITE.id} v${LITE.version} (${LITE.title})`,
  `Role: ${r} (${LITE.roles[r].dept})`,
  `Info choices: ${choices}`,
  `Group decisions: ${decisions}`,
  proLine(),
  simpleLine(),
  `Check: ${code}`,
 ];
 const block=ai==="yes"?[...head,`--- ${taskName(W)} (${words(memoText)} words) ---`,memoText,"=== END ==="].join("\n")
                       :[...head,"=== END ===","",`My ${taskName(W)} (${words(memoText)} words):`,"",memoText].join("\n");
 S.sub={block, blockOnly: ai==="yes"?block:[...head,"=== END ==="].join("\n"), code, ai, r, n:words(memoText), memo:memoText};
 S.handed=true;
}
function subHTML(){const x=S.sub; if(!x) return "";
 return `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf" data-act="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${x.ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(x.block)}</textarea>
    <p><button type="button" class="btn" id="copy" data-act="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;}
function handinHTML(){
 return `<div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and your group's choices would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${S.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>
    <div id="issues" class="issues">${(S.issues||[]).map(m=>`<p>${esc(m)}</p>`).join("")}</div>
    <button type="button" class="btn" data-act="hand">Create my submission</button>
    <div id="out">${subHTML()}</div>`;
}
function downloadPdf(){
 const x=S.sub; if(!x) return;
 const W=roleW(x.r), rr=LITE.roles[x.r];
 const cap=taskName(W).charAt(0).toUpperCase()+taskName(W).slice(1);
 const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
 const blob=makePdf({
  title: cap,
  subtitle: `${LITE.title} · Role ${x.r}${rr.dept?" ("+rr.dept+")":""} · ${x.n} words · ${today}`,
  body: x.memo,
  note: (x.ai==="yes"
   ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
   : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
   + ` Check code: ${x.code}.`,
  footer: `SimLearn · ${LITE.title}`,
  block: x.blockOnly, fileName: "simlearn-submission.txt"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob); a.download=`simlearn-${LITE.id}-role-${x.r}.pdf`;
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),120000);
 const m=document.getElementById("pdfmsg"); if(m) m.textContent="Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
}
async function copyBlock(){
 const ta=document.getElementById("block"), msg=document.getElementById("copied"); if(!ta) return;
 const done=()=>{msg.textContent="Copied — now paste it into Moodle.";};
 try{await navigator.clipboard.writeText(ta.value); return done();}catch(e){}
 // older method: still works in many embedded frames where the modern one is blocked
 ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
 let ok=false; try{ok=document.execCommand("copy");}catch(e){}
 if(ok) return done();
 msg.textContent="Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
}

const SIMPLE={"Beacon Pictures spent eighteen months building the marketing campaign for Highstreet, a big-budget film based on a much-loved property-trading board game.": ["c.1", "Beacon Pictures worked for eighteen months on the advertising for Highstreet. Highstreet is an expensive film. It is based on a popular board game about buying and selling houses."], "The playbook was almost identical to last year's surprise blockbuster toy adaptation: an online content tool, dozens of brand collaborations, a bold colour identity and a release date set directly against a rival blockbuster, Stormbreak.": ["c.2", "Beacon used almost the same plan as last year's surprise hit film about a toy. The plan had an online tool, lots of deals with other brands, strong colours, and a release date on the same day as another big film, Stormbreak."], "Every box was ticked.": ["c.3", "Beacon did everything on the list."], "Then the film opened to a soft weekend, word of mouth never built, and by the second week it had almost vanished from conversation.": ["c.4", "But not many people went to see the film on the first weekend. People did not tell their friends about it. By the second week, almost nobody was talking about it."], "In film marketing, the campaign is a promise.": ["c.5", "When you advertise a film, you make a promise to the audience."], "The trailer, the key art (the main poster image) and the brand tie-ins all tell audiences what kind of film to expect.": ["c.6", "The trailer, the main poster and the products made with other brands all show people what kind of film it is."], "Before release, studios hold test screenings, where a recruited audience watches the film and fills in comment cards; many studios treat the share who would “definitely recommend” it as the key score.": ["c.7", "Before a film comes out, studios show it to a test audience. These people fill in cards with their comments. For many studios, the most important number is how many people would “definitely recommend” the film."], "After release, cinemas run exit polls, and the drop in ticket sales from the first weekend to the second shows how strong word of mouth is.": ["c.8", "After a film comes out, cinemas ask people questions as they leave. If ticket sales fall a lot from the first weekend to the second, it shows what people are telling their friends."], "Two old stories shape how Beacon's leaders think about warnings.": ["c.9", "Two stories from the past affect how Beacon's bosses think about warnings."], "Two years ago, Beacon pulled and reshot a campaign after a handful of negative test-screening comments, at a cost of several million dollars, and the original version, quietly tested afterwards, would have done just as well: the Halbrook False Alarm.": ["c.10", "Two years ago, a few test viewers said bad things, so Beacon stopped a campaign and made it again. This cost several million dollars. Later, Beacon tested the first version quietly, and it would have done just as well. This is called the Halbrook False Alarm."], "On an earlier release, though, a mid-level story editor raised concerns early, leadership delayed the trailer by three weeks to recut it, and the film modestly outperformed expectations: the Sentinel Save.": ["c.11", "On another film, a story editor warned early that something was wrong. The bosses waited three weeks and changed the trailer. The film then did a little better than expected. This is called the Sentinel Save."], "The board has asked Vantage & Marsh, an outside creative-research consultancy with offices in London, to find out what happened before the studio uses the same playbook again.": ["c.12", "The board has asked Vantage & Marsh to find out what went wrong. Vantage & Marsh is a research company from outside Beacon, with offices in London. The board wants the answer before Beacon uses the same plan again."], "You look at the film itself and the trailer that sold it: how it was made, how it was cut and what test audiences said.": ["c.17", "You look at the film and at the trailer that advertised it: how they made it, how they edited it, and what test audiences said."], "Your inbox holds messages from Beacon's story department and its cutting room.": ["c.18", "You get emails from Beacon's story team and from the team that edits the films."], "Theories inside the building already conflict.": ["c.19", "People at Beacon already disagree about what happened."], "Some blame bad luck and a crowded release calendar.": ["c.20", "Some people say it was bad luck, because too many films came out at the same time."], "Others think something went wrong between what the marketing promised and what audiences found in the cinema.": ["c.21", "Other people think the advertising promised one thing, and the film in the cinema was something different."], "Beacon's next adaptation, Marble Run, based on a children's toy, begins its marketing planning in exactly one week, and fourteen brand partners are waiting for its brief.": ["c.22", "Beacon's next film is called Marble Run, and it is based on a children's toy. Its advertising plan starts in exactly one week. Fourteen partner brands are waiting for instructions."], "The board wants your root-cause report before that kick-off meeting, not after it.": ["c.23", "The board wants your report on the main cause before that first meeting, not after it."], "It must give three findings: the main cause of Highstreet's collapse, whether there was a clear early warning, and who should have final say over whether a campaign's tone matches its film.": ["c.24", "The report must answer three questions: what mainly made Highstreet fail, whether there was a clear warning early on, and who should decide if the advertising fits the film."], "Thanks for taking this on at such short notice.": ["c.26", "Thank you for doing this so quickly."], "Half the building says Highstreet was bad luck: Stormbreak opened the same weekend, and that was that.": ["c.27", "Half the people here say Highstreet just had bad luck: Stormbreak came out on the same weekend, and that was the end of it."], "The other half says the trailer sold a different film.": ["c.28", "The other half say the trailer showed a different film."], "I need to know which before Thursday, because Marble Run's marketing starts the week after, and fourteen partners are waiting for our brief.": ["c.29", "I need to know which is true before Thursday. The advertising for Marble Run starts the week after, and fourteen partners are waiting for our instructions."], "I'm not looking for someone to blame.": ["c.30", "I don't want to find someone to blame."], "I want to understand what happened, so it doesn't happen twice.": ["c.31", "I want to understand what happened, so that it doesn't happen again."], "Oh, and one thing can't wait.": ["c.32", "Oh, and one thing is urgent."], "Malik wants to know today whether we ask the fans what went wrong, in public.": ["c.33", "Malik wants to know today if we should ask the fans, in public, what went wrong."], "Talk to each other and let me know this afternoon.": ["c.34", "Talk about it together and tell me this afternoon."], "Beacon's fan team can post a survey for Highstreet's ticket-buyers and social media followers today.": ["c.35", "Beacon's fan team can put a survey online today for people who bought Highstreet tickets and people who follow Beacon on social media."], "It would bring in thousands of opinions quickly, and the press would see a studio that listens.": ["c.36", "It would get thousands of opinions fast, and journalists would see a studio that listens to people."], "Silverline Cinemas would rather Beacon stayed quiet: if the inquiry stays private, it will share its full screening-by-screening data in confidence.": ["c.37", "Silverline Cinemas would like Beacon to say nothing in public. If the inquiry stays private, Silverline will share all its data for every showing of the film, but only with Beacon."], "Agree as a team, then everyone enters the same choice.": ["c.39", "Agree on a choice as a team. Then all of you choose the same thing."], "You look at the audience: who bought tickets, how they reacted, and what critics and filmgoers said afterwards.": ["c.41", "You look at the audience: who bought tickets, how they felt about the film, and what critics and cinema-goers said later."], "Your inbox holds messages from a cinema chain and a film critic.": ["c.42", "You get emails from a group of cinemas and from a film critic."], "You look at the decisions: who saw which warnings, what leadership decided and what the studio said in public.": ["c.44", "You look at the decisions: who saw which warnings, what the bosses decided, and what the studio said in public."], "Your inbox holds messages from Beacon's heads of marketing and communications.": ["c.45", "You get emails from Beacon's head of marketing and head of communications."], "This is doing the rounds upstairs.": ["e1.1", "People in the top offices are passing this around."], "For what it's worth.": ["e1.2", "I'm sending it in case it is useful."], "“No family film survives opening against Stormbreak.": ["e1.3", "“No family film does well if it comes out at the same time as Stormbreak."], "Highstreet never stood a chance.": ["e1.4", "Highstreet never had a chance to succeed."], "Blame the calendar, not the campaign.”": ["e1.5", "The release date is the problem, not the advertising.”"], "(box-office blogger, 1.2 million followers, Monday)": ["e1.6", "(a blogger who writes about cinema ticket sales, with 1.2 million followers, Monday)"], "The post gives no figures beyond the opening weekend.": ["e1.7", "The post only has numbers for the first weekend."], "Six weeks before release, I sent marketing leadership a memo about our test-screening comment cards.": ["e2.1", "Six weeks before the film came out, I wrote a note to the marketing bosses about the comment cards from the test showings."], "Forty-one per cent of the audience used words like “confusing” or “not what I expected” when they compared the trailer with the film.": ["e2.2", "When people compared the trailer with the film, forty-one per cent of them used words like “confusing” or “not what I expected”."], "That's not a normal number for us, and our “definite recommend” score was only 58 per cent.": ["e2.3", "That number is not normal for us. Also, only 58 per cent said they would “definitely recommend” the film."], "My memo said it in writing: the film is a pointed story about debt and who gets to own a home, and the marketing was selling something much lighter.": ["e2.4", "My note said it clearly: the film is a serious story about money problems and about who can own a home, but the advertising made it look much more fun and light."], "The cards didn't say the film was bad: many praised the writing and the family's story.": ["e2.5", "The cards did not say the film was bad. Many people liked the writing and the family's story."], "What people disliked was the surprise.": ["e2.6", "What people didn't like was getting something they didn't expect."], "What I don't know is whether anyone else in the building saw the same risk before release.": ["e2.7", "I don't know if anyone else at the studio saw the same danger before the film came out."], "But the trailer made it look like a party game.”": ["e2.9", "But the trailer made it look like a fun game for a party.”"], "I had no idea it would be about losing a home.”": ["e2.13", "I didn't know it would be about a family losing their home.”"], "I cut the teaser trailer four times.": ["e3.1", "I edited the short first trailer four times."], "Each round, at marketing's request, I took out more of the film's central story, a family facing eviction, and added more comedy and board-game nostalgia.": ["e3.2", "Each time, marketing asked me to take out more of the main story, about a family who must leave their home. I added more jokes and more memories of the board game."], "The trailer that shipped kept less than ten seconds of the eviction story in two and a half minutes.": ["e3.3", "The final trailer was two and a half minutes long, but less than ten seconds of it showed the story about losing the home."], "Only my second cut ever went in front of a test audience.": ["e3.4", "A test audience only saw my second version."], "The fourth, the one that shipped, was never tested.": ["e3.5", "The fourth version, the one that went out, was never tested."], "The director asked twice to keep the family's story in: after marketing's first round of notes, and again six weeks before release.": ["e3.6", "The director asked two times to keep the family's story in the trailer: once after marketing's first comments, and again six weeks before the film came out."], "Both times the studio said it was too late to change course.": ["e3.7", "Both times, the studio said it was too late to change the plan."], "In fairness to marketing, the light version did very well online, with more views and shares than any Beacon trailer before it.": ["e3.8", "To be fair to marketing, the light, funny version was very popular online. More people watched and shared it than any Beacon trailer before."], "They'd tell you the promise is theirs to make, because they carry the commercial risk.": ["e3.9", "Marketing would tell you that they decide what the advertising promises, because they lose the money if it goes wrong."], "Here are the real opening-weekend numbers, not the trade headlines.": ["e4.1", "Here are the true numbers for the first weekend, not the ones in the industry news."], "Our pre-show surveys showed the audience was mainly families expecting light, nostalgic entertainment: that's who the marketing brought in.": ["e4.2", "Our surveys before the film showed that most of the audience were families who expected a light, fun film that reminded them of the past. The advertising brought these people in."], "In our exit polls, that family group's “would recommend” score fell to about a third of our usual level for a wide family release.": ["e4.3", "When these families left the cinema, the number who would recommend the film fell to about one third of our normal level for a big family film."], "A smaller group of adults who usually watch more serious films gave it some of their best scores all year.": ["e4.4", "A smaller group of adults, who usually watch more serious films, gave it some of their highest scores of the year."], "By the Sunday, the clips people were sharing online were scenes of the family packing up their home, with captions like “they said this was a comedy”.": ["e4.5", "By Sunday, people were sharing clips online of the family packing up their home, with comments like “they said this was a comedy”."], "Then the second weekend fell about 65 per cent.": ["e4.6", "Then, on the second weekend, ticket sales fell by about 65 per cent."], "For a family film with an opening like that, we'd normally expect 35 to 40.": ["e4.7", "For a family film that started like that, we would usually expect them to fall by 35 to 40 per cent."], "What I can't tell from my side is whether that mismatch was predictable before release.": ["e4.8", "From my side, I can't see if anyone could have known about this difference before the film came out."], "Critics were positive about the writing and the film's message, and several reviews praised how it handled the housing story.": ["e5.1", "Critics liked the writing and the film's message. Several reviews said it told the story about housing well."], "But an unusual number of reviews, written independently, used some version of the same phrase: “the marketing sold a different movie.”": ["e5.2", "But many reviewers, more than usual, said almost the same thing without talking to each other: “the marketing sold a different movie.”"], "Ordinary filmgoers' reviews were harshest about feeling misled by the campaign, far more than about the film itself.": ["e5.3", "Normal cinema-goers who wrote reviews were most angry that the advertising had tricked them. They were much less angry about the film itself."], "Several people wrote that they had taken their children because the trailer looked like a family comedy, and left halfway through.": ["e5.4", "Several people wrote that they took their children because the trailer looked like a family comedy, and then they left in the middle of the film."], "That's a reaction to a broken promise, not a bad film, and it spreads by word of mouth.": ["e5.5", "People are reacting to a promise that wasn't kept, not to a bad film. And people tell their friends about this."], "What I don't know is whether anyone inside the studio said the same thing before release.": ["e5.6", "I don't know if anyone at the studio said the same thing before the film came out."], "PS: Beacon's fan survey is all over the trade press: 14,200 replies in two days.": ["e6.1", "PS: Beacon's fan survey is in all the industry news: 14,200 people answered in two days."], "The top answer to “Why didn't Highstreet do better?”": ["e6.2", "The most popular answer to the question “Why didn't Highstreet do better?”"], "was “Too many big films at once” (44%), then “The trailer didn't match the film” (29%).": ["e6.3", "was “Too many big films at the same time” (44%). The second was “The trailer didn't match the film” (29%)."], "But most of the people who answered follow Beacon on social media, and about half never saw Highstreet.": ["e6.4", "But most of the people who answered follow Beacon on social media, and about half of them never saw Highstreet."], "Among the people who did see it, the trailer answer came top, at 52%.": ["e6.5", "Of the people who saw the film, the most popular answer was the one about the trailer, at 52%."], "Two trade papers wrote that Beacon is listening to its fans.": ["e6.6", "Two industry newspapers wrote that Beacon is listening to its fans."], "Here is our screening-level data, in confidence.": ["e7.2", "Here is our data for each showing. Please don't share it with anyone."], "In week two, our daytime screenings of Highstreet (before 6 pm, mostly families) fell 74%.": ["e7.3", "In the second week, ticket sales for our daytime showings of Highstreet fell by 74%. These showings were before 6 pm, and the audience was mostly families."], "Evening screenings, mostly adults, fell 41%.": ["e7.4", "Ticket sales for evening showings fell by 41%. The audience at these showings was mostly adults."], "Stormbreak's daytime screenings fell 38% over the same weekend.": ["e7.5", "Ticket sales for Stormbreak's daytime showings fell by 38% on the same weekend."], "On the first Saturday, our staff also logged families leaving before the end in about one in four family screenings.": ["e7.6", "On the first Saturday, our staff also wrote down that families left before the end in about one in four family showings."], "That's very unusual.": ["e7.7", "This almost never happens."], "In fairness, Stormbreak did take most of our largest screens on the opening weekend.": ["e7.8", "To be fair, Stormbreak did get most of our biggest cinema rooms on the first weekend."], "I read Naomi Blackwood's memo before release, including her figure of 41 per cent, and I decided not to change course.": ["e8.1", "I read Naomi Blackwood's note before the film came out. I saw her number of 41 per cent, and I decided not to change the plan."], "We had followed the same light, nostalgic playbook as last year's big toy adaptation, which became one of the biggest cultural moments the industry had seen in years.": ["e8.2", "We used the same light, fun plan as last year's big film about a toy. That film was one of the most talked-about films in years."], "By the time the memo landed, our partners had built stock and displays for over two thousand shops around that lighter tone, and I understood their contracts to mean penalties for any major change so close to release.": ["e8.3", "When the note arrived, our partners had already made products and displays for more than two thousand shops, all with the light style. I thought their contracts meant we would have to pay money if we made a big change so close to the release."], "The board treated a change as off the table.": ["e8.4", "The board did not think a change was possible."], "The director raised the tone with me as well, and I gave the same answer: it was too late.": ["e8.5", "The director also talked to me about the style of the advertising, and I said the same thing: it was too late."], "And remember Halbrook: we once spent millions reacting to a few test comments, for nothing.": ["e8.6", "And remember Halbrook: once we spent millions because of a few comments from a test, and it was for nothing."], "I made a defensible decision with the information I had.": ["e8.7", "With the information I had, I made a decision that I can defend."], "What I haven't seen is the cinemas' exit-poll data, broken down by audience.": ["e8.8", "I have not seen the cinemas' data from people leaving the film, split into different groups."], "In public, our messaging expressed full confidence throughout the campaign, and we never mentioned internal concerns.": ["e9.1", "In public, everything we said showed that we were completely sure about the film. We never talked about the worries inside the company."], "That's fairly standard.": ["e9.2", "That is quite normal."], "But about a month before release, my own team wrote an internal risk memo that rated “audience expectation mismatch” as a moderate-to-high risk.": ["e9.3", "But about a month before the film came out, my own team wrote a private note about risks. It said the danger that “the audience expects something different” was medium to high."], "That memo stayed in my department: risk memos go to the department head, there's no rule for when one must go higher, and it was never passed on to the wider leadership group.": ["e9.4", "The note stayed in my department. Notes about risks go to the head of the department, and there is no rule about when they must go higher. Nobody passed it on to the other bosses."], "Within 48 hours of release, my press office was answering questions about clips of the eviction scenes that had spread online without any context.": ["e9.5", "Less than 48 hours after the film came out, my press team was answering journalists' questions about clips of the family losing their home. People had shared the clips online without explaining them."], "What I don't know is whether the trailer that shipped was the version the studio originally tested.": ["e9.6", "I don't know if the final trailer was the same version that the studio tested first."], "A trailer can be recut in about ten days, and a new version can be online within two weeks.": ["x1.1", "You can edit a trailer again in about ten days, and a new version can be online in two weeks."], "Partner products, shop displays and the release date don't have to change for that: only the footage in the trailer does.": ["x1.2", "For this, the partners' products, the shop displays and the release date don't need to change. Only the pictures in the trailer change."], "The studios I trust screen every final cut against the finished film before anything goes out, in a room with the director, the story editor and the trailer editor.": ["x1.3", "The studios I trust watch every final trailer next to the finished film before they show it to anyone. The director, the story editor and the trailer editor are in the room."], "The director is usually the first to spot a mismatch, because they know which scenes carry the story.": ["x1.4", "The director usually notices first if the trailer and the film don't match, because the director knows which scenes tell the story."], "The worst case I see again and again: one version is tested, a later version ships, and nobody who has seen the film signs it off.": ["x1.5", "The worst thing, and I see it often: one version is tested, a later version goes out, and nobody who has seen the film says it is OK."], "Audiences who expect one kind of film and get another are about twice as likely to tell friends not to go, even when they rate the film itself as good.": ["x2.1", "When people expect one type of film and get a different type, they are about two times more likely to tell their friends not to see it. This is true even when they think the film itself is good."], "A surprise like that feels like being tricked.": ["x2.2", "A surprise like that makes people feel tricked."], "After it, the clips people share online are almost always the scenes the marketing left out.": ["x2.3", "After that, people almost always share clips online of the scenes that the advertising didn't show."], "They become the film's real trailer, and they travel faster than the paid one.": ["x2.4", "These clips become the film's real trailer, and they spread faster than the trailer the studio paid for."], "Good reviews rarely fix it: critics judge the film, while ordinary audiences judge the whole promise.": ["x2.5", "Good reviews don't often help. Critics judge the film, but normal audiences judge everything they were promised."], "Projecting confidence in public is normal: every studio does it.": ["x3.1", "Every studio acts very sure about its films in public. This is normal."], "What matters is what happens inside the building.": ["x3.2", "The important thing is what happens inside the company."], "In most of the post-mortems I've worked on, someone had written the problem down before launch, usually someone outside marketing.": ["x3.3", "In most of the studies I have done after a failure, someone wrote down the problem before the launch. Usually this person did not work in marketing."], "The warning died because there was no route for it: it went to a department head and stopped there.": ["x3.4", "Nothing happened with the warning because there was no way to pass it on: it went to a head of department and stopped there."], "The studios that learn from this set a rule: any written concern about whether a campaign matches its film goes straight to the final sign-off meeting, and somebody has to answer it in writing.": ["x3.5", "Studios that learn from this make a rule: any written worry about whether the advertising fits the film goes directly to the final meeting where the campaign is approved, and someone must answer it in writing."], "I compared 40 recent wide releases that opened against a rival blockbuster.": ["x4.1", "I looked at 40 recent big films that came out at the same time as another very big film."], "Head-to-head dates went with success about as often as with failure.": ["x4.2", "Films that came out on the same day as a rival film were successful about as often as they failed."], "A rival usually costs a film some of its opening weekend, not its second.": ["x4.3", "A rival film usually takes away some ticket sales on the first weekend, not on the second."], "The second-weekend drop is what tells you about word of mouth.": ["x4.4", "The fall in sales on the second weekend shows you what people are telling their friends."], "A healthy family film drops 30 to 40 per cent.": ["x4.5", "For a family film that is doing well, sales fall by 30 to 40 per cent."], "A drop of 60 per cent or more nearly always means audiences are telling each other not to go.": ["x4.6", "If sales fall by 60 per cent or more, it almost always means people are telling each other not to go."], "Bad luck exists, but it rarely explains a collapse in week two.": ["x4.7", "Bad luck is real, but it doesn't often explain why a film fails in its second week."], "Most studios treat a “definite recommend” score below 70 per cent as a real warning sign, not noise.": ["x5.1", "Most studios think that a “definite recommend” score under 70 per cent is a real warning, not just chance."], "Yet in roughly two out of three cases where a film misses that line, the studio goes ahead with its original marketing plan.": ["x5.2", "But in about two out of three cases when a film's score is under that line, the studio keeps its first advertising plan."], "On a normal studio film, about one comment card in ten says “confusing” or “not what I expected”.": ["x5.3", "For a normal studio film, about one comment card in ten says “confusing” or “not what I expected”."], "Above a quarter is rare, and when it happens it is almost always about the marketing, not the film.": ["x5.4", "It is unusual for more than a quarter of cards to say this. When it happens, the problem is almost always the advertising, not the film."], "A handful of angry cards is noise.": ["x5.5", "A few angry cards don't mean much."], "A pattern across hundreds of cards is a signal.": ["x5.6", "When hundreds of cards say the same thing, that is a real message."], "Most partner contracts protect three things: the release date, the film's title, and the logo, characters and colours on the partners' products.": ["x6.1", "Most partner contracts protect three things: the release date, the name of the film, and the logo, characters and colours on the partners' products."], "Penalties apply if the studio changes those.": ["x6.2", "The studio has to pay money if it changes these things."], "Trailers, posters and online adverts are usually the studio's own business.": ["x6.3", "The studio usually decides about trailers, posters and online adverts by itself."], "Changing them is rarely a breach, though partners like to be told in advance.": ["x6.4", "Changing them almost never breaks the contract, but partners like to know about it before."], "The most common mistake I see is a studio assuming its whole campaign is locked when only the products are.": ["x6.5", "The mistake I see most often: a studio thinks it cannot change any of its advertising, but only the products are fixed."], "Look, the partner programme was the best thing about Highstreet.": ["w1.1", "Listen, the deals with partner brands were the best part of Highstreet."], "Forty-two partners, products in over two thousand shops, the biggest programme in Beacon's history.": ["w1.2", "There were forty-two partners and products in more than two thousand shops. It was the biggest partner programme Beacon has ever had."], "Everyone loved the bright look.": ["w1.3", "Everyone liked the bright style."], "Then Stormbreak opened on the same weekend and took the families.": ["w1.4", "Then Stormbreak came out on the same weekend, and the families went to see that instead."], "That's the story.": ["w1.5", "That's what happened."], "And once partners sign, the campaign's locked.": ["w1.6", "And when partners sign a contract, you can't change the advertising any more."], "That's how these deals work.": ["w1.7", "That's how these deals are."], "Nobody could have changed course six weeks out.": ["w1.8", "Nobody could change the plan six weeks before the release."], "They paid for a lot of the advertising.": ["w1.9", "The partners paid for a lot of the advertising."], "Every mug and cushion in a shop window was a free advert for the film, and the partners promoted it in their own stores too.": ["w1.10", "Every mug and cushion in a shop window advertised the film for free. The partners also advertised the film in their own shops."], "You don't throw that away.": ["w1.11", "You don't give up something like that."], "Brilliantly, before release.": ["w1.12", "Very, very well, before the film came out."], "After the second weekend, most shops cut their prices by half, and some sent stock back.": ["w1.13", "After the second weekend, most shops made the products half price, and some shops sent products back."], "The products were fine.": ["w1.14", "There was nothing wrong with the products."], "Er… the release date, the title, and the look on the products: the colours, the logo, the game pieces.": ["w1.16", "[pause] The release date, the name of the film, and the style of the products: the colours, the logo and the game pieces."], "The trailer wasn't in the contracts.": ["w1.17", "The contracts didn't say anything about the trailer."], "A new trailer was never a breach.": ing and the film."], "That's the hardest answer for this building, so thank you.": ["b1.2", "People here will find that answer very hard to accept, so thank you."], "I've paused the Marble Run partner brief until the people who have seen the finished film agree what it's really about.": ["b1.3", "I have stopped the instructions for Marble Run's partners for now. I want the people who have seen the finished film to agree first on what it is really about."], "Kwame has offered to start a new home-release trailer for Highstreet straight away.": ["b1.4", "Kwame has offered to start making a new trailer for Highstreet's home release right now."], "I've also asked Naomi for the full card data: it's below.": ["b1.5", "I have also asked Naomi for all the data from the comment cards. You can see it below."], "Renata asked for the full test-screening data, so here it is, split by who came.": ["b1.7", "Renata asked for all the data from the test showings, so here it is, divided into groups of people."], "Families were about six in ten of the test audience.": ["b1.8", "About six in ten people in the test audience were families."], "The adults loved it.": ["b1.9", "The adults loved the film."], "The families had been promised something else.": ["b1.10", "The families were promised a different kind of film."], "If the date was the problem, Marble Run won't make the same mistake.": ["b2.2", "If the release date was the problem, Marble Run will not make the same mistake."], "I've moved it three weeks away from the big summer releases.": ["b2.3", "I have moved its release date three weeks, so it doesn't come out at the same time as the big summer films."], "Julia says the partners will need new dates on their packaging.": ["b2.4", "Julia says the partners will have to change the dates on their packaging."], "Renata has moved Marble Run's release by three weeks.": ["b2.6", "Renata has moved the release of Marble Run by three weeks."], "Our fourteen partners need new dates on their pa
