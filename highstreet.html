/* A locked Pro page (GUIDE 2i, 2n): only this cover until the class code is typed. The Pro page itself is encrypted
   in the lock block below and replaces this document once it is opened. Look: the Pro page's header, Lite's lockbox. */
:root{--bg:#FBFBF8;--surface:#fff;--sunk:#ECEFF3;--ink:#1D2733;--muted:#4A5562;--line:#D4D9E1;--blue:#2C5282;--amber:#C98A1B;--bad:#9B2C2C;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 16px}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;line-height:1.2;margin:4px 0 0;text-wrap:balance}
main .wrap{padding-block:22px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card img{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:12px}
.prose p{font-family:var(--serif);font-size:1.05rem;line-height:1.6;margin:0 0 .8rem}
.prose p:last-child{margin-bottom:0}
.lockbox{background:var(--sunk);border-radius:12px;padding:16px 18px;margin:18px 0 0}
.lockbox label{display:block;font-weight:600;margin-bottom:6px}
.lockbox input{font:inherit;font-size:1.3rem;letter-spacing:.2em;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;max-width:200px;margin:0 8px 8px 0;background:#fff;color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.lockbox .bad{color:var(--bad);margin:.4rem 0 0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>

cked. Then the film opened to a soft weekend, word of mouth never built, and by the second week it had almost vanished from conversation.\n\nIn film marketing, the campaign is a promise. The trailer, the key art (the main poster image) and the brand tie-ins all tell audiences what kind of film to expect. Before release, studios hold test screenings, where a recruited audience watches the film and fills in comment cards; many studios treat the share who would “definitely recommend” it as the key score. After release, cinemas run exit polls, and the drop in ticket sales from the first weekend to the second shows how strong word of mouth is.\n\nTwo old stories shape how Beacon's leaders think about warnings. Two years ago, Beacon pulled and reshot a campaign after a handful of negative test-screening comments, at a cost of several million dollars, and the original version, quietly tested afterwards, would have done just as well: the Halbrook False Alarm. On an earlier release, though, a mid-level story editor raised concerns early, leadership delayed the trailer by three weeks to recut it, and the film modestly outperformed expectations: the Sentinel Save."},"lock":{"v":1,"teach":{"2026-11":"7Wlb0rCanMLTNrBJYz7JAzL8hkkO0Gq5r4RpAKV1NS5GjmqT6pXMQgjU5zJrSXvyF2VNVUmKdE1CGPbJ","2026-12":"Qv2Np54R2R6fEE3UFvnboR8tZSRb1VrBOW7RB37er8shshY3rNVp4zugRO54pqQeUo92CQSwI3hzqUAu","2027-01":"aBM5apYaJZ67Tam1zpLvGRryeBcETM4glZS+rcTxRem3W3f5dQPYgeYW4WwD1THUA1tn/xHyuxgZ1ZLj","2027-02":"1pcoHvMmUYNipPsmVDlyK/zt6W60g1UOiBLR0RjbgdCfcy5qjH1Xhr4AuJL8/ZDW980yuFr6D/xMtn7Q","2027-03":"x+3JDu5TGLXdB72a7lr1qO0DPTzLue1YJ1yWKgqTfcjfn61mypzy7RJSuTtDwpXaFyrKjhbdqt6JkRgF","2027-04":"p/hH6J89r99m18vZ6k+EBqXkGELkhM4kLBl3P9RQXnyBXIoG4C7Au5yY9K019o+xAnqj2qwRCdfJchEm","2027-05":"5Et1U3AHSX//ROmd5mItfcbJ8n+lST7ewTobgf/3anoJXmDoo8rEp6zXibtpJplwWP4Ujlj6Q8FtnZnB"},"slot":7200,"iter":30000,"iv":"Y3x0/35lYJBg7+EY","data":"NKGqlbdiytHPN8hgeUXnncjCD6mZqNKglpElzJeFC01mAqf88PGc9PWuNliwOxeqOCthy3ei5aFypGkNX3bWv0rWV+875c <script>
/* ---------- class code for a Pro page (studio/lock.py, build.py build_pro): the same code as the Lite sim (C.id is
   the Lite code), typed here; the key opens the Pro page, which then replaces this document. tryCode and teacherLink
   are copied from studio/template.html (build.py refuses a shell whose copies differ). The key stays in this tab
   (sessionStorage) so a reload reopens the page. Everything is inside this function: the Pro page's own globals
   (S, ROLES, ...) are declared after document.open() in the same window. ---------- */
(function () {
  "use strict";
  let P = null; try { P = JSON.parse(document.getElementById("lock").textContent); } catch (e) {}
  if (!P) return;
  const C = P.cover, L = P.lock, KEY = "simlearn-unlock:" + C.page;
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const aes = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const open = async (key, ivAndCt) => new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: ivAndCt.slice(0, 12)}, key, ivAndCt.slice(12)));
  async function finish(raw) {
    let html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(L.iv)}, await aes(raw), b64(L.data)));
    if (C.image) html = html.replace('const PRO_COVER="";', () => "const PRO_COVER=" + JSON.stringify(C.image) + ";");   // one copy of the picture
    try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  async function tryCode(code) {
    const n = code.toUpperCase().replace(/[^A-Z0-9]/g, ""), now = Math.floor(Date.now() / 1000 / L.slot);
    for (const s of [now, now - 1, now + 1]) {   // + 1: a phone a few minutes slow at the start of a slot
      const wrap = L.slots[String(s)];
      if (!wrap) continue;
      const base = await crypto.subtle.importKey("raw", enc.encode(n), "PBKDF2", false, ["deriveKey"]);
      const kek = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: enc.encode(C.id + "|" + s), iterations: L.iter},
                                               base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      try { return await open(kek, b64(wrap)); } catch (e) {}
    }
    return null;
  }
  function cover(msg) {
    const ctx = (C.context || "").split("\n\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
    document.title = C.tab || C.title;
    document.getElementById("app").innerHTML = `
    <header><div class="wrap"><div class="brand">SimLearn<span>PRO</span></div><h1>${esc(C.title)}</h1></div></header>
    <main><div class="wrap"><section class="card">
      ${C.image ? `<img src="${C.image}" alt="">` : ""}
      ${ctx ? `<div class="prose">${ctx}</div>` : ""}
      <div class="lockbox">
        <label for="code">This simulation opens in class. Type the class code your teacher shows you.</label>
        <input id="code" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12" placeholder="4-digit code">
        <button type="button" class="btn" id="unlock">Open</button>
        <p class="bad" id="bad" role="alert">${msg || ""}</p>
      </div>
    </section></div></main>`;
    let busy = false;
    const go = async () => {
      const v = document.getElementById("code").value;
      if (!v.trim() || busy) return;
      busy = true;
      document.getElementById("unlock").disabled = true;
      document.getElementById("bad").textContent = "";
      let raw = null; try { raw = await tryCode(v); } catch (e) {}
      if (raw) return finish(raw);
      busy = false;
      document.getElementById("unlock").disabled = false;
      document.getElementById("bad").textContent = L.until && new Date().toISOString().slice(0, 10) > L.until
        ? "This page needs updating before it can open. Please tell your teacher."
        : "That code doesn't work. Check the spelling, or ask your teacher: the code changes every couple of hours.";
    };
    document.getElementById("unlock").onclick = go;
    document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }
  async function teacherLink() {   // "#t=..." from the teacher tool: opens the page this month without a code
    const h = location.hash.match(/^#t=([A-Za-z0-9_-]+)$/);
    if (!h || !L.teach) return null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    const raw = Uint8Array.from(atob(h[1].replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - h[1].length % 4) % 4)), c => c.charCodeAt(0));
    const key = await aes(raw), d = new Date();
    const months = [-1, 0, 1].map(k => { const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1)); return x.toISOString().slice(0, 7); });
    for (const m of months) {
      if (!L.teach[m]) continue;
      try { return await open(key, b64(L.teach[m])); } catch (e) {}
    }
    return null;
  }
  let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (!window.crypto || !crypto.subtle) return cover("This browser can't open the class code. Try another browser, or ask your teacher.");
  if (saved) finish(b64(saved)).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} cover(); });
  else {
    const hadLink = /^#t=/.test(location.hash), expired = "This teacher link has expired. Get a new one from the teacher tool, or type the class code.";
    teacherLink().then(raw => raw ? finish(raw) : cover(hadLink ? expired : "")).catch(() => cover(hadLink ? expired : ""));
  }
})();
